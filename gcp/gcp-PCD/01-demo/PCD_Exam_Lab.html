<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PCD Exam Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
[hidden]{display:none!important} img{max-width:100%}

/* Layout: technical field manual — fixed left index of the official exam guide, reading column on the right, everything keyed to objective numbers. */
:root {
  --bg: #f5f6f4; --panel: #ffffff; --ink: #18211d; --muted: #5d6963; --line: #dce2de; --soft: #eef1ee;
  --accent: #0d6b5c; --accent-ink: #ffffff; --accent-soft: #dcefe9;
  --s1: #3b55b3; --s2: #b2701b; --s3: #0d6b5c; --s4: #a63d5b;
  --good: #1f7a3f; --warn: #a96b00; --bad: #b3261e; --info: #2c62b0;
  --code-bg: #f0f3f1; --code-ink: #1f2a25; --c-com: #6c7a73; --c-kw: #8a3ea8; --c-str: #1b7a46; --c-key: #2c62b0; --c-ann: #a66300;
  --node-svc: #e3edf9; --node-svc-l: #3b55b3; --node-data: #fbeeda; --node-data-l: #b2701b; --node-ext: #edf1ef; --node-ext-l: #5d6963; --node-client: #ffffff; --node-auth: #f7e1e8; --node-auth-l: #a63d5b;
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif; --f-body: "Inter", "Segoe UI", system-ui, sans-serif; --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121715; --panel: #1a211e; --ink: #e5ece8; --muted: #9aa8a1; --line: #2c3632; --soft: #202925;
  --accent: #4fc2a9; --accent-ink: #0b1512; --accent-soft: #1d3a33;
  --s1: #8ea2f0; --s2: #e5a85a; --s3: #4fc2a9; --s4: #e88aa6;
  --good: #5cc98a; --warn: #e5a85a; --bad: #f08880; --info: #8eb4f0;
  --code-bg: #0f1412; --code-ink: #dce6e1; --c-com: #7d8d86; --c-kw: #d39ae8; --c-str: #8fd6a8; --c-key: #8eb4f0; --c-ann: #e5b56a;
  --node-svc: #1e2a45; --node-svc-l: #8ea2f0; --node-data: #3a2c17; --node-data-l: #e5a85a; --node-ext: #222b27; --node-ext-l: #9aa8a1; --node-client: #1a211e; --node-auth: #3a2029; --node-auth-l: #e88aa6;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121715; --panel: #1a211e; --ink: #e5ece8; --muted: #9aa8a1; --line: #2c3632; --soft: #202925;
  --accent: #4fc2a9; --accent-ink: #0b1512; --accent-soft: #1d3a33;
  --s1: #8ea2f0; --s2: #e5a85a; --s3: #4fc2a9; --s4: #e88aa6;
  --good: #5cc98a; --warn: #e5a85a; --bad: #f08880; --info: #8eb4f0;
  --code-bg: #0f1412; --code-ink: #dce6e1; --c-com: #7d8d86; --c-kw: #d39ae8; --c-str: #8fd6a8; --c-key: #8eb4f0; --c-ann: #e5b56a;
  --node-svc: #1e2a45; --node-svc-l: #8ea2f0; --node-data: #3a2c17; --node-data-l: #e5a85a; --node-ext: #222b27; --node-ext-l: #9aa8a1; --node-client: #1a211e; --node-auth: #3a2029; --node-auth-l: #e88aa6;
  color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--f-body); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
a { color: var(--accent); text-underline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: clamp(1.6rem, 3vw, 2.2rem); margin: .2em 0 .3em; }
h2 { font-size: 1.25rem; margin: 0 0 .6em; } h3 { font-size: 1.05rem; margin: 1.2em 0 .5em; }
code { font-family: var(--f-mono); font-size: .86em; background: var(--soft); padding: .1em .35em; border-radius: 4px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.muted { color: var(--muted); } .small { font-size: .85rem; } .center { text-align: center; justify-content: center; }
/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { font: 700 1.05rem var(--f-display); color: var(--ink); text-decoration: none; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.brand i { width: 22px; height: 22px; border-radius: 5px; background: conic-gradient(var(--s1) 0 32%, var(--s2) 0 55%, var(--s3) 0 79%, var(--s4) 0); display: inline-block; }
.top form { flex: 1; max-width: 460px; margin-left: auto; }
.search { width: 100%; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; }
.iconbtn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 7px 10px; cursor: pointer; font: inherit; }
#navbtn { display: none; }
/* shell */
.shell { display: grid; grid-template-columns: 280px minmax(0, 1fr); }
#nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 57px); align-self: start; height: calc(100vh - 57px); overflow-y: auto; border-right: 1px solid var(--line); padding: 14px 10px 40px max(10px, env(safe-area-inset-left, 0px)); font-size: .9rem; background: var(--panel); }
#nav a { display: block; padding: 6px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; }
#nav a:hover { background: var(--soft); } #nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
#nav a.sub { font-weight: 600; font-size: .85rem; margin-top: 4px; } #nav a.topic { padding-left: 22px; color: var(--muted); font-size: .85rem; } #nav a.topic.done::after { content: " ✓"; color: var(--good); }
#nav summary { cursor: pointer; padding: 7px 6px; font-weight: 600; list-style: none; display: flex; gap: 6px; align-items: center; } #nav summary small { margin-left: auto; color: var(--muted); }
.navlab { text-transform: uppercase; letter-spacing: .08em; font-size: .7rem; color: var(--muted); margin: 16px 10px 4px; font-weight: 600; }
.soon { color: var(--muted); font-weight: 400; }
main { padding-block: 24px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1040px; width: 100%; }
@media (min-width: 900px) { main { padding-left: 36px; padding-right: 36px; } }
@media (max-width: 899px) {
  .shell { grid-template-columns: minmax(0, 1fr); } #navbtn { display: inline-block; }
  #nav { position: fixed; inset: calc(env(safe-area-inset-top, 0px) + 57px) auto 0 0; width: min(86vw, 320px); z-index: 25; transform: translateX(-102%); transition: transform .2s; height: auto; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  body.navopen #nav { transform: none; } .brand span { display: none; }
}
/* page */
.pagehead { margin-bottom: 18px; } .eyebrow { text-transform: uppercase; letter-spacing: .08em; font-size: .72rem; color: var(--muted); font-weight: 600; margin: 0; }
.lead { font-size: 1.05rem; color: var(--muted); max-width: 68ch; margin: 0 0 12px; }
.crumbs { font-size: .85rem; color: var(--muted); margin-bottom: 8px; } .crumbs a { color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; margin: 0 0 16px; min-width: 0; }
.panel.warnp { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); } .panel.danger { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; margin-bottom: 16px; } .grid2 > .panel { margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; } .grow { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 8px 14px; font: 600 .9rem var(--f-body); cursor: pointer; text-decoration: none; display: inline-block; }
.btn:hover { border-color: var(--accent); } .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); } .btn.okb { color: var(--good); border-color: var(--good); } .btn.dangerb { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.sm { padding: 5px 10px; font-size: .82rem; } .btn:disabled { opacity: .45; cursor: default; }
.chip { display: inline-block; font: 600 .72rem var(--f-mono); padding: 2px 7px; border-radius: 999px; background: var(--soft); color: var(--muted); vertical-align: middle; }
.chip.s1 { background: var(--s1); color: var(--panel); } .chip.s2 { background: var(--s2); color: var(--panel); } .chip.s3 { background: var(--s3); color: var(--panel); } .chip.s4 { background: var(--s4); color: var(--panel); }
.chip.ghost { background: transparent; border: 1px solid var(--line); } .chip.ok { background: var(--accent-soft); color: var(--accent); }
.tick { padding-left: 1.1em; } .tick li { margin: 4px 0; } .steps li { margin: 6px 0; } .links li { margin: 4px 0; }
.tscroll { overflow-x: auto; margin: 10px 0; } table { border-collapse: collapse; width: 100%; font-size: .9rem; } th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); } thead th { font-family: var(--f-display); background: var(--soft); }
/* kpis and bars */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 12px 0; } .kpis > div { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; font-size: .8rem; color: var(--muted); }
.kpis span { display: block; font: 700 1.5rem var(--f-display); color: var(--ink); font-variant-numeric: tabular-nums; } .kpis .bad span { color: var(--bad); } .kpis.big span { font-size: 1.8rem; }
.bar { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar i.s1 { background: var(--s1); } .bar i.s2 { background: var(--s2); } .bar i.s3 { background: var(--s3); } .bar i.s4 { background: var(--s4); }
.gauge .bar { height: 14px; } .gauge p { margin: 6px 0; } .gauge.good i { background: var(--good); } .gauge.warn i { background: var(--warn); } .gauge.info i { background: var(--info); } .gauge.muted i { background: var(--muted); }
.secbar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 8px; align-items: center; margin: 8px 0; font-size: .85rem; } .secbar .bar { grid-column: 1 / -1; } .secbar .w { color: var(--muted); font-variant-numeric: tabular-nums; }
.recent { display: flex; flex-wrap: wrap; gap: 6px; } .recent a { padding: 3px 9px; border: 1px solid var(--line); border-radius: 99px; font-size: .82rem; text-decoration: none; }
/* objective list */
.objlist { list-style: none; padding: 0; margin: 0; } .objlist li { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); }
.objt { flex: 1 1 360px; min-width: 0; } .objlinks { font-size: .82rem; margin-top: 3px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; } .seg button { border: 0; background: var(--panel); color: var(--muted); padding: 5px 10px; font: 600 .78rem var(--f-body); cursor: pointer; } .seg button + button { border-left: 1px solid var(--line); }
.seg button.on.s0 { background: var(--soft); color: var(--ink); } .seg button.on.s1 { background: color-mix(in srgb, var(--warn) 20%, var(--panel)); color: var(--warn); } .seg button.on.s2 { background: color-mix(in srgb, var(--good) 20%, var(--panel)); color: var(--good); }
.legend { margin-bottom: 10px; }
.plan tr.now td { background: var(--accent-soft); } .plan a { margin-right: 4px; } .plan a.done::after { content: " ✓"; color: var(--good); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 12px; } .tcard { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); text-decoration: none; color: var(--ink); } .tcard:hover { border-color: var(--accent); } .tcard b { font-family: var(--f-display); } .tcard span:last-child { color: var(--muted); font-size: .88rem; }
/* topic body */
.body { max-width: 78ch; } .body > p, .body > ul, .body > ol { max-width: 70ch; }
.goals ul { margin: 0; }
.consider { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; margin-bottom: 16px; } .consider > div { border-top: 3px solid var(--accent); background: var(--panel); border-radius: 0 0 var(--r) var(--r); padding: 4px 14px 10px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); } .consider h3 { margin-top: 8px; font-size: .95rem; } .consider p { margin: 0; font-size: .9rem; }
.consider > div:nth-child(2) { border-top-color: var(--s4); } .consider > div:nth-child(3) { border-top-color: var(--s2); }
.note { width: 100%; min-height: 170px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; resize: vertical; }
.prevnext { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 16px; } .prevnext a { font-weight: 600; }
/* code */
figure.code { margin: 14px 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--code-bg); min-width: 0; }
figure.code figcaption { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; font: 600 .75rem var(--f-mono); color: var(--muted); border-bottom: 1px solid var(--line); }
.copy { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; font: 600 .72rem var(--f-body); padding: 3px 8px; cursor: pointer; }
figure.code pre { margin: 0; padding: 12px 14px; overflow-x: auto; font: .82rem/1.55 var(--f-mono); color: var(--code-ink); } figure.code code { background: none; padding: 0; font-size: inherit; }
.c-com { color: var(--c-com); font-style: italic; } .c-kw { color: var(--c-kw); font-weight: 600; } .c-str { color: var(--c-str); } .c-key { color: var(--c-key); } .c-ann { color: var(--c-ann); } .c-pr { color: var(--muted); }
pre.inline { background: var(--code-bg); padding: 8px 10px; border-radius: 6px; overflow-x: auto; font: .8rem var(--f-mono); }
/* diagrams */
figure.diagram { margin: 16px 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; } .dscroll { overflow-x: auto; } figure.diagram svg { width: 100%; height: auto; display: block; font-family: var(--f-body); }
figure.diagram figcaption { font-size: .85rem; color: var(--muted); margin: 6px 4px 0; }
.dn rect { stroke-width: 1.5; } .dn text { font-size: 13px; font-weight: 600; fill: var(--ink); } .dn text.sub { font-size: 11px; font-weight: 400; fill: var(--muted); }
.dn.svc rect { fill: var(--node-svc); stroke: var(--node-svc-l); } .dn.data rect { fill: var(--node-data); stroke: var(--node-data-l); } .dn.ext rect { fill: var(--node-ext); stroke: var(--node-ext-l); } .dn.client rect { fill: var(--node-client); stroke: var(--ink); stroke-dasharray: 4 3; } .dn.auth rect { fill: var(--node-auth); stroke: var(--node-auth-l); }
.de line { stroke: var(--muted); stroke-width: 1.6; } .de.dash line { stroke-dasharray: 5 4; } .de text { font-size: 11px; fill: var(--ink); paint-order: stroke; stroke: var(--panel); stroke-width: 4px; } .dah { fill: var(--muted); }
.dz rect { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 6 4; } .dz text { font-size: 11px; fill: var(--muted); font-weight: 600; }
.dlegend { display: flex; flex-wrap: wrap; gap: 10px; font-size: .72rem; color: var(--muted); margin: 6px 4px 0; } .lg::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; border: 1.5px solid; }
.lg.svc::before { background: var(--node-svc); border-color: var(--node-svc-l); } .lg.data::before { background: var(--node-data); border-color: var(--node-data-l); } .lg.ext::before { background: var(--node-ext); border-color: var(--node-ext-l); } .lg.client::before { background: var(--node-client); border-color: var(--ink); border-style: dashed; } .lg.auth::before { background: var(--node-auth); border-color: var(--node-auth-l); }
/* compare */
.cmp { margin: 16px 0; } .cmphead { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; } .cmppick { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .85rem; }
.cmpt th[scope=row] { font-weight: 600; width: 160px; color: var(--muted); } .cmpnote { font-size: .85rem; color: var(--muted); }
/* sims */
.sim { border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; background: var(--bg); margin: 12px 0; min-width: 0; } .simhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; margin-bottom: 8px; }
.chk { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 6px 14px; font-size: .9rem; } .chk label { display: flex; gap: 8px; align-items: flex-start; }
.form4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 10px; margin-bottom: 10px; } .form4 label { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--muted); font-weight: 600; }
.form4 input, .form4 select { padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--ink); font: 500 .92rem var(--f-body); }
.simout { margin-top: 10px; } .simout .pick { font-size: 1.1rem; margin: 6px 0; } .simout li.bad, .lessons li { color: var(--bad); } .lessons li { color: var(--ink); }
.rev { display: grid; grid-template-columns: auto auto auto minmax(80px, 1fr) 3.2em; gap: 8px; align-items: center; margin: 6px 0; } .rev input { width: 100%; } .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.sw.c0, .dots i.c0 { background: var(--s1); } .sw.c1, .dots i.c1 { background: var(--s2); }
.dots { display: flex; flex-wrap: wrap; gap: 3px; margin: 10px 0; } .dots i { width: 9px; height: 9px; border-radius: 2px; } .dots p { width: 100%; margin: 6px 0 0; font-size: .85rem; }
.att { display: inline-block; font: 600 .72rem var(--f-mono); padding: 2px 6px; border-radius: 5px; margin: 2px 3px 2px 0; background: var(--soft); } .att.ack { background: color-mix(in srgb, var(--good) 22%, var(--panel)); color: var(--good); } .att.nack, .att.loop { background: color-mix(in srgb, var(--bad) 18%, var(--panel)); color: var(--bad); } .att.late { background: color-mix(in srgb, var(--warn) 22%, var(--panel)); color: var(--warn); } .att.dlq, .att.blk { background: var(--ink); color: var(--panel); }
.pst td { padding: 4px 8px; }
/* questions */
.q { border-top: 1px solid var(--line); padding: 14px 0; } .q:first-of-type { border-top: 0; } .qmeta { display: flex; gap: 6px; flex-wrap: wrap; } .qtext { font-weight: 500; margin: 8px 0; max-width: 75ch; }
.opts { display: grid; gap: 6px; } .opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--panel); } .opt:hover { border-color: var(--accent); } .opt input { margin-top: 4px; }
.ol { font: 700 .8rem var(--f-mono); color: var(--muted); margin-top: 2px; } .opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 10%, var(--panel)); } .opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--panel)); }
.qactions { margin-top: 8px; } .fb { margin-top: 10px; padding: 10px 12px; border-radius: 8px; border-left: 4px solid var(--good); background: var(--soft); } .fb.ko { border-left-color: var(--bad); } .whynot { margin-top: 6px; } .whynot summary { cursor: pointer; font-weight: 600; font-size: .88rem; } .qref { font-size: .8rem; margin: 6px 0 0; overflow-wrap: anywhere; } .hint { color: var(--warn); font-size: .88rem; }
/* exam */
.exbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; font-weight: 600; } .timer { font: 700 1rem var(--f-mono); } .timer.bad { color: var(--bad); }

<script>
// ===== Official exam guide (current version, attached PDF). Each bullet is a tracked objective. =====
const EXAM = { code: 'Professional Cloud Developer', date: '2027-02-17T09:00:00+01:00', minutes: 120, qmin: 50, qmax: 60 };
const SECTIONS = [
 { id: 's1', n: 1, title: 'Designing highly scalable, secure, and reliable cloud-native applications', w: 32, subs: [

 { id: 's2', n: 2, title: 'Building and testing applications', w: 23, subs: [

 { id: 's3', n: 3, title: 'Configuring cloud-native applications for deployment', w: 24, subs: [

 { id: 's4', n: 4, title: 'Integrating applications with Google Cloud services', w: 21, subs: [
  { id: '4.1', title: 'Integrating applications with data and storage services', items: [

   'Making API calls by using supported options (Cloud Client Libraries, REST API, gRPC, API Explorer): batching requests, restricting return data, paginating results, caching results, handling errors (e.g., exponential backoff)',

// objective id helper: '1.1.3' = sub 1.1, bullet 3 (1-based)
const OBJ = {}; SECTIONS.forEach(s => s.subs.forEach(u => u.items.forEach((t, i) => { const id = u.id + '.' + (i + 1); OBJ[id] = { id, text: t, sub: u.id, sec: s.id, w: s.w / s.subs.reduce((a, x) => a + x.items.length, 0) }; })));
// Delivery plan: which deliveries bring each sub-objective's full content
const DELIVERY = { '1.1': 1, '1.2': 1, '1.3': 1, '4.1': 1, '4.2': 1, '3.1': 1, '3.2': 1, '2.1': 1, '2.2': 1, '2.3': 1, '4.3': 1 };

// ===================== CORE =====================
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const store = {
  get(k, d) { try { const v = localStorage.getItem('pcd_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pcd_' + k, JSON.stringify(v)); } catch (e) { } },
  del(k) { try { localStorage.removeItem('pcd_' + k); } catch (e) { } },
};
// ---------- progress state ----------
const P = {
  obj: () => store.get('obj', {}),             // objective id -> 0/1/2
  setObj(id, v) { const o = P.obj(); o[id] = v; store.set('obj', o); },
  topics: () => store.get('topics', {}),       // topic id -> true
  setTopic(id, v) { const o = P.topics(); o[id] = v; store.set('topics', o); },
  marks: () => store.get('marks', []),
  toggleMark(id) { const m = P.marks(); const i = m.indexOf(id); i < 0 ? m.push(id) : m.splice(i, 1); store.set('marks', m); return i < 0; },
  notes: () => store.get('notes', {}),
  setNote(id, t) { const n = P.notes(); if (t.trim()) n[id] = t; else delete n[id]; store.set('notes', n); },
  answers: () => store.get('answers', {}),     // qid -> {n, ok, last}
  record(qid, ok) { const a = P.answers(); const r = a[qid] || { n: 0, ok: 0 }; r.n++; if (ok) r.ok++; r.last = ok; a[qid] = r; store.set('answers', a); },
  exams: () => store.get('exams', []),
  recent: () => store.get('recent', []),
  visit(v) { if (!v || v === 'dashboard') return; const r = P.recent().filter(x => x !== v); r.unshift(v); store.set('recent', r.slice(0, 6)); store.set('last', v); },
  time: () => store.get('time', 0),
};
// study time: count seconds while the page is visible and the user is active
let _active = Date.now();
['click', 'keydown', 'scroll', 'mousemove'].forEach(e => addEventListener(e, () => _active = Date.now(), { passive: true }));
setInterval(() => { if (document.visibilityState === 'visible' && Date.now() - _active < 120000) store.set('time', P.time() + 15); }, 15000);

// ---------- code blocks ----------
function hlCode(lang, src) {
  let s = esc(src);
  const C = (re, cls) => { s = s.replace(re, m => `<span class="${cls}">${m}</span>`); };
  if (lang === 'bash') { s = s.replace(/(^|\n)(\s*#[^\n]*)/g, '$1<span class="c-com">$2</span>'); s = s.replace(/(^|\n)(\$ )/g, '$1<span class="c-pr">$2</span>'); s = s.replace(/(\s)(--?[a-z][\w-]*)/g, '$1<span class="c-key">$2</span>'); }
  else if (lang === 'yaml') { s = s.replace(/(^|\n)(\s*#[^\n]*)/g, '$1<span class="c-com">$2</span>'); s = s.replace(/(^|\n)(\s*-?\s*)([\w.\-/]+)(:)/g, '$1$2<span class="c-key">$3</span>$4'); }
  else { s = s.replace(/(\/\/[^\n]*|\/\*[\s\S]*?\*\/)/g, '<span class="c-com">$1</span>'); s = s.replace(/(&quot;[^&\n]*?&quot;)/g, '<span class="c-str">$1</span>'); s = s.replace(/\b(public|private|final|class|record|return|new|import|package|void|static|var|if|else|try|catch|throw|throws|interface|extends|implements|for|while|syntax|message|service|rpc|returns|stream|string|int32|int64|FROM|AS|COPY|RUN|ENTRYPOINT|WORKDIR|EXPOSE|ENV|USER|ARG)\b/g, '<span class="c-kw">$1</span>'); s = s.replace(/(@\w+)/g, '<span class="c-ann">$1</span>'); }
  return s;
}
function code(lang, src, title) {

}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]'); if (!b) return;
  const txt = b.closest('figure').querySelector('code').innerText;
  const done = () => { b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1400); };
  try { navigator.clipboard.writeText(txt).then(done, () => sel(b)); } catch (er) { sel(b); }
  function sel(b) { const r = document.createRange(); r.selectNodeContents(b.closest('figure').querySelector('code')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Selected: press Ctrl+C'; }
});

// ---------- architecture diagrams (SVG from a small spec) ----------
// spec: {w, h, nodes: [[id, x, y, w, h, label, kind, sub]], edges: [[from, to, label, style]], zones: [[x, y, w, h, label]]}
function diagram(spec, caption) {
  const N = {}; spec.nodes.forEach(n => N[n[0]] = { x: n[1], y: n[2], w: n[3], h: n[4] });
  const clip = (a, b) => { // point on a's border towards b's center
    const ax = a.x + a.w / 2, ay = a.y + a.h / 2, bx = b.x + b.w / 2, by = b.y + b.h / 2; const dx = bx - ax, dy = by - ay;
    const sx = dx ? (a.w / 2) / Math.abs(dx) : Infinity, sy = dy ? (a.h / 2) / Math.abs(dy) : Infinity; const t = Math.min(sx, sy);
    return [ax + dx * t, ay + dy * t];
  };
  const zones = (spec.zones || []).map(z => `<g class="dz"><rect x="${z[0]}" y="${z[1]}" width="${z[2]}" height="${z[3]}" rx="10"/><text x="${z[0] + 10}" y="${z[1] + 16}">${esc(z[4])}</text></g>`).join('');
  const edges = spec.edges.map(e => { const a = N[e[0]], b = N[e[1]]; const p = clip(a, b), q = clip(b, a); const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
    return `<g class="de ${e[3] || ''}"><line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" marker-end="url(#ah)"/>${e[2] ? `<text x="${mx}" y="${my - 5}" text-anchor="middle">${esc(e[2])}</text>` : ''}</g>`; }).join('');
  const nodes = spec.nodes.map(n => `<g class="dn ${n[6] || 'svc'}"><rect x="${n[1]}" y="${n[2]}" width="${n[3]}" height="${n[4]}" rx="8"/><text x="${n[1] + n[3] / 2}" y="${n[2] + n[4] / 2 + (n[7] ? -3 : 4)}" text-anchor="middle">${esc(n[5])}</text>${n[7] ? `<text class="sub" x="${n[1] + n[3] / 2}" y="${n[2] + n[4] / 2 + 12}" text-anchor="middle">${esc(n[7])}</text>` : ''}</g>`).join('');
  return `<figure class="diagram"><div class="dscroll"><svg viewBox="0 0 ${spec.w} ${spec.h}" style="min-width:${Math.min(spec.w, 560)}px" role="img" aria-label="${esc(caption || 'diagram')}"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dah"/></marker></defs>${zones}${edges}${nodes}</svg></div>${caption ? `<figcaption>${caption}</figcaption>` : ''}<div class="dlegend"><span class="lg client">client</span><span class="lg svc">Google Cloud service</span><span class="lg data">data store</span><span class="lg ext">your code / external</span><span class="lg auth">identity boundary</span></div></figure>`;
}

// ---------- questions ----------
function qHTML(q, opts = {}) {
  const multi = q.type === 'multi';
  return `<div class="q" data-q="${q.id}"><div class="qmeta"><span class="chip s${q.obj[0]}">${q.obj}</span><span class="chip ghost">${multi ? `Choose ${q.a.length}` : 'Choose 1'}</span>${q.kind ? `<span class="chip ghost">${q.kind}</span>` : ''}</div>
   <p class="qtext">${q.q}</p><div class="opts">${q.o.map((o, i) => `<label class="opt"><input type="${multi ? 'checkbox' : 'radio'}" name="q-${opts.ns || ''}${q.id}" value="${i}"><span class="ol">${String.fromCharCode(65 + i)}</span><span>${o}</span></label>`).join('')}</div>
   ${opts.check === false ? '' : `<div class="qactions"><button class="btn primary sm" type="button" data-check>Check answer</button></div>`}<div class="qfb" aria-live="polite"></div></div>`;
}
function qChosen(el) { return $$('input:checked', el).map(i => +i.value).sort((a, b) => a - b); }
function qGrade(q, chosen) { const a = [...q.a].sort((x, y) => x - y); return chosen.length === a.length && chosen.every((v, i) => v === a[i]); }
function qFeedback(q, el, chosen) {
  const ok = qGrade(q, chosen);
  $$('.opt', el).forEach((l, i) => { l.classList.toggle('right', q.a.includes(i)); l.classList.toggle('wrong', chosen.includes(i) && !q.a.includes(i)); $('input', l).disabled = true; });
  const wrongs = q.o.map((o, i) => i).filter(i => !q.a.includes(i) && q.w && q.w[i]).map(i => `<li><b>${String.fromCharCode(65 + i)}</b> ${q.w[i]}</li>`).join('');
  $('.qfb', el).innerHTML = `<div class="fb ${ok ? 'ok' : 'ko'}"><b>${ok ? 'Correct.' : 'Not quite.'}</b> ${q.why}${wrongs ? `<details class="whynot"><summary>Why the other options are wrong</summary><ul>${wrongs}</ul></details>` : ''}${q.ref ? `<p class="qref">Docs: <a href="${q.ref}" target="_blank" rel="noopener">${esc(q.ref.replace(/^https:\/\//, ''))}</a></p>` : ''}</div>`;
  return ok;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-check]'); if (!b) return;
  const el = b.closest('.q'); const q = QMAP[el.dataset.q]; const ch = qChosen(el);
  if (!ch.length) { $('.qfb', el).innerHTML = '<p class="hint">Pick an answer first.</p>'; return; }
  P.record(q.id, qFeedback(q, el, ch)); b.remove();
});

}
function mountCompare(el) {
  const C = COMPARE[el.dataset.cmp]; const t = $('table', el);

}

// ===================== OBJECTIVE 1.1 · Designing high-performing applications and APIs =====================
const BOOK = { ddia: 'Designing Data-Intensive Applications (Kleppmann)', sre: 'Site Reliability Engineering (Google)', rit: 'Release It! 2nd ed. (Nygard)', k8p: 'Kubernetes Patterns 2nd ed. (Ibryam, Huß)', bm: 'Building Microservices 2nd ed. (Newman)', pkt: 'PCD Exam Guide (Packt, 2021 — previous exam version)', cdj: 'Continuous Delivery with Docker and Jenkins (Leszko)' };
const TOPICS = [];
const T = t => TOPICS.push(t);

// ------------------------------------------------------------------ 1
T({ id: 'platform', sub: '1.1', obj: ['1.1.1'], title: 'Choosing the compute platform: Cloud Run, GKE or Compute Engine', mins: 45,

<p>All three run your code in containers or VMs. What changes is <b>who operates what</b>. Moving right gives you more control and more operational work.</p>
${diagram({ w: 760, h: 170, zones: [[10, 10, 740, 150, 'More managed  →  More control']], nodes: [
 ['cr', 30, 60, 160, 60, 'Cloud Run', 'svc', 'services · jobs · functions'], ['ap', 215, 60, 160, 60, 'GKE Autopilot', 'svc', 'Google runs nodes'], ['st', 400, 60, 160, 60, 'GKE Standard', 'svc', 'you manage node pools'], ['ce', 585, 60, 150, 60, 'Compute Engine', 'svc', 'you manage the VM / OS']],

<h3>Keyword → platform</h3>
<div class="tscroll"><table><thead><tr><th>Scenario says…</th><th>Points to</th><th>Why</th></tr></thead><tbody>
<tr><td>stateless HTTP API, spiky or unpredictable traffic, "minimise operations", scale to zero</td><td><b>Cloud Run service</b></td><td>Request-driven autoscaling, pay-per-use, no cluster to run</td></tr>
<tr><td>batch task that runs to completion, nightly export, parallel shards</td><td><b>Cloud Run job</b></td><td>Tasks with retries and parallelism, no HTTP endpoint needed</td></tr>
<tr><td>small piece of code reacting to an event (object uploaded, message published)</td><td><b>Cloud Run functions</b> (formerly Cloud Functions)</td><td>Source-based deploy, event triggers via Eventarc</td></tr>
<tr><td>existing Kubernetes manifests/Helm charts, many microservices, service mesh, StatefulSets, DaemonSets, custom controllers</td><td><b>GKE</b> (Autopilot by default)</td><td>Full Kubernetes API; Autopilot removes node management and bills per Pod request</td></tr>
<tr><td>specific node configuration, privileged pods, custom kernel modules, specific machine families</td><td><b>GKE Standard</b></td><td>You control node pools; Autopilot restricts privileged workloads</td></tr>
<tr><td>lift-and-shift, licensed software tied to the OS, Windows apps, full OS access, specific kernel, long-lived stateful servers</td><td><b>Compute Engine</b> (often in a managed instance group)</td><td>You own the VM; MIGs add autohealing and autoscaling</td></tr>
<tr><td>GPUs/TPUs for inference</td><td>Cloud Run (GPU support) or GKE; Compute Engine for full control</td><td>Read the other constraints: scale to zero → Cloud Run; existing K8s → GKE</td></tr>
<tr><td>non-HTTP protocols, UDP, arbitrary TCP ports exposed directly</td><td><b>GKE or Compute Engine</b></td><td>Cloud Run serves HTTP(S), HTTP/2, gRPC and WebSockets, not raw UDP</td></tr>
</tbody></table></div>
${compareHTML('compute')}
<h3>Try it: platform chooser</h3>
<div data-sim="chooser"></div>
<h3>Cloud Run in one paragraph</h3>
<p>A <b>service</b> is a URL backed by immutable <b>revisions</b>. Each revision is a container image + configuration (CPU, memory, concurrency, env vars, service account). Instances start on demand, handle up to <code>concurrency</code> requests each (default 80, maximum 1000), and scale back to zero (or to <code>min-instances</code>). Containers must listen on <code>$PORT</code>, be stateless (the filesystem is in-memory), and finish work within the request timeout (default 5 minutes, maximum 60 minutes).</p>
${code('bash', `
# Deploy a container image to Cloud Run (regional resource)
gcloud run deploy orders \\
  --image=europe-west1-docker.pkg.dev/my-proj/shop/orders:1.4.0 \\
  --region=europe-west1 \\
  --service-account=orders-sa@my-proj.iam.gserviceaccount.com \\
  --no-allow-unauthenticated      # require IAM-authenticated callers

# A job instead of a service: runs to completion, no URL
gcloud run jobs create nightly-export --image=.../export:1.0 --tasks=10 --max-retries=3 --region=europe-west1
gcloud run jobs execute nightly-export --region=europe-west1`, 'Cloud Run service vs. job')}`,
 traps: ['"Least operational overhead" + containers + HTTP almost always means Cloud Run, unless the scenario needs something Cloud Run cannot do.', 'App Engine still exists, but new scenarios in the current guide name Compute Engine, GKE and Cloud Run. Prefer Cloud Run for new stateless web workloads.', 'A long-running background worker that pulls messages continuously is a poor fit for a request-driven Cloud Run service with CPU only during requests. Use instance-based billing (CPU always allocated) with min instances, a Cloud Run job for finite work, or GKE.', '"Existing Helm charts" or "uses the Kubernetes API" points to GKE even if Cloud Run could run the containers.'],
 mistakes: ['Writing files to local disk on Cloud Run and expecting them to persist: the filesystem is in-memory and per instance.', 'Choosing GKE Standard when no node-level requirement exists: Autopilot is the recommended default.', 'Picking Compute Engine "for control" when the scenario only asks for scale and simplicity.'],
 consider: { perf: 'Cloud Run cold starts: mitigate with min instances and startup CPU boost. GKE/CE avoid cold starts but you pay for idle capacity.', sec: 'Each Cloud Run service runs as a service account: give each service its own, least-privileged one. GKE: Workload Identity Federation for GKE instead of node service account keys.', cost: 'Scale-to-zero makes Cloud Run cheapest for spiky or low traffic. Steady high utilisation can be cheaper on GKE/CE with committed use discounts.' },
 docs: [['Cloud Run overview', 'https://cloud.google.com/run/docs/overview/what-is-cloud-run'], ['GKE Autopilot overview', 'https://cloud.google.com/kubernetes-engine/docs/concepts/autopilot-overview'], ['Choosing a hosting option', 'https://cloud.google.com/hosting-options'], ['Compute Engine managed instance groups', 'https://cloud.google.com/compute/docs/instance-groups']],

T({ id: 'containers', sub: '1.1', obj: ['1.1.2'], title: 'Building, refactoring and deploying containers to Cloud Run and GKE', mins: 50,
 lead: 'A container that runs on your laptop is not automatically ready for Cloud Run or GKE. The exam checks that you know the contract the platform expects.',
 goals: ['Write a production Dockerfile for a Spring Boot service', 'Know three ways to build an image: Dockerfile, buildpacks (source deploy), Jib', 'Refactor an app for the container contract: $PORT, stateless, stdout logs, SIGTERM', 'Deploy the same image to Cloud Run and to GKE'],
 body: () => `
${diagram({ w: 760, h: 200, nodes: [['src', 20, 70, 120, 56, 'Source code', 'ext', 'Git repo'], ['cb', 180, 70, 130, 56, 'Cloud Build', 'svc', 'Dockerfile / buildpacks'], ['ar', 350, 70, 140, 56, 'Artifact Registry', 'data', 'region-docker.pkg.dev'], ['cr', 540, 20, 190, 56, 'Cloud Run', 'svc', 'gcloud run deploy'], ['gke', 540, 124, 190, 56, 'GKE', 'svc', 'kubectl apply Deployment']],
 edges: [['src', 'cb', 'build'], ['cb', 'ar', 'push image'], ['ar', 'cr', 'pull'], ['ar', 'gke', 'pull']] }, 'One image, two targets. The image lives in Artifact Registry (Container Registry is deprecated).')}
<h3>The container contract (12-factor, as Cloud Run checks it)</h3>
<ul class="tick"><li><b>Listen on <code>0.0.0.0:$PORT</code></b>. Cloud Run injects <code>PORT</code> (8080 by default).</li><li><b>Stateless</b>: session data, uploads and caches go to Memorystore, Cloud Storage or a database.</li><li><b>Configuration from the environment</b>: env vars, and secrets from Secret Manager, never baked into the image.</li><li><b>Logs to stdout/stderr</b>, ideally as single-line JSON, so Cloud Logging parses severity and trace fields.</li><li><b>Graceful shutdown</b>: Cloud Run sends <code>SIGTERM</code> and allows 10 seconds before <code>SIGKILL</code>; GKE uses <code>terminationGracePeriodSeconds</code> (default 30 s).</li><li><b>Fast startup</b>: small image, no work before the port opens. Use startup probes on GKE.</li></ul>
${code('dockerfile', `
# ---- build stage: compile with Maven ----
FROM maven:3.9-eclipse-temurin-21 AS build
WORKDIR /src
COPY pom.xml .
RUN mvn -q dependency:go-offline          # cached layer: only re-runs when pom.xml changes
COPY src ./src
RUN mvn -q package -DskipTests

# ---- runtime stage: JRE only, non-root ----
FROM eclipse-temurin:21-jre
WORKDIR /app
COPY --from=build /src/target/orders.jar app.jar
USER 1000
ENV JAVA_TOOL_OPTIONS="-XX:MaxRAMPercentage=75"   # respect the container memory limit
ENTRYPOINT ["java", "-jar", "/app/app.jar"]`, 'Dockerfile · multi-stage Spring Boot')}
${code('yaml', `
# application.yaml: read the port Cloud Run injects, shut down gracefully
server:
  port: \${PORT:8080}
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 9s   # finish in-flight requests before Cloud Run's 10 s SIGKILL`, 'Spring Boot settings')}
<h3>Three ways to build</h3>
<div class="tscroll"><table><thead><tr><th>Method</th><th>Command</th><th>When</th></tr></thead><tbody>
<tr><td>Dockerfile + Cloud Build</td><td><code>gcloud builds submit --tag REGION-docker.pkg.dev/PROJ/REPO/orders:1.0</code></td><td>Full control of the image</td></tr>
<tr><td>Source deploy (buildpacks)</td><td><code>gcloud run deploy orders --source .</code></td><td>No Dockerfile needed; Cloud Build detects Java/Maven, builds and pushes to the <code>cloud-run-source-deploy</code> repository. If a Dockerfile exists, it is used.</td></tr>
<tr><td>Jib (Maven/Gradle plugin)</td><td><code>mvn compile jib:build -Dimage=…</code></td><td>Java teams; no Docker daemon, layered images for fast rebuilds</td></tr></tbody></table></div>
${code('yaml', `
apiVersion: apps/v1
kind: Deployment
metadata: { name: orders }
spec:
  replicas: 3
  selector: { matchLabels: { app: orders } }
  template:
    metadata: { labels: { app: orders } }
    spec:
      serviceAccountName: orders-ksa          # mapped to IAM with Workload Identity Federation for GKE
      containers:
      - name: orders
        image: europe-west1-docker.pkg.dev/my-proj/shop/orders:1.4.0
        ports: [{ containerPort: 8080 }]
        resources:
          requests: { cpu: 500m, memory: 512Mi }
          limits:   { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: orders }
spec:
  selector: { app: orders }
  ports: [{ port: 80, targetPort: 8080 }]`, 'GKE · Deployment + Service')}
${code('bash', `
gcloud artifacts repositories create shop --repository-format=docker --location=europe-west1
gcloud builds submit --tag europe-west1-docker.pkg.dev/my-proj/shop/orders:1.4.0
gcloud container clusters get-credentials prod --region europe-west1
kubectl apply -f orders.yaml
kubectl rollout status deployment/orders`, 'Build once, deploy to GKE')}`,
 traps: ['Image path format: <code>LOCATION-docker.pkg.dev/PROJECT/REPOSITORY/IMAGE:TAG</code>. <code>gcr.io</code> answers refer to the deprecated Container Registry.', 'Use an immutable reference for production deploys (a version tag or, better, the image digest <code>@sha256:…</code>), not <code>:latest</code>.', '"Deploy without writing a Dockerfile" → <code>gcloud run deploy --source</code> (buildpacks) or Jib.'],
 mistakes: ['Hard-coding port 8080 and ignoring <code>$PORT</code>.', 'Running as root in the image.', 'Keeping user sessions in memory, then losing them when Cloud Run scales in or GKE reschedules the Pod.', 'Setting a JVM heap larger than the container memory limit (OOMKilled).'],
 consider: { perf: 'Multi-stage builds and distroless/JRE-only bases shrink images and cold starts. Jib layers dependencies separately so rebuilds push only your classes.', sec: 'Non-root user, minimal base image, Artifact Analysis vulnerability scanning on push (section 1.2), Binary Authorization to allow only signed images.', cost: 'Artifact Registry charges for storage: add cleanup policies to delete old untagged images.' },
 docs: [['Container runtime contract', 'https://cloud.google.com/run/docs/container-contract'], ['Deploy from source', 'https://cloud.google.com/run/docs/deploying-source-code'], ['Artifact Registry Docker quickstart', 'https://cloud.google.com/artifact-registry/docs/docker/store-docker-container-images'], ['Deploy an app to GKE', 'https://cloud.google.com/kubernetes-engine/docs/deploy-app-cluster']],
 books: [['k8p', 'Ch. 2 Predictable Demands · Ch. 5 Managed Lifecycle'], ['bm', 'Ch. 7 Build'], ['cdj', 'Docker chapters (concepts apply; the exam uses Cloud Build, not Jenkins)']] });

T({ id: 'geography', sub: '1.1', obj: ['1.1.3'], title: 'Geography: zones, regions, multi-regions and latency', mins: 30,
 lead: 'Every resource has a scope. Knowing whether something is zonal, regional or global tells you what survives an outage and where latency comes from.',
 goals: ['Classify common resources as zonal, regional, multi-regional or global', 'Reason about latency and egress when placing compute and data', 'Pick the deployment shape that survives a zone or region failure'],
 body: () => `
${diagram({ w: 760, h: 230, zones: [[10, 10, 360, 210, 'Region europe-west1'], [390, 10, 360, 210, 'Region us-central1']], nodes: [
 ['z1', 25, 40, 100, 70, 'Zone b', 'ext', 'VM · zonal disk'], ['z2', 140, 40, 100, 70, 'Zone c', 'ext', 'VM · zonal disk'], ['z3', 255, 40, 100, 70, 'Zone d', 'ext', 'VM · zonal disk'], ['rr', 25, 135, 330, 60, 'Regional: Cloud Run service, regional GKE, Cloud SQL HA, regional bucket', 'svc'],
 ['u1', 405, 40, 330, 70, 'Another region: independent failure domain', 'ext', 'cross-region traffic = higher latency + egress'], ['gl', 405, 135, 330, 60, 'Global: VPC network, global external ALB, IAM, Pub/Sub topic', 'data']], edges: [] }, 'Zones are failure domains inside a region. Regions are independent. Global resources are not tied to one region.')}
<div class="tscroll"><table><thead><tr><th>Scope</th><th>Examples</th><th>Survives</th></tr></thead><tbody>
<tr><td><b>Zonal</b></td><td>Compute Engine VM, zonal persistent disk, zonal GKE cluster (single control plane), zonal managed instance group</td><td>Nothing beyond that zone</td></tr>
<tr><td><b>Regional</b></td><td>Cloud Run services, regional GKE cluster (control plane + nodes in 3 zones), regional MIG, regional persistent disk, Cloud SQL with HA, Memorystore Standard tier, subnets, regional buckets</td><td>A zone failure</td></tr>
<tr><td><b>Multi-region / dual-region</b></td><td>Spanner multi-region configs, Firestore multi-region, Cloud Storage dual/multi-region buckets, BigQuery US/EU datasets, Artifact Registry multi-region repos</td><td>A region failure</td></tr>
<tr><td><b>Global</b></td><td>VPC networks, global external Application Load Balancer, Cloud CDN, IAM, Pub/Sub topics (message storage can be restricted by policy)</td><td>Not tied to one region</td></tr></tbody></table></div>
<h3>Latency rules of thumb</h3>
<ul class="tick"><li>Same zone &lt; same region (different zone, around 1 ms or less) &lt; different region (tens of ms) &lt; another continent (100+ ms).</li><li><b>Put compute next to its data.</b> A Cloud Run service in us-central1 calling Cloud SQL in europe-west1 adds a transatlantic round trip to every query, and you pay inter-region egress.</li><li>To serve users worldwide with a regional service: deploy to several regions behind a <b>global external Application Load Balancer</b> with serverless NEGs; it routes each user to the nearest healthy region. Add <b>Cloud CDN</b> for cacheable content.</li></ul>
${code('bash', `
# The same Cloud Run service in two regions, behind one global anycast IP
gcloud run deploy web --image=$IMG --region=europe-west1
gcloud run deploy web --image=$IMG --region=us-central1
gcloud compute network-endpoint-groups create web-eu --region=europe-west1 \\
  --network-endpoint-type=serverless --cloud-run-service=web
gcloud compute network-endpoint-groups create web-us --region=us-central1 \\
  --network-endpoint-type=serverless --cloud-run-service=web
# then: backend service (global) + both NEGs + URL map + target HTTPS proxy + forwarding rule`, 'Multi-region Cloud Run')}`,
 traps: ['A zonal GKE cluster has a single control plane in one zone: during that zone\'s outage you cannot change the cluster. "Highly available control plane" → regional cluster.', 'Pub/Sub topics are global resources, but messages are stored in the region closest to the publisher unless a message storage policy restricts it (data residency questions).', '"Lowest latency for users in Asia and Europe" with a single region deployment is never the best answer.'],
 mistakes: ['Splitting tightly coupled services and their database across regions "for resilience" and making every request slower.', 'Forgetting that cross-region and internet egress are billed.'],
 consider: { perf: 'Co-locate chatty components; use regional endpoints; cache at the edge with Cloud CDN.', sec: 'Data residency: choose regions and use organization policy <code>gcp.resourceLocations</code> to restrict where resources are created.', cost: 'Intra-zone traffic is free or cheapest; inter-zone and inter-region traffic cost more. Multi-region storage costs more than regional.' },
 docs: [['Geography and regions', 'https://cloud.google.com/docs/geography-and-regions'], ['Regional vs zonal GKE clusters', 'https://cloud.google.com/kubernetes-engine/docs/concepts/types-of-clusters'], ['Serve traffic from multiple regions (Cloud Run)', 'https://cloud.google.com/run/docs/multiple-regions']],
 books: [['sre', 'Ch. 19 Load Balancing at the Frontend'], ['ddia', 'Ch. 5 Replication (multi-leader across datacenters)']] });

T({ id: 'loadbalancing', sub: '1.1', obj: ['1.1.4', '1.1.5'], title: 'Load balancers and session affinity', mins: 45,
 lead: 'Google Cloud has several load balancer families. The exam gives you a protocol, a scope (external or internal, global or regional) and sometimes a "keep the user on the same backend" requirement.',
 goals: ['Choose between Application (L7) and Network (L4, proxy or passthrough) load balancers', 'Know when client IPs are preserved', 'Configure session affinity on backend services, GKE and Cloud Run, and know its limits'],
 body: () => `
${diagram({ w: 760, h: 220, nodes: [['u', 20, 85, 100, 50, 'Users', 'client'], ['lb', 170, 70, 180, 80, 'External Application LB', 'svc', 'global · HTTPS · URL map'], ['ca', 400, 10, 150, 46, 'Cloud Armor', 'auth', 'WAF · rate limits'], ['cdn', 400, 164, 150, 46, 'Cloud CDN', 'svc', 'edge cache'], ['b1', 600, 40, 140, 50, 'Backend: Cloud Run', 'ext', 'serverless NEG'], ['b2', 600, 130, 140, 50, 'Backend: GKE / MIG', 'ext', 'NEG / instance group']],
 edges: [['u', 'lb', 'HTTPS'], ['lb', 'ca', 'policy'], ['lb', 'cdn', 'cache'], ['lb', 'b1', '/api/*'], ['lb', 'b2', '/*']] }, 'An external Application Load Balancer terminates TLS at Google\'s edge, routes by host and path, and can apply Cloud Armor and Cloud CDN.')}
${compareHTML('lb')}
<h3>Decision path</h3>
<ol class="steps"><li><b>HTTP(S), HTTP/2, gRPC, WebSockets?</b> → <b>Application Load Balancer</b> (Layer 7: URL maps, host/path routing, header-based routing, TLS termination, Cloud CDN, Cloud Armor, IAP).</li><li><b>Other TCP or SSL</b> and you want Google to terminate/proxy connections → <b>proxy Network Load Balancer</b>.</li><li><b>UDP, or you must preserve the client source IP and handle TLS yourself</b> → <b>passthrough Network Load Balancer</b> (regional, packets go straight to the backends).</li><li><b>Users on the internet?</b> external. <b>Callers inside your VPC?</b> internal. <b>Backends in several regions behind one IP?</b> global (or cross-region internal).</li></ol>
<h3>Session affinity</h3>
<p>Session affinity sends requests from the same client to the same backend <b>while that backend is healthy and has capacity</b>. It is always <b>best effort</b>: scaling, failures and capacity limits break it. Use it for performance (warm in-memory caches, fewer re-authentications), never as the only place user state lives.</p>
<div class="tscroll"><table><thead><tr><th>Where</th><th>How</th></tr></thead><tbody>
<tr><td>Backend service (ALB / proxy NLB)</td><td><code>--session-affinity=GENERATED_COOKIE</code> (load balancer issues a cookie), <code>CLIENT_IP</code>, <code>HEADER_FIELD</code> / <code>HTTP_COOKIE</code> (with consistent-hash locality policy), <code>STRONG_COOKIE_AFFINITY</code> (stateful cookie-based). <code>--affinity-cookie-ttl</code> sets the cookie lifetime.</td></tr>
<tr><td>Cloud Run</td><td><code>gcloud run services update web --session-affinity</code>: best-effort cookie-based affinity to the same instance.</td></tr>
<tr><td>GKE Service</td><td><code>spec.sessionAffinity: ClientIP</code>; behind a GKE Ingress, a <code>BackendConfig</code> with <code>sessionAffinity.affinityType: GENERATED_COOKIE</code>.</td></tr></tbody></table></div>
${code('bash', `
gcloud compute backend-services update web-backend --global \\
  --session-affinity=GENERATED_COOKIE --affinity-cookie-ttl=3600

gcloud run services update cart --region=europe-west1 --session-affinity`, 'Enable session affinity')}`,
 traps: ['CLIENT_IP affinity breaks for many users behind the same NAT/proxy (they all land on one backend) and for mobile users whose IP changes. Cookie-based affinity is usually the better answer for browsers.', '"Preserve client IP" for TCP/UDP → passthrough NLB. With an ALB you read the client IP from <code>X-Forwarded-For</code>.', 'WebSockets are supported by the Application Load Balancer and by Cloud Run.', 'Cloud Armor and IAP attach to Application Load Balancers (backend services), not to passthrough NLBs.'],
 mistakes: ['Relying on affinity to keep a shopping cart: the cart disappears when the instance is replaced. Store it in Memorystore or a database.', 'Choosing an internal load balancer for a public website.'],
 consider: { perf: 'Global ALB terminates TLS at the nearest edge (lower handshake latency) and enables Cloud CDN. Affinity improves cache hit rates per instance.', sec: 'Cloud Armor (WAF rules, rate limiting, geo rules) and IAP sit in front of ALB backends. Managed SSL certificates via Certificate Manager.', cost: 'Global ALB has forwarding-rule and data-processing charges; CDN cache hits reduce backend load and egress from origin.' },
 docs: [['Choose a load balancer', 'https://cloud.google.com/load-balancing/docs/choosing-load-balancer'], ['Backend service session affinity', 'https://cloud.google.com/load-balancing/docs/backend-service#session_affinity'], ['Cloud Run session affinity', 'https://cloud.google.com/run/docs/configuring/session-affinity'], ['GKE Ingress BackendConfig', 'https://cloud.google.com/kubernetes-engine/docs/how-to/ingress-configuration']],
 books: [['sre', 'Ch. 19 Load Balancing at the Frontend · Ch. 20 Load Balancing in the Datacenter'], ['ddia', 'Ch. 6 Partitioning (request routing)']] });

T({ id: 'caching', sub: '1.1', obj: ['1.1.6'], title: 'Caching with Memorystore (and where else to cache)', mins: 40,
 lead: 'Caching questions test two things: picking the right cache layer, and knowing the trade-off you accept (stale data, invalidation, failure behaviour).',
 goals: ['Apply cache-aside, write-through and TTL-based expiry', 'Choose between Memorystore for Redis, Redis Cluster, Valkey and Memcached', 'Connect Cloud Run and GKE to Memorystore over private networking'],
 body: () => `
${diagram({ w: 760, h: 200, zones: [[300, 10, 450, 180, 'VPC (private IP only)']], nodes: [['app', 30, 70, 180, 60, 'Cloud Run / GKE', 'ext', 'Spring Boot service'], ['mem', 340, 30, 170, 56, 'Memorystore', 'data', 'Redis / Valkey'], ['db', 340, 120, 170, 56, 'Cloud SQL', 'data', 'source of truth'], ['note', 540, 70, 190, 56, 'Direct VPC egress', 'auth', 'or Serverless VPC Access']],
 edges: [['app', 'mem', '1 GET key'], ['app', 'db', '2 on miss: query'], ['note', 'mem', '', 'dash']] }, 'Cache-aside: read from the cache; on a miss, read the database and populate the cache with a TTL.')}
<h3>Patterns</h3>
<div class="tscroll"><table><thead><tr><th>Pattern</th><th>How it works</th><th>Trade-off</th></tr></thead><tbody>
<tr><td><b>Cache-aside (lazy loading)</b></td><td>App reads cache → on miss reads DB → writes cache with TTL</td><td>Only requested data is cached; first read is slow; possible stale data until TTL or explicit eviction</td></tr>
<tr><td><b>Write-through</b></td><td>App writes DB and cache together</td><td>Fresh reads; writes slower; caches data that may never be read</td></tr>
<tr><td><b>TTL / eviction</b></td><td>Keys expire; <code>maxmemory-policy</code> (e.g. allkeys-lru) evicts when full</td><td>Bounded staleness and memory</td></tr></tbody></table></div>
${code('java', `
@Service
public class ProductService {
    private final ProductRepository repo;
    public ProductService(ProductRepository repo) { this.repo = repo; }

    // Spring Cache with a Redis cache manager pointing at Memorystore (spring.data.redis.host = private IP)
    @Cacheable(cacheNames = "products", key = "#id")          // cache-aside on reads
    public Product find(String id) { return repo.findById(id).orElseThrow(); }

    @CacheEvict(cacheNames = "products", key = "#p.id")        // invalidate on update
    public Product update(Product p) { return repo.save(p); }
}`, 'Cache-aside in Spring Boot')}
${code('yaml', `
spring:
  data:
    redis:
      host: 10.12.0.3      # Memorystore private IP
      port: 6379
  cache:
    redis:
      time-to-live: 10m    # bounded staleness`, 'application.yaml')}
${code('bash', `
gcloud redis instances create cache --size=5 --region=europe-west1 --tier=standard --redis-version=redis_7_2
# Cloud Run reaches private IPs through the VPC:
gcloud run deploy catalog --image=$IMG --region=europe-west1 \\
  --network=default --subnet=default --vpc-egress=private-ranges-only   # Direct VPC egress`, 'Create Memorystore and connect Cloud Run')}
${compareHTML('cache')}
<h3>Other cache layers</h3>
<ul class="tick"><li><b>Cloud CDN</b>: static and cacheable HTTP responses at Google's edge (Cache-Control headers).</li><li><b>In-process cache</b> (Caffeine): fastest, but per instance and lost on scale-in. Useful for small, read-mostly reference data.</li><li><b>API-level caching</b>: cache results of Google Cloud API calls (objective 4.2) and respect ETags.</li></ul>`,

T({ id: 'events', sub: '1.1', obj: ['1.1.9'], title: 'Asynchronous and event-driven integration: Pub/Sub and Eventarc', mins: 60,
 lead: 'Async questions are about guarantees: at-least-once delivery, acknowledgement deadlines, retries, dead-letter topics, ordering and exactly-once. Learn the knobs and what each one costs.',
 goals: ['Design publisher → topic → subscription → subscriber flows (pull, push, BigQuery, Cloud Storage subscriptions)', 'Configure ack deadline, retry policy, dead-letter topic, ordering keys and exactly-once delivery', 'Route Google Cloud events to Cloud Run with Eventarc (CloudEvents)', 'Write idempotent consumers'],

${diagram({ w: 760, h: 240, nodes: [['pub', 20, 95, 120, 50, 'orders service', 'ext', 'publisher'], ['t', 190, 95, 120, 50, 'Topic', 'svc', 'orders'], ['s1', 370, 20, 160, 50, 'Sub: billing (push)', 'svc'], ['s2', 370, 95, 160, 50, 'Sub: shipping (pull)', 'svc'], ['s3', 370, 170, 160, 50, 'Sub: BigQuery', 'svc'], ['c1', 590, 20, 150, 50, 'billing (Cloud Run)', 'ext'], ['c2', 590, 95, 150, 50, 'shipping workers', 'ext'], ['bq', 590, 170, 150, 50, 'BigQuery table', 'data'], ['dl', 190, 185, 120, 44, 'Dead-letter topic', 'svc']],

<h3>Delivery guarantees and knobs</h3>
<div class="tscroll"><table><thead><tr><th>Setting</th><th>What it does</th></tr></thead><tbody>
<tr><td><b>At-least-once</b> (default)</td><td>A message can be delivered more than once: consumers must be <b>idempotent</b> (deduplicate on a business key or message ID).</td></tr>
<tr><td><b>Ack deadline</b></td><td>Time the subscriber has to ack before redelivery: default 10 s, up to 600 s. Client libraries extend it automatically while processing (lease management).</td></tr>
<tr><td><b>Retry policy</b></td><td>Immediate redelivery, or exponential backoff between a minimum and maximum delay (up to 600 s).</td></tr>
<tr><td><b>Dead-letter topic</b></td><td>After <code>max-delivery-attempts</code> (5–100) the message moves to another topic. The Pub/Sub service agent needs publisher rights on it and subscriber rights on the source subscription.</td></tr>
<tr><td><b>Ordering keys</b></td><td>Messages with the same key, published in the same region, are delivered in order when the subscription has message ordering enabled. Order is per key, not global; it can reduce throughput.</td></tr>
<tr><td><b>Exactly-once delivery</b></td><td>Subscription setting for <b>pull</b> subscriptions in a region: no redelivery after a successful ack. Higher latency; still design for idempotency at your side effects.</td></tr>
<tr><td><b>Filtering</b></td><td>A subscription receives only messages whose attributes match a filter.</td></tr>
<tr><td><b>Retention / replay</b></td><td>Unacked messages kept 7 days by default; topics can retain messages, and you can <b>seek</b> a subscription to a timestamp or snapshot to replay.</td></tr></tbody></table></div>
<h3>Try it: Pub/Sub delivery simulator</h3>
<div data-sim="pubsub"></div>
${code('java', `
// Publisher with an ordering key (requires setEnableMessageOrdering(true) on the Publisher)
Publisher publisher = Publisher.newBuilder(TopicName.of("my-proj", "orders"))
        .setEnableMessageOrdering(true).build();
PubsubMessage msg = PubsubMessage.newBuilder()
        .setData(ByteString.copyFromUtf8(json))
        .setOrderingKey(order.customerId())          // order preserved per customer
        .putAttributes("type", "order.created")
        .build();
ApiFuture<String> id = publisher.publish(msg);

// Subscriber (pull, streaming): ack only after the work is durable
MessageReceiver receiver = (message, consumer) -> {
    try {
        if (processed.alreadyHandled(message.getMessageId())) { consumer.ack(); return; }   // idempotency
        shipping.handle(message);
        consumer.ack();
    } catch (TransientException e) {
        consumer.nack();                                       // redeliver per retry policy
    }
};
Subscriber.newBuilder(ProjectSubscriptionName.of("my-proj", "shipping"), receiver).build().startAsync();`, 'Java client library')}
${code('bash', `
gcloud pubsub topics create orders
gcloud pubsub topics create orders-dead
gcloud pubsub subscriptions create billing --topic=orders \\
  --push-endpoint=https://billing-abc-ew.a.run.app/pubsub \\
  --push-auth-service-account=pubsub-invoker@my-proj.iam.gserviceaccount.com \\
  --ack-deadline=60 --min-retry-delay=10s --max-retry-delay=600s \\
  --dead-letter-topic=orders-dead --max-delivery-attempts=10
gcloud pubsub subscriptions create shipping --topic=orders --enable-message-ordering --enable-exactly-once-delivery`, 'Subscriptions with retry, DLQ, ordering')}
<h3>Eventarc</h3>
<p>Eventarc <b>routes events</b> to destinations in the standard <b>CloudEvents</b> format. Sources: direct events from Google services (e.g. <code>google.cloud.storage.object.v1.finalized</code>), <b>Cloud Audit Logs</b> entries for almost any Google API call, Pub/Sub messages, and third-party providers. Destinations: Cloud Run, Cloud Run functions, GKE services and Workflows. Under the hood Eventarc uses Pub/Sub for transport, so delivery is at-least-once.</p>
${code('bash', `
gcloud eventarc triggers create on-upload \\
  --location=europe-west1 \\
  --destination-run-service=thumbnailer --destination-run-region=europe-west1 \\
  --event-filters="type=google.cloud.storage.object.v1.finalized" \\
  --event-filters="bucket=shop-uploads" \\
  --service-account=eventarc-trigger@my-proj.iam.gserviceaccount.com`, 'Eventarc trigger: Cloud Storage → Cloud Run')}
${code('java', `
@PostMapping("/")      // Eventarc delivers an HTTP POST with CloudEvents headers (ce-type, ce-source, ce-id…)
public ResponseEntity<Void> onEvent(@RequestHeader("ce-id") String eventId,
                                    @RequestHeader("ce-type") String type,
                                    @RequestBody StorageObjectData data) {
    if (seen.contains(eventId)) return ResponseEntity.ok().build();   // at-least-once → dedupe
    thumbnails.create(data.getBucket(), data.getName());
    return ResponseEntity.ok().build();       // 2xx = ack; 4xx/5xx or timeout = retry
}`, 'Event receiver on Cloud Run')}`,

T({ id: 'resources', sub: '1.1', obj: ['1.1.10', '1.1.11'], title: 'Resource requirements and cost optimisation', mins: 50,
 lead: 'How much CPU and memory, how many requests per instance, how many instances at minimum and maximum: these settings decide latency, reliability and the bill.',
 goals: ['Size Cloud Run services: CPU, memory, concurrency, min/max instances, billing mode, startup CPU boost', 'Size GKE workloads with requests and limits, and know QoS classes and Autopilot billing', 'Name the main cost levers on Cloud Run, GKE and Compute Engine'],
 body: () => `
<h3>Cloud Run settings that matter</h3>
<div class="tscroll"><table><thead><tr><th>Setting</th><th>Effect</th></tr></thead><tbody>
<tr><td><code>--cpu</code>, <code>--memory</code></td><td>Per instance. Memory must cover the JVM heap plus off-heap and the in-memory filesystem.</td></tr>
<tr><td><code>--concurrency</code> (default 80, max 1000)</td><td>Requests per instance at the same time. CPU-heavy or not thread-safe code → lower it (even 1). I/O-bound async code → higher.</td></tr>
<tr><td><code>--min-instances</code></td><td>Kept warm: removes most cold starts; you pay for them while idle.</td></tr>
<tr><td><code>--max-instances</code></td><td>Caps scale-out: protects downstream systems (database connections) and your budget.</td></tr>
<tr><td>Billing: request-based vs instance-based (<code>--no-cpu-throttling</code>)</td><td>Request-based: CPU only while serving requests. Instance-based: CPU always allocated, needed for background work after the response.</td></tr>
<tr><td><code>--cpu-boost</code></td><td>Extra CPU during startup: faster JVM start.</td></tr>
<tr><td><code>--timeout</code></td><td>Request timeout, up to 60 minutes.</td></tr></tbody></table></div>
<h3>Try it: capacity calculator</h3>
<div data-sim="capacity"></div>
<h3>GKE requests and limits</h3>
${code('yaml', `
resources:
  requests: { cpu: "500m", memory: "512Mi" }   # what the scheduler reserves (and what Autopilot bills)
  limits:   { cpu: "1",    memory: "512Mi" }   # memory over limit → OOMKilled; CPU over limit → throttled`, 'Pod resources')}
<div class="tscroll"><table><thead><tr><th>QoS class</th><th>Rule</th><th>Eviction priority</th></tr></thead><tbody>
<tr><td>Guaranteed</td><td>requests = limits for CPU and memory in every container</td><td>Evicted last</td></tr>
<tr><td>Burstable</td><td>Some requests set, not equal to limits</td><td>Middle</td></tr>
<tr><td>BestEffort</td><td>No requests or limits</td><td>Evicted first</td></tr></tbody></table></div>
<h3>Cost levers</h3>
<ul class="tick"><li><b>Right-size</b> using Recommender / Active Assist suggestions and real utilisation metrics (VPA in recommendation mode on GKE).</li><li><b>Scale to zero</b> for spiky workloads (Cloud Run); <b>committed use discounts</b> for steady baselines (Compute Engine, GKE, Cloud Run).</li><li><b>Spot VMs / Spot Pods</b> for fault-tolerant batch work (can be reclaimed at any time).</li><li><b>Autopilot</b> bills Pod requests, not idle node capacity.</li><li>Reduce egress: keep traffic in-region, cache with Cloud CDN.</li><li>Storage classes and lifecycle rules for Cloud Storage (section 1.2/1.3).</li></ul>`,
 traps: ['Cold starts on a latency-sensitive API → min instances (and startup CPU boost), not max instances.', '"Database runs out of connections when traffic spikes" → set max instances (and a connection pool size) so instances × pool ≤ database limit.', 'Background threads after returning the response starve on request-based billing: use instance-based billing (CPU always allocated) or move the work to Cloud Tasks/Pub/Sub.', 'A container with no memory limit on GKE Standard can take all node memory; on Autopilot, defaults are applied if you omit requests.'],
 mistakes: ['Concurrency 1 for a thread-safe Spring app: many more instances (and cold starts) than needed.', 'Min instances on every dev/test service: idle cost for nothing.', 'Memory limit equal to -Xmx: no room for metaspace, threads and the in-memory filesystem.'],
 consider: { perf: 'Higher concurrency = fewer instances but more contention per instance; measure p95/p99 latency while tuning.', sec: 'Max instances also limits the blast radius of a traffic flood (combine with Cloud Armor).', cost: 'Instances ≈ RPS × latency ÷ concurrency. Every lever above changes one of those three numbers.' },

T({ id: 'replication', sub: '1.1', obj: ['1.1.12'], title: 'Data replication for zonal and regional failover', mins: 50,
 lead: 'Failover questions combine two numbers: how much data you can lose (RPO) and how long you can be down (RTO). Synchronous replication protects RPO; automatic failover protects RTO.',
 goals: ['Define RPO and RTO and map them to synchronous vs asynchronous replication', 'Know the HA and DR options of Cloud SQL, AlloyDB, Spanner, Bigtable, Firestore, Cloud Storage and Memorystore', 'Design an application that survives a zone and a region failure'],
 body: () => `
${diagram({ w: 760, h: 230, zones: [[10, 10, 470, 210, 'Region europe-west1'], [500, 10, 250, 210, 'Region europe-southwest1 (Madrid)']], nodes: [['p', 30, 50, 190, 60, 'Cloud SQL primary', 'data', 'zone b'], ['s', 270, 50, 190, 60, 'Standby (HA)', 'data', 'zone c'], ['rr', 30, 140, 190, 56, 'Read replica', 'data', 'same region, async'], ['dr', 530, 80, 200, 70, 'Cross-region replica', 'data', 'async → promote for DR']],
 edges: [['p', 's', 'synchronous'], ['p', 'rr', 'async'], ['p', 'dr', 'async (lag = RPO)', 'dash']] }, 'Zonal failure: automatic failover to the standby (RPO 0). Regional failure: promote the cross-region replica (RPO = replication lag).')}
${compareHTML('replic')}
<h3>RPO and RTO</h3>
<ul class="tick"><li><b>RPO</b> (Recovery Point Objective): maximum acceptable data loss, measured in time. Synchronous replication → RPO ≈ 0. Asynchronous → RPO = lag.</li><li><b>RTO</b> (Recovery Time Objective): maximum acceptable downtime. Automatic failover (Cloud SQL HA, Spanner, Bigtable multi-cluster routing) → low RTO. Manual promotion → higher RTO.</li></ul>
${code('bash', `
# Cloud SQL with HA (regional) + a cross-region read replica for DR
gcloud sql instances create orders-db --database-version=POSTGRES_16 \\
  --region=europe-west1 --availability-type=REGIONAL --tier=db-custom-2-7680
gcloud sql instances create orders-db-dr --master-instance-name=orders-db --region=europe-southwest1
# during a regional outage:
gcloud sql instances promote-replica orders-db-dr`, 'Cloud SQL HA + DR')}
<h3>What the application must do</h3>
<ul class="tick"><li>Retry with backoff when a failover drops connections (Cloud SQL failover takes about a minute; connections are reset).</li><li>Connect via the instance connection name or a stable IP so the failover is transparent.</li><li>Run the app tier regionally (Cloud Run service, regional GKE, regional MIG) so compute survives the same zone failure.</li><li>Send read traffic to read replicas or read pools only if slightly stale reads are acceptable.</li></ul>`,
 traps: ['Read replicas are not an HA solution: they are asynchronous and do not take over automatically. HA = <code>--availability-type=REGIONAL</code>.', 'Cloud Storage dual-region with <b>turbo replication</b> targets an RPO of 15 minutes; default geo-redundancy is asynchronous.', 'Spanner multi-region: synchronous replication across regions, strong consistency, 99.999% SLA. It is the answer for global, strongly consistent relational data.', 'Bigtable replication is eventually consistent. Multi-cluster routing gives automatic failover; single-cluster routing gives read-your-writes and is required for single-row transactions.'],
 mistakes: ['Assuming a zonal persistent disk on a single VM survives a zone outage.', 'Testing backups but never testing failover and promotion.'],
 consider: { perf: 'Synchronous replication across regions adds write latency (Spanner multi-region commit). Read replicas offload reads.', sec: 'Replicas inherit encryption; with CMEK, keys must be available in the replica region.', cost: 'HA doubles instance cost; cross-region replicas add instance cost plus replication egress.' },
 docs: [['Cloud SQL high availability', 'https://cloud.google.com/sql/docs/postgres/high-availability'], ['Cloud SQL replication', 'https://cloud.google.com/sql/docs/postgres/replication'], ['Spanner instance configurations', 'https://cloud.google.com/spanner/docs/instance-configurations'], ['Bigtable replication', 'https://cloud.google.com/bigtable/docs/replication-overview'], ['Cloud Storage turbo replication', 'https://cloud.google.com/storage/docs/availability-durability#turbo-replication'], ['Disaster recovery planning guide', 'https://cloud.google.com/architecture/dr-scenarios-planning-guide']],
 books: [['ddia', 'Ch. 5 Replication · Ch. 9 Consistency and Consensus'], ['sre', 'Ch. 26 Data Integrity']] });

T({ id: 'traffic', sub: '1.1', obj: ['1.1.13'], title: 'Traffic splitting: gradual rollouts, rollbacks and A/B tests', mins: 45,
 lead: 'Deploying a new version safely means sending a little traffic first, watching it, then moving the rest, and being able to move it all back in one command.',
 goals: ['Use Cloud Run revisions, --no-traffic, tags and update-traffic', 'Split traffic on GKE with the Gateway API (weights and header matches)', 'Distinguish canary, blue/green, A/B testing and rollback'],
 body: () => `
${diagram({ w: 760, h: 200, nodes: [['u', 20, 75, 110, 50, 'Requests', 'client'], ['svc', 180, 65, 160, 70, 'Cloud Run service', 'svc', 'orders'], ['r1', 420, 20, 180, 50, 'revision orders-00012', 'ext', '90%'], ['r2', 420, 85, 180, 50, 'revision orders-00013', 'ext', '10% · tag: canary'], ['t', 420, 150, 320, 40, 'https://canary---orders-abc-ew.a.run.app → 00013 directly', 'auth']],
 edges: [['u', 'svc', ''], ['svc', 'r1', '90%'], ['svc', 'r2', '10%']] }, 'Revisions are immutable. Traffic is a list of percentages per revision; tags give each revision its own URL for testing.')}
<h3>Try it: traffic splitting</h3>
<div data-sim="traffic"></div>
${code('bash', `
# 1. Deploy the new revision without traffic, with a tag for direct testing
gcloud run deploy orders --image=$IMG:1.5.0 --region=europe-west1 --no-traffic --tag=canary
# test it at https://canary---orders-<hash>-ew.a.run.app

# 2. Canary: 10% to the new revision
gcloud run services update-traffic orders --region=europe-west1 --to-tags=canary=10

# 3. Promote
gcloud run services update-traffic orders --region=europe-west1 --to-latest

# Rollback: all traffic back to a known-good revision
gcloud run services update-traffic orders --region=europe-west1 --to-revisions=orders-00012-abc=100`, 'Cloud Run rollout and rollback')}
${code('yaml', `
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: orders }
spec:
  parentRefs: [{ name: external-http }]
  rules:
  - matches: [{ headers: [{ name: x-beta, value: "true" }] }]   # A/B: beta users by header
    backendRefs: [{ name: orders-v2, port: 80 }]
  - backendRefs:                                                  # everyone else: weighted canary
    - { name: orders-v1, port: 80, weight: 90 }
    - { name: orders-v2, port: 80, weight: 10 }`, 'GKE · Gateway API HTTPRoute')}
<div class="tscroll"><table><thead><tr><th>Strategy</th><th>What happens</th><th>On Google Cloud</th></tr></thead><tbody>
<tr><td><b>Canary / gradual rollout</b></td><td>Small % of real traffic to the new version, increase step by step while metrics stay healthy</td><td>Cloud Run traffic percentages; Gateway API weights; Cloud Deploy canary strategy</td></tr>
<tr><td><b>Blue/green</b></td><td>Full new environment; switch 100% at once; keep the old one for instant rollback</td><td>Cloud Run: deploy with <code>--no-traffic</code>, then move 100%. GKE: two Deployments, switch the Service selector or route</td></tr>
<tr><td><b>A/B testing</b></td><td>Different variants for different users to compare a business metric; usually sticky per user</td><td>Header/cookie matches in Gateway API or the load balancer; Cloud Run percentages are random per request (combine with session affinity)</td></tr>
<tr><td><b>Rollback</b></td><td>Send traffic back to the previous version</td><td>Cloud Run: <code>update-traffic --to-revisions=OLD=100</code>; GKE: <code>kubectl rollout undo</code> or route weights</td></tr></tbody></table></div>`,
 traps: ['<code>--no-traffic</code> deploys a revision that receives 0% (until you move traffic) but is reachable through its tag URL.', '<code>--to-latest</code> makes the service follow whatever revision is newest; <code>--to-revisions=REV=100</code> pins traffic to one revision (the rollback command).', 'A Kubernetes Deployment rolling update replaces Pods gradually but cannot hold a fixed 10% split; for real percentage-based canaries use the Gateway API, a service mesh or Cloud Deploy.', 'Measure the canary with SLO metrics (error rate, latency) in Cloud Monitoring before promoting.'],
 mistakes: ['Database schema changes that are not backward compatible: the old and new revisions run at the same time.', 'Rolling back the code but not the configuration/secret that changed with it.'],
 consider: { perf: 'Warm the new revision (min instances on the tagged revision) before shifting large percentages.', sec: 'Tag URLs are reachable: if the service requires authentication, tag URLs require it too.', cost: 'Both versions run during the rollout; keep the window short.' },
 docs: [['Rollouts, rollbacks, traffic migration', 'https://cloud.google.com/run/docs/rollouts-rollbacks-traffic-migration'], ['Gateway API traffic splitting', 'https://cloud.google.com/kubernetes-engine/docs/how-to/deploying-gateways'], ['Cloud Deploy canary', 'https://cloud.google.com/deploy/docs/deployment-strategies/canary']],
 books: [['bm', 'Ch. 8 Deployment (canary, blue/green, feature toggles)'], ['rit', 'Ch. 13 Design for Deployment'], ['cdj', 'Chapters on deployment strategies']] });
