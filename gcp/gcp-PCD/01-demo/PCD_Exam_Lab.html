T({ id: 'retention', sub: '1.2', obj: ['1.2.1'], title: 'Data retention and organization policies: lifecycle rules, retention policies, Bucket Lock', mins: 40,
 lead: 'Retention questions mix three tools that sound alike: lifecycle rules (delete or move automatically), retention policies (prevent deletion), and organization policies (guardrails for every project).',
 goals: ['Write Object Lifecycle Management rules (delete, change storage class, keep N versions)', 'Use retention policies, Bucket Lock, object holds and object retention lock for WORM compliance', 'Apply organization policy constraints that enforce security across projects'],
 body: () => `
${diagram({ w: 760, h: 200, nodes: [['up', 20, 75, 130, 50, 'New object', 'ext', 'Standard class'], ['lc', 200, 20, 220, 60, 'Lifecycle rule', 'svc', 'age 30 d → Nearline; 365 d → delete'], ['rp', 200, 120, 220, 60, 'Retention policy (locked)', 'auth', 'no delete/overwrite before 7 years'], ['out', 480, 75, 260, 50, 'Lifecycle delete waits until retention is met', 'data']],
 edges: [['up', 'lc', ''], ['up', 'rp', ''], ['lc', 'out', ''], ['rp', 'out', 'wins']] }, 'Retention always wins: a lifecycle Delete action cannot remove an object that is still under retention.')}
<div class="tscroll"><table><thead><tr><th>Tool</th><th>What it does</th><th>Reversible?</th></tr></thead><tbody>
<tr><td><b>Object Lifecycle Management</b></td><td>Rules with conditions (age, created before, number of newer versions, is live, days since noncurrent, storage class, prefix/suffix) and actions (Delete, SetStorageClass, AbortIncompleteMultipartUpload)</td><td>Yes, edit the rules</td></tr>
<tr><td><b>Retention policy</b> (bucket)</td><td>No object can be deleted or replaced until it is older than the retention period</td><td>Yes, until locked</td></tr>
<tr><td><b>Bucket Lock</b></td><td>Locks the retention policy permanently: it can be increased but never reduced or removed; the bucket cannot be deleted while objects are retained</td><td><b>No</b>: irreversible (WORM compliance)</td></tr>
<tr><td><b>Object retention lock</b></td><td>Retention configuration on individual objects (unlocked or locked mode)</td><td>Locked mode: no</td></tr>
<tr><td><b>Object holds</b></td><td>Event-based hold (retention clock starts when released) or temporary hold (blocks deletion until removed)</td><td>Yes</td></tr>
<tr><td><b>Object Versioning / soft delete</b></td><td>Keep noncurrent versions / recover deleted objects for a window (soft delete is on by default, 7 days)</td><td>Yes</td></tr></tbody></table></div>
${code('json', `
{
  "rule": [
    { "action": { "type": "SetStorageClass", "storageClass": "NEARLINE" },
      "condition": { "age": 30, "matchesStorageClass": ["STANDARD"] } },
    { "action": { "type": "SetStorageClass", "storageClass": "COLDLINE" },
      "condition": { "age": 90 } },
    { "action": { "type": "Delete" },
      "condition": { "age": 365 } },
    { "action": { "type": "Delete" },
      "condition": { "isLive": false, "numNewerVersions": 3 } }
  ]
}`, 'lifecycle.json')}
${code('bash', `
gcloud storage buckets update gs://invoices-eu --lifecycle-file=lifecycle.json
gcloud storage buckets update gs://invoices-eu --retention-period=7y
gcloud storage buckets update gs://invoices-eu --lock-retention-period     # irreversible
gcloud storage objects update gs://invoices-eu/2026/inv-001.pdf --temporary-hold`, 'Lifecycle, retention and lock')}
<h3>Organization policies (guardrails)</h3>
<p>Set once at organization or folder level and inherited by every project. They restrict <i>what can be configured</i>, regardless of IAM roles.</p>
<div class="tscroll"><table><thead><tr><th>Constraint</th><th>Effect</th></tr></thead><tbody>
<tr><td><code>storage.publicAccessPrevention</code></td><td>No bucket can be made public</td></tr><tr><td><code>storage.uniformBucketLevelAccess</code></td><td>Disables object ACLs: access only through IAM</td></tr>
<tr><td><code>storage.retentionPolicySeconds</code></td><td>Allowed retention periods</td></tr><tr><td><code>gcp.resourceLocations</code></td><td>Resources only in allowed regions (data residency)</td></tr>
<tr><td><code>iam.disableServiceAccountKeyCreation</code></td><td>No downloadable service account keys</td></tr><tr><td><code>iam.allowedPolicyMemberDomains</code></td><td>IAM grants only to identities from your domains</td></tr>
<tr><td><code>run.allowedIngress</code> / <code>run.allowedBinaryAuthorizationPolicies</code></td><td>Force Cloud Run ingress or Binary Authorization settings</td></tr></tbody></table></div>`,
 traps: ['"Regulator requires records that nobody, not even admins, can delete for 7 years" → retention policy + <b>Bucket Lock</b>. A lifecycle rule alone does not prevent deletion.', 'Lifecycle changes can take up to 24 hours to take effect.', 'Changing storage class with lifecycle rules: early-deletion minimums apply (Nearline 30 d, Coldline 90 d, Archive 365 d).', '"Prevent any developer from making a bucket public in any project" → organization policy, not IAM on each bucket.'],
 mistakes: ['Locking a retention policy on a test bucket: you cannot undo it, and the bucket cannot be deleted until objects expire.', 'Relying on versioning as a backup without a lifecycle rule: noncurrent versions grow cost forever.'],
 consider: { perf: 'Storage class does not change first-byte latency much; it changes price and retrieval cost.', sec: 'Uniform bucket-level access + public access prevention + retention lock = strong defaults for sensitive data.', cost: 'Lifecycle transitions to colder classes and deletes of old versions are the biggest storage savings. Autoclass can do it automatically.' },
 docs: [['Object Lifecycle Management', 'https://cloud.google.com/storage/docs/lifecycle'], ['Retention policies and Bucket Lock', 'https://cloud.google.com/storage/docs/bucket-lock'], ['Object holds', 'https://cloud.google.com/storage/docs/object-holds'], ['Organization policy constraints', 'https://cloud.google.com/resource-manager/docs/organization-policy/org-policy-constraints']],
 books: [['sre', 'Ch. 26 Data Integrity']] });

T({ id: 'vulnerabilities', sub: '1.2', obj: ['1.2.2', '1.2.3'], title: 'Finding and fixing vulnerabilities: IAP, Web Security Scanner, Artifact Analysis, Security Command Center', mins: 45,
 lead: 'Two families: tools that protect a running service (IAP) and tools that find problems (Web Security Scanner, Artifact Analysis, Security Command Center). The exam also asks what you do after a finding.',
 goals: ['Put an internal application behind Identity-Aware Proxy and verify the IAP JWT', 'Know what Web Security Scanner, Artifact Analysis and Security Command Center each detect', 'Follow the remediation loop: finding → fix → rebuild → redeploy → prevent'],
 body: () => `
${diagram({ w: 760, h: 210, nodes: [['u', 20, 80, 110, 50, 'Employee', 'client'], ['lb', 170, 70, 150, 70, 'Application LB', 'svc', 'HTTPS'], ['iap', 360, 70, 140, 70, 'IAP', 'auth', 'Google sign-in + IAM'], ['app', 550, 70, 190, 70, 'Admin app (Cloud Run / GKE)', 'ext', 'verifies x-goog-iap-jwt-assertion']],
 edges: [['u', 'lb', ''], ['lb', 'iap', ''], ['iap', 'app', 'only allowed users']] }, 'IAP checks identity and IAM (roles/iap.httpsResourceAccessor) before any request reaches the app. No VPN needed.')}
<h3>Identity-Aware Proxy</h3>
<ul class="tick"><li>Protects HTTPS apps behind an Application Load Balancer (Cloud Run, GKE, Compute Engine, App Engine) and TCP access to VMs (IAP TCP forwarding instead of public SSH).</li><li>Grant <code>roles/iap.httpsResourceAccessor</code> to users or groups; access levels add context (device, IP).</li><li>The app should verify the signed header <code>x-goog-iap-jwt-assertion</code> (issuer, audience) so requests that bypass IAP are rejected. Better still, allow only load balancer ingress.</li></ul>
${compareHTML('secscan')}
<h3>Remediation loop</h3>
<ol class="steps"><li><b>Detect</b>: Artifact Analysis reports CVE-XXXX in the base image of <code>orders:1.4.0</code>; Security Command Center shows it with severity and affected workloads.</li><li><b>Fix</b>: bump the base image or library (e.g. <code>eclipse-temurin:21-jre</code> to the patched tag), or apply the vendor fix.</li><li><b>Rebuild</b> in Cloud Build → new digest scanned on push.</li><li><b>Redeploy</b> (canary → full) and confirm the finding closes.</li><li><b>Prevent</b>: Binary Authorization / continuous validation to block images with critical vulnerabilities; org policies; automatic scanning in CI.</li></ol>
${code('bash', `
gcloud services enable containerscanning.googleapis.com          # automatic scanning on push
gcloud artifacts docker images list europe-west1-docker.pkg.dev/my-proj/shop --show-occurrences
gcloud artifacts docker images describe europe-west1-docker.pkg.dev/my-proj/shop/orders@sha256:abc… \\
  --show-package-vulnerability
# On-demand scan of a local image before pushing:
gcloud artifacts docker images scan orders:local      # On-Demand Scanning API`, 'Artifact Analysis')}
${code('java', `
// Verify the IAP JWT in a Spring filter (google-auth-library TokenVerifier)
TokenVerifier verifier = TokenVerifier.newBuilder()
    .setAudience("/projects/123456789/global/backendServices/987654321")
    .setIssuer("https://cloud.google.com/iap").build();
JsonWebSignature jws = verifier.verify(request.getHeader("x-goog-iap-jwt-assertion"));
String email = (String) jws.getPayload().get("email");`, 'Verify the IAP header')}`,
 traps: ['"Internal tool for employees, no VPN, Google accounts" → IAP. "SSH to VMs without public IPs" → IAP TCP forwarding.', 'Web Security Scanner tests <b>running, publicly reachable web apps</b> (XSS, mixed content, outdated libraries). Artifact Analysis scans <b>images and packages</b>. Do not swap them.', 'Security Command Center is the central place for findings (misconfigurations, threats, vulnerabilities); it does not fix them for you.', 'Fixing a vulnerable image means rebuilding and redeploying: patching a running container is not the answer.'],
 mistakes: ['Granting IAP access to allUsers or skipping the JWT check while leaving the backend reachable directly.', 'Ignoring findings in base images because "our code did not change".'],
 consider: { perf: 'IAP adds negligible latency at the load balancer.', sec: 'Defence in depth: IAP for who can reach the app, Cloud Armor for what traffic, Binary Authorization for what code runs.', cost: 'Artifact Analysis charges per scanned image; Security Command Center has Standard (free) and paid tiers.' },
 docs: [['IAP overview', 'https://cloud.google.com/iap/docs/concepts-overview'], ['Securing apps with signed headers', 'https://cloud.google.com/iap/docs/signed-headers-howto'], ['Web Security Scanner', 'https://cloud.google.com/security-command-center/docs/concepts-web-security-scanner-overview'], ['Artifact Analysis', 'https://cloud.google.com/artifact-analysis/docs/artifact-analysis'], ['Security Command Center', 'https://cloud.google.com/security-command-center/docs/security-command-center-overview']],
 books: [['bm', 'Ch. 11 Security'], ['rit', 'Ch. 11 Security']] });

T({ id: 'secrets', sub: '1.2', obj: ['1.2.4'], title: 'Secrets, credentials and encryption keys: Secret Manager, Cloud KMS, Workload Identity Federation', mins: 50,
 lead: 'Secrets go in Secret Manager, keys stay in Cloud KMS, and external workloads use federation instead of downloaded keys. Most wrong answers put a secret in code, an image or an environment file.',
 goals: ['Store, version, access and rotate secrets with Secret Manager (and mount them in Cloud Run and GKE)', 'Explain envelope encryption, CMEK and key rotation in Cloud KMS', 'Replace service account keys with Workload Identity Federation'],
 body: () => `
${compareHTML('secretsc')}
${code('bash', `
printf 's3cr3t-pa55' | gcloud secrets create db-password --data-file=- --replication-policy=automatic
gcloud secrets add-iam-policy-binding db-password \\
  --member=serviceAccount:orders-sa@my-proj.iam.gserviceaccount.com --role=roles/secretmanager.secretAccessor
# New version (rotation): old versions stay until you disable/destroy them
printf 'n3w-pa55' | gcloud secrets versions add db-password --data-file=-

# Cloud Run: as env var (resolved at instance start) or as a mounted file
gcloud run deploy orders --image=$IMG --region=europe-west1 \\
  --set-secrets=DB_PASSWORD=db-password:3,/secrets/api-key=partner-key:latest`, 'Secret Manager')}
${code('java', `
try (SecretManagerServiceClient client = SecretManagerServiceClient.create()) {
    SecretVersionName name = SecretVersionName.of("my-proj", "db-password", "latest");
    String password = client.accessSecretVersion(name).getPayload().getData().toStringUtf8();
}`, 'Read a secret in Java')}
<h3>Rotation</h3>
<ul class="tick"><li>Secret Manager can send a <b>rotation notification</b> to a Pub/Sub topic on a schedule; your code (a Cloud Run service or function) creates the new credential, adds a version and later disables the old one.</li><li>Pin a <b>specific version</b> in production deploys for repeatability, or read <code>latest</code> at runtime if you want rotation without redeploys (mounted volumes are re-read on access).</li></ul>
<h3>Cloud KMS and envelope encryption</h3>
${diagram({ w: 760, h: 170, nodes: [['d', 20, 60, 140, 50, 'Your data', 'ext'], ['dek', 210, 60, 160, 50, 'DEK (data key)', 'data', 'encrypts the data locally'], ['kek', 420, 60, 160, 50, 'KEK in Cloud KMS', 'auth', 'never leaves KMS'], ['st', 620, 60, 120, 50, 'Store', 'data', 'ciphertext + wrapped DEK']],
 edges: [['d', 'dek', 'encrypt'], ['dek', 'kek', 'wrap DEK'], ['kek', 'st', '']] }, 'Envelope encryption: KMS only encrypts the small data key; bulk data never travels to KMS.')}
<ul class="tick"><li>Hierarchy: <b>key ring</b> (location) → <b>key</b> (purpose) → <b>key versions</b>. Automatic rotation (symmetric keys) creates a new primary version; old versions still decrypt old data.</li><li><b>CMEK</b>: Google services (Cloud Storage, BigQuery, Cloud SQL, Pub/Sub, GKE disks…) encrypt with your KMS key; disabling the key makes the data unreadable. Default is Google-managed encryption.</li><li>Protection levels: software, HSM (Cloud HSM), external (Cloud EKM).</li><li>Roles: <code>roles/cloudkms.cryptoKeyEncrypterDecrypter</code> for using a key; separate it from <code>roles/cloudkms.admin</code>.</li></ul>
<h3>Workload Identity Federation</h3>
<p>A workload outside Google Cloud (GitHub Actions, AWS, Azure, on-premises OIDC/SAML) presents its own token; Google's Security Token Service exchanges it for a short-lived Google token, usually impersonating a service account. No key file exists, so none can leak.</p>
${code('bash', `
gcloud iam workload-identity-pools create github --location=global
gcloud iam workload-identity-pools providers create-oidc gh --location=global --workload-identity-pool=github \\
  --issuer-uri=https://token.actions.githubusercontent.com \\
  --attribute-mapping=google.subject=assertion.sub,attribute.repository=assertion.repository \\
  --attribute-condition="assertion.repository=='elaine/shop'"
gcloud iam service-accounts add-iam-policy-binding deployer@my-proj.iam.gserviceaccount.com --role=roles/iam.workloadIdentityUser \\
  --member="principalSet://iam.googleapis.com/projects/123/locations/global/workloadIdentityPools/github/attribute.repository/elaine/shop"`, 'GitHub Actions → Google Cloud without keys')}`,
 traps: ['Secrets in environment variables set in plain text, in the image, or in source control are always wrong answers.', 'Secret Manager stores secrets; Cloud KMS stores keys and performs cryptographic operations. "Encrypt application data with a key we control" → KMS (or CMEK).', 'Rotating a KMS key does not re-encrypt existing data; old versions keep decrypting it.', 'CI/CD outside Google Cloud needing access → Workload Identity Federation, not a JSON key in the CI secrets.'],
 mistakes: ['One shared secret accessible to every service account in the project (grant at the secret level).', 'Destroying a KMS key version that still protects data.'],
 consider: { perf: 'Cache secrets in memory for the life of the instance; do not call Secret Manager per request.', sec: 'Least privilege per secret; audit logs show every access; prefer short-lived credentials (federation, impersonation).', cost: 'Secret Manager bills per active version and access operation; KMS per key version and operation (HSM costs more).' },
 docs: [['Secret Manager overview', 'https://cloud.google.com/secret-manager/docs/overview'], ['Rotation of secrets', 'https://cloud.google.com/secret-manager/docs/secret-rotation'], ['Cloud Run secrets', 'https://cloud.google.com/run/docs/configuring/services/secrets'], ['Envelope encryption', 'https://cloud.google.com/kms/docs/envelope-encryption'], ['Workload Identity Federation', 'https://cloud.google.com/iam/docs/workload-identity-federation']],
 books: [['bm', 'Ch. 11 Security (secrets, credentials)'], ['k8p', 'Ch. 25 Secure Configuration']] });

T({ id: 'authn', sub: '1.2', obj: ['1.2.5'], title: 'Authenticating to Google Cloud: ADC, OAuth 2.0, JWT, Auth Proxies, Identity Platform', mins: 55,
 lead: 'Authentication questions hinge on two distinctions: access tokens (to call Google APIs) vs ID tokens (to prove identity to your own services), and workload identity vs end-user identity.',
 goals: ['Explain the ADC search order and use it locally and in production', 'Use OAuth 2.0 access tokens for Google APIs and OIDC ID tokens for Cloud Run/IAP', 'Connect to Cloud SQL and AlloyDB with the Auth Proxy or language connectors', 'Add end-user sign-in with Identity Platform and verify its JWTs'],
 body: () => `
${diagram({ w: 760, h: 220, nodes: [['code', 20, 85, 150, 50, 'Your code', 'ext', 'client library'], ['e1', 230, 10, 240, 46, '1. GOOGLE_APPLICATION_CREDENTIALS', 'auth', 'file path (avoid keys)'], ['e2', 230, 87, 240, 46, '2. gcloud ADC file', 'auth', 'gcloud auth application-default login'], ['e3', 230, 164, 240, 46, '3. Attached service account', 'auth', 'metadata server (Cloud Run, GKE, GCE)'], ['api', 560, 85, 180, 50, 'Google APIs', 'svc', 'Bearer access token']],
 edges: [['code', 'e1', ''], ['code', 'e2', ''], ['code', 'e3', ''], ['e3', 'api', ''], ['e2', 'api', '', 'dash']] }, 'Application Default Credentials: the same code finds your user credentials locally and the service account in production.')}
${compareHTML('tokens')}
${code('bash', `
gcloud auth application-default login                       # local dev: your user via ADC
gcloud auth application-default login --impersonate-service-account=orders-sa@my-proj.iam.gserviceaccount.com
gcloud auth print-access-token                              # OAuth access token → Google APIs
gcloud auth print-identity-token --audiences=https://orders-abc-ew.a.run.app   # ID token → your Cloud Run service`, 'Tokens from the CLI')}
${code('java', `
// Call a private Cloud Run service from another service: ID token with audience = target URL
GoogleCredentials creds = GoogleCredentials.getApplicationDefault();
IdTokenCredentials idToken = IdTokenCredentials.newBuilder()
    .setIdTokenProvider((IdTokenProvider) creds)
    .setTargetAudience("https://inventory-abc-ew.a.run.app").build();
HttpRequest req = new NetHttpTransport().createRequestFactory(new HttpCredentialsAdapter(idToken))
    .buildGetRequest(new GenericUrl("https://inventory-abc-ew.a.run.app/v1/stock/sku-1"));
String body = req.execute().parseAsString();`, 'Service-to-service with an ID token')}
<h3>Databases without passwords in the network path</h3>
<ul class="tick"><li><b>Cloud SQL Auth Proxy</b> (or the Java connector <code>cloud-sql-jdbc-socket-factory</code>): authorises with IAM, encrypts with TLS 1.3, no authorized networks or client certificates to manage. On GKE run it as a sidecar; on Cloud Run use the built-in connection (<code>--add-cloudsql-instances</code>).</li><li><b>IAM database authentication</b>: log in as the service account instead of a password.</li><li><b>AlloyDB Auth Proxy / AlloyDB connectors</b>: the same model for AlloyDB.</li></ul>
${code('yaml', `
spring:
  datasource:
    url: jdbc:postgresql:///orders?cloudSqlInstance=my-proj:europe-west1:orders-db&socketFactory=com.google.cloud.sql.postgres.SocketFactory&enableIamAuth=true
    username: orders-sa@my-proj.iam          # IAM database user (service account without .gserviceaccount.com)`, 'Cloud SQL Java connector + IAM auth')}
<h3>End users: Identity Platform</h3>
<p>Customer identity as a service: email/password, phone, social providers, SAML/OIDC enterprise IdPs, MFA, multi-tenancy. The browser signs in and receives an <b>ID token (JWT)</b>; your backend verifies signature, issuer, audience and expiry (Firebase Admin SDK or API Gateway JWT auth) and reads the user ID from <code>sub</code>.</p>
${code('java', `
FirebaseToken token = FirebaseAuth.getInstance().verifyIdToken(bearer);   // checks signature, aud, iss, exp
String uid = token.getUid();`, 'Verify an Identity Platform ID token')}
<h3>A JWT, decoded</h3>
${code('json', `
{ "alg": "RS256", "kid": "a1b2…" }                       // header: how it is signed
{ "iss": "https://accounts.google.com",                     // payload: claims
  "aud": "https://inventory-abc-ew.a.run.app",
  "sub": "1093847…", "email": "orders-sa@my-proj.iam.gserviceaccount.com",
  "iat": 1795000000, "exp": 1795003600 }
// + signature: verify with the issuer's public keys (JWKS); never trust an unverified JWT`, 'JWT = header.payload.signature (base64url)')}`,
 traps: ['Calling Cloud Run, Cloud Run functions or IAP-protected apps needs an <b>ID token</b> whose audience is the target URL. Calling googleapis.com needs an <b>access token</b>.', 'Service account key files are the last resort: prefer attached service accounts, impersonation and Workload Identity Federation.', '"Connect to Cloud SQL securely without managing SSL certificates or IP allowlists" → Cloud SQL Auth Proxy / connectors.', '"Users sign in with Google, Facebook or a corporate SAML IdP to your app" → Identity Platform. IAM is for Google Cloud resources, not your app\'s customers.'],
 mistakes: ['Setting GOOGLE_APPLICATION_CREDENTIALS in production containers to a baked-in key file.', 'Accepting any Google ID token without checking the audience.'],
 consider: { perf: 'Client libraries cache and refresh tokens; create clients once and reuse them.', sec: 'Short-lived tokens, audience checks, no long-lived keys; IAM DB auth removes database passwords.', cost: 'Identity Platform bills per monthly active user beyond a free tier.' },
 docs: [['How ADC works', 'https://cloud.google.com/docs/authentication/application-default-credentials'], ['Authenticating service-to-service (Cloud Run)', 'https://cloud.google.com/run/docs/authenticating/service-to-service'], ['Cloud SQL Auth Proxy', 'https://cloud.google.com/sql/docs/postgres/sql-proxy'], ['AlloyDB Auth Proxy', 'https://cloud.google.com/alloydb/docs/auth-proxy/overview'], ['Identity Platform', 'https://cloud.google.com/identity-platform/docs/product-overview']],
 books: [['bm', 'Ch. 11 Security (tokens, JWT, service-to-service authentication)']] });

T({ id: 'iam', sub: '1.2', obj: ['1.2.6', '1.2.8'], title: 'IAM roles for service accounts and least privilege', mins: 50,
 lead: 'IAM answers are judged on least privilege: the narrowest role, on the narrowest resource, for a dedicated identity, without keys.',
 goals: ['Read an IAM policy: principal + role + resource, inherited down the hierarchy', 'Choose predefined vs custom roles and avoid basic roles', 'Create one service account per workload; know actAs (serviceAccountUser) and impersonation (serviceAccountTokenCreator)', 'Use IAM Recommender, Policy Troubleshooter and conditions'],
 body: () => `
${diagram({ w: 760, h: 230, nodes: [['org', 20, 20, 160, 46, 'Organization', 'auth', 'org policies'], ['f', 20, 92, 160, 46, 'Folder: prod', 'auth'], ['p', 20, 164, 160, 46, 'Project: shop-prod', 'auth'], ['r1', 260, 164, 170, 46, 'Secret: db-password', 'data'], ['r2', 260, 92, 170, 46, 'Bucket: invoices', 'data'], ['sa', 520, 120, 220, 60, 'orders-sa', 'ext', 'secretAccessor on db-password only']],
 edges: [['org', 'f', 'inherits'], ['f', 'p', 'inherits'], ['p', 'r1', ''], ['p', 'r2', ''], ['sa', 'r1', 'binding', 'dash']] }, 'Policies are inherited downward and are additive: a role granted on the project applies to every resource in it. Grant on the resource whenever you can.')}
<div class="tscroll"><table><thead><tr><th>Role type</th><th>Example</th><th>Use</th></tr></thead><tbody>
<tr><td>Basic</td><td>Owner, Editor, Viewer</td><td>Avoid in production: thousands of permissions</td></tr>
<tr><td>Predefined</td><td><code>roles/run.invoker</code>, <code>roles/pubsub.publisher</code>, <code>roles/storage.objectViewer</code>, <code>roles/cloudsql.client</code></td><td>Default choice; maintained by Google</td></tr>
<tr><td>Custom</td><td><code>projects/shop/roles/invoiceReader</code></td><td>When no predefined role is narrow enough; you maintain it</td></tr></tbody></table></div>
<h3>Try it: IAM evaluator</h3>
<div data-sim="iam"></div>
<h3>Service account patterns</h3>
<ul class="tick"><li><b>One service account per workload</b> (orders-sa, billing-sa). Never run production on the Compute Engine default service account (it historically has Editor).</li><li>To deploy a Cloud Run service or VM <i>as</i> a service account, the deployer needs <code>roles/iam.serviceAccountUser</code> on that service account (the <i>actAs</i> permission).</li><li>To get tokens for a service account (impersonation), a principal needs <code>roles/iam.serviceAccountTokenCreator</code> on it. Developers impersonate instead of downloading keys.</li><li><b>Service agents</b> (e.g. <code>service-123@gcp-sa-pubsub.iam.gserviceaccount.com</code>) are Google-managed identities that act for a service; some setups require granting them roles (dead-letter topics, CMEK).</li><li><b>IAM Conditions</b>: grant only for resources whose name starts with a prefix, or only until a date.</li><li><b>Deny policies</b> can block permissions regardless of allow policies.</li></ul>
${code('bash', `
gcloud iam service-accounts create orders-sa --display-name="orders service"
gcloud pubsub topics add-iam-policy-binding orders --member=serviceAccount:orders-sa@my-proj.iam.gserviceaccount.com --role=roles/pubsub.publisher
gcloud run services add-iam-policy-binding inventory --region=europe-west1 \\
  --member=serviceAccount:orders-sa@my-proj.iam.gserviceaccount.com --role=roles/run.invoker
# Who can do what? Why was access denied?
gcloud recommender recommendations list --recommender=google.iam.policy.Recommender --project=my-proj --location=global
gcloud policy-intelligence troubleshoot-policy iam //run.googleapis.com/projects/my-proj/locations/europe-west1/services/inventory \\
  --principal-email=orders-sa@my-proj.iam.gserviceaccount.com --permission=run.routes.invoke`, 'Least privilege in practice')}`,
 traps: ['Granting a role at project level when the scenario names one resource → too broad. Grant on the topic, secret, bucket or service.', '<code>roles/iam.serviceAccountUser</code> (act as / attach) vs <code>roles/iam.serviceAccountTokenCreator</code> (mint tokens / impersonate): know which the question needs.', 'You cannot remove an inherited permission by granting a lower role at a child level; use deny policies or restructure.', 'Groups, not individual users, for human access.'],
 mistakes: ['Editor on the CI/CD service account.', 'Sharing one service account between unrelated services, so a compromise of one exposes all.', 'Downloading service account keys for local development.'],
 consider: { perf: 'IAM changes usually propagate within a few minutes; design deploy scripts to tolerate that delay.', sec: 'Review with IAM Recommender (removes unused permissions), Policy Analyzer and audit logs.', cost: 'No direct cost; over-privileged identities raise breach impact.' },
 docs: [['IAM overview', 'https://cloud.google.com/iam/docs/overview'], ['Service accounts best practices', 'https://cloud.google.com/iam/docs/best-practices-service-accounts'], ['Service account impersonation', 'https://cloud.google.com/iam/docs/service-account-impersonation'], ['IAM Recommender', 'https://cloud.google.com/policy-intelligence/docs/role-recommendations-overview'], ['IAM Conditions', 'https://cloud.google.com/iam/docs/conditions-overview']],
 books: [['k8p', 'Ch. 26 Access Control'], ['bm', 'Ch. 11 Security (least privilege)']] });

T({ id: 's2s', sub: '1.2', obj: ['1.2.7'], title: 'Secure service-to-service communication', mins: 50,
 lead: 'Private networking stops strangers reaching a service; authentication proves which service is calling. Exam answers usually need both.',
 goals: ['Lock down Cloud Run with ingress settings and IAM invoker', 'Reach private resources with Direct VPC egress and Private Service Connect / private services access', 'Apply Kubernetes Network Policies and Cloud Service Mesh mTLS on GKE'],
 body: () => `
${diagram({ w: 760, h: 240, zones: [[260, 10, 490, 220, 'VPC']], nodes: [['fe', 20, 40, 180, 56, 'frontend (Cloud Run)', 'ext', 'ingress: all + LB'], ['api', 300, 40, 170, 56, 'orders (Cloud Run)', 'ext', 'ingress: internal'], ['sql', 540, 20, 190, 50, 'Cloud SQL (private IP)', 'data', 'private services access'], ['psc', 540, 95, 190, 50, 'Google APIs via PSC', 'svc', 'private endpoint'], ['gke', 300, 150, 170, 60, 'GKE pods', 'ext', 'NetworkPolicy + mesh mTLS'], ['mem', 540, 165, 190, 50, 'Memorystore', 'data']],
 edges: [['fe', 'api', 'ID token + VPC egress'], ['api', 'sql', 'Direct VPC egress'], ['api', 'psc', ''], ['gke', 'mem', ''], ['api', 'gke', 'mTLS', 'dash']] }, 'Network controls (ingress, egress, policies) and identity controls (ID tokens, mTLS, IAM) layered together.')}
${compareHTML('s2sc')}
${code('bash', `
# orders accepts only traffic from inside the VPC/project and authenticated callers
gcloud run services update orders --region=europe-west1 --ingress=internal --no-allow-unauthenticated
# frontend sends its egress through the VPC so its calls count as internal
gcloud run services update frontend --region=europe-west1 \\
  --network=shop-vpc --subnet=run-subnet --vpc-egress=all-traffic`, 'Cloud Run ingress and egress')}
${code('yaml', `
# Default deny, then allow only frontend → orders on 8080
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: orders-allow-frontend, namespace: shop }
spec:
  podSelector: { matchLabels: { app: orders } }
  policyTypes: [Ingress]
  ingress:
  - from: [{ podSelector: { matchLabels: { app: frontend } } }]
    ports: [{ protocol: TCP, port: 8080 }]
---
# Cloud Service Mesh (Istio API): require mTLS for every workload in the namespace
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: { name: default, namespace: shop }
spec: { mtls: { mode: STRICT } }`, 'GKE: NetworkPolicy and mesh mTLS')}`,
 traps: ['Cloud Run ingress <code>internal</code> alone does not authenticate: add <code>--no-allow-unauthenticated</code> and grant <code>roles/run.invoker</code> to the calling service account.', 'For a Cloud Run caller\'s traffic to count as internal, route its egress through the VPC (Direct VPC egress / connector with all-traffic).', 'Cloud SQL private IP uses <b>private services access</b> (VPC peering); reaching Google APIs or third-party published services privately uses <b>Private Service Connect</b>; VMs without external IPs reach Google APIs with <b>Private Google Access</b>.', 'Network Policies need enforcement (GKE Dataplane V2 or network policy enforcement enabled). Without a policy selecting a Pod, all traffic is allowed.', '"Encrypt and authenticate all pod-to-pod traffic without changing code" → Cloud Service Mesh with STRICT mTLS.'],
 mistakes: ['Relying only on "the URL is secret".', 'Opening a firewall rule from 0.0.0.0/0 to reach a database.'],
 consider: { perf: 'Mesh sidecars add a little latency and resource use per Pod (proxyless gRPC and managed data planes reduce it).', sec: 'VPC Service Controls add a perimeter against data exfiltration from Google APIs.', cost: 'Serverless VPC Access connectors are VMs you pay for; Direct VPC egress avoids them.' },
 docs: [['Cloud Run ingress', 'https://cloud.google.com/run/docs/securing/ingress'], ['Direct VPC egress', 'https://cloud.google.com/run/docs/configuring/vpc-direct-vpc'], ['Private Service Connect', 'https://cloud.google.com/vpc/docs/private-service-connect'], ['GKE network policies', 'https://cloud.google.com/kubernetes-engine/docs/how-to/network-policy'], ['Cloud Service Mesh', 'https://cloud.google.com/service-mesh/docs/overview']],
 books: [['k8p', 'Ch. 24 Network Segmentation'], ['bm', 'Ch. 11 Security (zero trust, mTLS)']] });

T({ id: 'binauthz', sub: '1.2', obj: ['1.2.9', '2.2.2'], title: 'Binary Authorization and build provenance', mins: 35,
 lead: 'Binary Authorization answers one question at deploy time: is this exact image allowed to run here? Provenance and attestations from your build pipeline are the evidence.',
 goals: ['Write a Binary Authorization policy with attestors', 'Enable enforcement on GKE and Cloud Run (and dry-run, break-glass)', 'Connect Cloud Build provenance (SLSA) to the policy'],
 body: () => `
${diagram({ w: 760, h: 190, nodes: [['cb', 20, 70, 150, 56, 'Cloud Build', 'svc', 'build + provenance'], ['ar', 210, 70, 150, 56, 'Artifact Registry', 'data', 'scan on push'], ['att', 400, 20, 160, 56, 'Attestation', 'auth', 'signed with KMS key'], ['ba', 400, 115, 160, 56, 'Binary Authorization', 'auth', 'policy per project'], ['run', 600, 70, 140, 56, 'GKE / Cloud Run', 'ext', 'deploy allowed?']],
 edges: [['cb', 'ar', 'push'], ['cb', 'att', 'attest digest'], ['ar', 'ba', ''], ['att', 'ba', 'evidence'], ['ba', 'run', 'allow / deny']] }, 'Only digests with the required attestations deploy. Everything else is blocked (or logged in dry-run mode).')}
${code('yaml', `
# policy.yaml (gcloud container binauthz policy import policy.yaml)
globalPolicyEvaluationMode: ENABLE
defaultAdmissionRule:
  evaluationMode: REQUIRE_ATTESTATION
  enforcementMode: ENFORCED_BLOCK_AND_AUDIT_LOG     # or DRYRUN_AUDIT_LOG_ONLY while testing
  requireAttestationsBy:
  - projects/my-proj/attestors/built-by-cloud-build
  - projects/my-proj/attestors/vuln-scan-passed`, 'Binary Authorization policy')}
${code('bash', `
gcloud run deploy orders --image=europe-west1-docker.pkg.dev/my-proj/shop/orders@sha256:… \\
  --region=europe-west1 --binary-authorization=default
gcloud container clusters update prod --region=europe-west1 --binauthz-evaluation-mode=PROJECT_SINGLETON_POLICY_ENFORCE
# See the SLSA provenance Cloud Build attached to an image
gcloud artifacts docker images describe europe-west1-docker.pkg.dev/my-proj/shop/orders:1.5.0 --show-provenance`, 'Enforce and inspect')}
<ul class="tick"><li><b>Attestors</b> hold public keys (often Cloud KMS asymmetric keys). An attestation = signature over an image <b>digest</b> (tags are not accepted).</li><li>Cloud Build can generate <b>SLSA build provenance</b> automatically for images it pushes, and a <b>built-by-cloud-build</b> attestor can require that images came from your pipeline.</li><li><b>Dry-run</b> mode logs violations without blocking; <b>break-glass</b> lets emergencies deploy with an annotation that is audit-logged.</li><li><b>Continuous validation</b> on GKE re-checks running Pods against check-based policies.</li></ul>`,
 traps: ['"Only images built by our CI pipeline may run in production" → Binary Authorization requiring an attestation from the pipeline (built-by-cloud-build).', 'Policies evaluate image digests: deploying by tag works only if the platform resolves it to a digest that has attestations.', 'Vulnerability scanning finds problems; Binary Authorization prevents deployment. Combine them with an attestor that signs only images that passed the scan.'],
 mistakes: ['Enabling enforce mode in production without a dry-run period.', 'Granting developers the attestor signing key.'],
 consider: { perf: 'Admission check happens at deploy time only.', sec: 'Supply-chain security: provenance + attestation + policy + private registries.', cost: 'No major cost; KMS operations for signing.' },
 docs: [['Binary Authorization overview', 'https://cloud.google.com/binary-authorization/docs/overview'], ['Binary Authorization for Cloud Run', 'https://cloud.google.com/binary-authorization/docs/run/enabling-binauthz-cloud-run'], ['Cloud Build provenance', 'https://cloud.google.com/build/docs/securing-builds/generate-validate-build-provenance'], ['SLSA', 'https://slsa.dev/']],
 books: [['bm', 'Ch. 7 Build (artifacts, immutability)']] });

// ===================== OBJECTIVE 1.3 · Storing and accessing data =====================
T({ id: 'storagechoice', sub: '1.3', obj: ['1.3.1'], title: 'Choosing the storage system', mins: 45,
 lead: 'Storage questions give you a data shape, a size, an access pattern and a consistency need. Four answers usually remain plausible until you check the scale and the query type.',
 goals: ['Map data shape and access pattern to Cloud Storage, Cloud SQL, AlloyDB, Spanner, Firestore, Bigtable, BigQuery or Memorystore', 'Use volume and performance thresholds to break ties', 'Recognise analytics vs transactional workloads'],
 body: () => `
<h3>Try it: storage decision tree</h3>
<div data-sim="storage"></div>
${compareHTML('storage')}
<h3>Tie-breakers the exam uses</h3>
<ul class="tick"><li><b>Relational and fits one region</b> → Cloud SQL (MySQL, PostgreSQL, SQL Server; up to tens of TB). <b>PostgreSQL with heavy load, analytics on live data, vectors</b> → AlloyDB. <b>Relational, horizontal scale, global, 99.999%</b> → Spanner.</li><li><b>Documents for mobile/web, offline sync, realtime listeners, serverless</b> → Firestore.</li><li><b>Millions of writes per second, time series, IoT, key lookups/scans, TB–PB</b> → Bigtable (no SQL joins, no multi-row transactions).</li><li><b>SQL analytics over large datasets, dashboards, ML</b> → BigQuery (not for OLTP).</li><li><b>Files, images, backups, data lake</b> → Cloud Storage.</li><li><b>Sub-millisecond cache or session store</b> → Memorystore.</li></ul>`,
 traps: ['BigQuery is the wrong answer for transactional, row-at-a-time workloads; Cloud SQL is the wrong answer for petabyte analytics.', 'Bigtable is not cost-effective for small datasets (under about 1 TB) and has no secondary indexes: queries must use the row key.', 'Firestore in Datastore mode = server-side apps on the Datastore API; Native mode = mobile/web features (realtime, offline).', 'Spanner when the scenario says "global", "horizontal scaling of writes" or "strong consistency across regions".'],
 mistakes: ['Choosing Spanner for a small regional app "to be safe": cost and schema constraints for no benefit.', 'Storing large binary files in a database instead of Cloud Storage with a reference.'],
 consider: { perf: 'Match the access pattern: point reads (Bigtable/Firestore), joins (SQL), scans/aggregations (BigQuery).', sec: 'All encrypt at rest by default; CMEK available; IAM vs database users differ per product.', cost: 'Spanner and Bigtable bill provisioned compute; BigQuery bills storage plus bytes scanned or slots; Cloud Storage by class.' },
 docs: [['Choose a storage option', 'https://cloud.google.com/architecture/storage-advisor'], ['Database products', 'https://cloud.google.com/products/databases'], ['Bigtable overview', 'https://cloud.google.com/bigtable/docs/overview'], ['AlloyDB overview', 'https://cloud.google.com/alloydb/docs/overview']],
 books: [['ddia', 'Ch. 2 Data Models and Query Languages · Ch. 3 Storage and Retrieval']] });

T({ id: 'schemas', sub: '1.3', obj: ['1.3.2'], title: 'Schema design: AlloyDB, Spanner, Bigtable, Firestore', mins: 55,
 lead: 'Distributed databases punish keys that grow in order (timestamps, sequences): all writes land on one server. Most schema questions are hotspot questions in disguise.',
 goals: ['Design Spanner primary keys and interleaved tables', 'Design Bigtable row keys for the read pattern without hotspots', 'Model Firestore collections, documents and indexes', 'Apply relational design and indexing in AlloyDB / Cloud SQL'],
 body: () => `
${diagram({ w: 760, h: 180, nodes: [['bad', 20, 30, 330, 56, 'Key = 2026-11-13T10:00:01, …:02, …:03', 'ext', 'all new rows on the last split → hotspot'], ['good', 400, 30, 340, 56, 'Key = device#4711#reverse-ts', 'data', 'spread across splits by device'], ['s1', 20, 120, 100, 44, 'split 1', 'svc'], ['s2', 135, 120, 100, 44, 'split 2', 'svc'], ['s3', 250, 120, 100, 44, 'split 3 (hot)', 'auth'], ['t1', 400, 120, 100, 44, 'split 1', 'svc'], ['t2', 520, 120, 100, 44, 'split 2', 'svc'], ['t3', 640, 120, 100, 44, 'split 3', 'svc']],
 edges: [['bad', 's3', 'every write'], ['good', 't1', ''], ['good', 't2', ''], ['good', 't3', '']] }, 'Rows are stored sorted by key and split into ranges. Monotonic keys send all writes to one range.')}
<h3>Spanner</h3>
${code('sql', `
CREATE TABLE Customers (
  CustomerId STRING(36) NOT NULL,          -- UUIDv4: random, no hotspot
  Name       STRING(MAX)
) PRIMARY KEY (CustomerId);

CREATE TABLE Orders (
  CustomerId STRING(36) NOT NULL,
  OrderId    STRING(36) NOT NULL,
  CreatedAt  TIMESTAMP NOT NULL OPTIONS (allow_commit_timestamp = true),
  Total      NUMERIC
) PRIMARY KEY (CustomerId, OrderId),
  INTERLEAVE IN PARENT Customers ON DELETE CASCADE;   -- child rows stored with their parent

CREATE INDEX OrdersByDate ON Orders(CreatedAt DESC) STORING (Total);`, 'Spanner DDL')}
<ul class="tick"><li>Avoid monotonically increasing keys: use UUIDv4, a <b>bit-reversed sequence</b>, or a hash prefix. If you must keep a timestamp, put it after a high-cardinality column.</li><li><b>Interleaving</b> co-locates children with parents: fast parent+child reads and joins.</li><li>Secondary indexes with <code>STORING</code> avoid a lookup back to the base table.</li><li>Reads: <b>strong</b> (latest) or <b>stale</b> (bounded/exact staleness, lower latency).</li></ul>
<h3>Bigtable</h3>
${code('text', `
Query: "last hour of readings for device 4711"
Row key:  sensor#4711#9223370270117775807      (Long.MAX_VALUE - epochMillis → newest first)
Column families:  m (metrics: temp, humidity)   meta (firmware, location)
Rules: one row = one entity/event, keep rows < 100 MB, design keys for prefix scans,
       field promotion (move fields into the key), salting/hash prefix only if needed,
       reverse domain names (com.example.www), no leading timestamp.`, 'Bigtable row key design')}
<h3>Firestore</h3>
${code('text', `
users/{userId}                         { name, email, plan }
users/{userId}/orders/{orderId}        { total, status, createdAt }   ← subcollection
products/{productId}                   { name, price, tags: [...] }
Limits: document ≤ 1 MiB · sustained ~1 write/s per document (use distributed counters)
Queries need indexes: single-field automatic, composite indexes declared (firestore.indexes.json)
Avoid sequential document IDs and "ramp up" new collections gradually (500/50/5 rule)`, 'Firestore model')}
<h3>AlloyDB / Cloud SQL</h3>
<p>Classic relational design: normalise to third normal form for OLTP, add indexes for the queries you run (check with <code>EXPLAIN ANALYZE</code>), use foreign keys and transactions. AlloyDB adds a <b>columnar engine</b> that accelerates analytical queries on the same data and <b>vector</b> search for AI features.</p>`,
 traps: ['"Inserts slow down as traffic grows; key is an auto-increment ID or timestamp" in Spanner, Bigtable or Firestore → hotspot. Fix the key.', 'Bigtable has a single index (the row key). If you need another access path, write a second table keyed differently.', 'Firestore counters updated many times per second → distributed counter (shards).', 'Spanner interleaving is for parent-child access patterns; it is not a foreign key in the classic sense (though it enforces parent existence).'],
 mistakes: ['Wide Bigtable rows that grow without bound (a row per device forever).', 'Firestore queries failing in production because a composite index was only created in the emulator.'],
 consider: { perf: 'Good keys spread load; good indexes avoid full scans; STORING/covering indexes avoid extra reads.', sec: 'Fine-grained access: Firestore security rules (mobile/web), Spanner fine-grained access control, row-level security in PostgreSQL.', cost: 'Indexes cost storage and write amplification; create the ones queries need.' },
 docs: [['Spanner schema design best practices', 'https://cloud.google.com/spanner/docs/schema-design'], ['Bigtable schema design', 'https://cloud.google.com/bigtable/docs/schema-design'], ['Firestore best practices', 'https://cloud.google.com/firestore/docs/best-practices'], ['AlloyDB columnar engine', 'https://cloud.google.com/alloydb/docs/columnar-engine/about']],
 books: [['ddia', 'Ch. 6 Partitioning (key-range partitioning, hot spots) · Ch. 3 Storage and Retrieval (indexes)']] });

T({ id: 'consistency', sub: '1.3', obj: ['1.3.3'], title: 'Strong vs eventual consistency in replicated storage', mins: 40,
 lead: 'After a write, will the next read see it? Which replica you read from, and how it is replicated, decides the answer.',
 goals: ['State the consistency model of Cloud SQL, AlloyDB, Spanner, Bigtable and Cloud Storage', 'Choose read paths that trade freshness for latency deliberately', 'Spot stale-read bugs in scenarios'],
 body: () => `
<h3>Try it: replication and reads</h3>
<div data-sim="consist"></div>
<div class="tscroll"><table><thead><tr><th>Store</th><th>Read from…</th><th>Guarantee</th></tr></thead><tbody>
<tr><td>Cloud SQL</td><td>Primary · read replica</td><td>Strong · eventual (replication lag)</td></tr>
<tr><td>AlloyDB</td><td>Primary · read pool</td><td>Strong · near real time (small lag)</td></tr>
<tr><td>Spanner</td><td>Strong read · stale read (bounded/exact staleness)</td><td>External consistency (linearizable, global) · consistent snapshot in the past, lower latency</td></tr>
<tr><td>Bigtable</td><td>Single-cluster routing · multi-cluster routing</td><td>Read-your-writes in that cluster · eventual across clusters</td></tr>
<tr><td>Cloud Storage</td><td>Any location type</td><td>Strong for object writes, overwrites, deletes, listing and metadata. Cached copies (CDN, public Cache-Control) can be stale; IAM changes take time to propagate</td></tr>
<tr><td>Firestore</td><td>Any</td><td>Strong</td></tr></tbody></table></div>
${code('java', `
// Spanner: strong read (default) vs bounded-staleness read for a latency-sensitive catalogue page
try (ResultSet rs = db.singleUse().executeQuery(Statement.of("SELECT Name FROM Products WHERE Id = 'p1'"))) { … }
try (ResultSet rs = db.singleUse(TimestampBound.ofMaxStaleness(15, TimeUnit.SECONDS))
        .executeQuery(Statement.of("SELECT Name FROM Products WHERE Id = 'p1'"))) { … }`, 'Spanner read types')}`,
 traps: ['"User updates profile, refreshes, sees old data" with reads going to a Cloud SQL read replica → replication lag. Read your own writes from the primary.', 'Bigtable multi-cluster routing can return stale data from another cluster right after a write; use single-cluster routing when read-your-writes matters.', 'Cloud Storage itself is strongly consistent; staleness comes from caches you added.', 'Spanner stale reads are a deliberate optimisation, not a bug.'],
 mistakes: ['Load balancing reads across replicas for flows that immediately read what they wrote (checkout, profile edit).', 'Assuming "eventual" means "seconds" without monitoring replication lag.'],
 consider: { perf: 'Replicas and stale reads cut latency and primary load.', sec: 'Consistency also affects authorisation checks: do not authorise on stale permission data.', cost: 'Extra replicas cost money; stale reads in Spanner reduce cross-region round trips.' },
 docs: [['Cloud Storage consistency', 'https://cloud.google.com/storage/docs/consistency'], ['Spanner reads', 'https://cloud.google.com/spanner/docs/reads'], ['Bigtable consistency and app profiles', 'https://cloud.google.com/bigtable/docs/replication-overview#consistency-model'], ['Cloud SQL read replicas', 'https://cloud.google.com/sql/docs/postgres/replication']],
 books: [['ddia', 'Ch. 5 Replication (replication lag, read-your-writes) · Ch. 9 Consistency and Consensus (linearizability)']] });

T({ id: 'signedurls', sub: '1.3', obj: ['1.3.4'], title: 'Signed URLs for Cloud Storage', mins: 35,

 consider: { perf: 'Direct upload/download removes your service from the data path; use resumable uploads for large files.', sec: 'Short expiry, Content-Type in the signature, private bucket with uniform bucket-level access.', cost: 'Less egress and CPU through your service.' },

T({ id: 'bigquery', sub: '1.3', obj: ['1.3.5'], title: 'Writing data to BigQuery for analytics and AI/ML', mins: 45,
 lead: 'Batch or stream? Exactly-once or best effort? Code or no code? The ingestion method follows from those three answers.',
 goals: ['Choose between load jobs, the Storage Write API, legacy streaming inserts, Pub/Sub BigQuery subscriptions and Dataflow', 'Write rows from Java with the Storage Write API', 'Design partitioned and clustered tables and use them for ML'],
 body: () => `
${compareHTML('bqin')}
${code('java', `
// Storage Write API, default stream (at-least-once, low latency). Use application-created committed
// streams with offsets when you need exactly-once.
TableName table = TableName.of("my-proj", "shop", "orders");
try (JsonStreamWriter writer = JsonStreamWriter.newBuilder(table.toString(), BigQueryWriteClient.create()).build()) {
    JSONArray rows = new JSONArray();
    rows.put(new JSONObject().put("order_id", "o-1").put("total", 42.5).put("created_at", Instant.now().toString()));
    writer.append(rows).get();     // check AppendRowsResponse for row errors
}`, 'Storage Write API (Java)')}
${code('bash', `
# Batch: load files from Cloud Storage (no ingestion charge)
bq load --source_format=PARQUET shop.orders gs://shop-exports/orders/2026-11-13/*.parquet
# No-code streaming: Pub/Sub → BigQuery subscription
gcloud pubsub subscriptions create orders-to-bq --topic=orders \\
  --bigquery-table=my-proj:shop.orders --use-table-schema`, 'Load job and BigQuery subscription')}
${code('sql', `
CREATE TABLE shop.orders (order_id STRING, customer_id STRING, total NUMERIC, created_at TIMESTAMP)
PARTITION BY DATE(created_at)          -- queries filtered by date scan only those partitions
CLUSTER BY customer_id;                -- sorted blocks: cheaper filters on customer_id

-- AI/ML on the same data
CREATE MODEL shop.churn OPTIONS (model_type = 'logistic_reg', input_label_cols = ['churned']) AS
SELECT * FROM shop.customer_features;`, 'Partitioning, clustering, BigQuery ML')}`,
 traps: ['"Stream events with exactly-once semantics into BigQuery" → Storage Write API with committed streams and offsets.', '"Daily CSV/Parquet exports, cheapest" → batch load jobs from Cloud Storage.', '"No code, just get Pub/Sub messages into a table" → BigQuery subscription.', 'DML <code>INSERT</code> statements are not an ingestion pipeline for high-volume streams.'],
 mistakes: ['Unpartitioned tables queried with <code>SELECT *</code>: full scans every time.', 'Using legacy <code>insertAll</code> for new high-throughput pipelines.'],
 consider: { perf: 'Partition + cluster on the columns you filter on; batch appends in the Write API.', sec: 'Dataset-level IAM, authorised views, column-level and row-level security, CMEK.', cost: 'Load jobs are free to ingest; streaming is billed; queries billed by bytes scanned (on-demand) or slots.' },
 docs: [['Introduction to loading data', 'https://cloud.google.com/bigquery/docs/loading-data'], ['Storage Write API', 'https://cloud.google.com/bigquery/docs/write-api'], ['BigQuery subscriptions', 'https://cloud.google.com/pubsub/docs/bigquery'], ['Partitioned tables', 'https://cloud.google.com/bigquery/docs/partitioned-tables'], ['BigQuery ML', 'https://cloud.google.com/bigquery/docs/bqml-introduction']],
 books: [['ddia', 'Ch. 10 Batch Processing · Ch. 11 Stream Processing']] });

T({ id: 'testing', sub: '2.3', obj: ['2.3.1', '2.3.2'], title: 'Testing: AI-assisted unit tests and integration tests in Cloud Build', mins: 45,
 lead: 'The current guide expects you to use an AI assistant to write unit tests and to run integration tests automatically in the pipeline. The skill tested is judgement: what to accept, what to verify, where each test runs.',
 goals: ['Use Gemini Code Assist to generate and improve JUnit tests, and review them critically', 'Run integration tests against emulators inside Cloud Build', 'Gate deployments on test results'],
 body: () => `
<h3>AI-assisted unit tests: a workflow</h3>
<ol class="steps"><li>Select the class or method and ask the assistant to <b>generate unit tests</b> (JUnit 5 + Mockito), naming the edge cases you care about (nulls, empty lists, boundary values, exceptions).</li><li><b>Read every assertion.</b> Generated tests often assert what the code does, not what it should do. Fix them against the specification.</li><li>Run them, check coverage, then ask for missing cases ("add tests for the 409 conflict path").</li><li>Never paste secrets or production data into prompts; keep the assistant's repository context to what it needs.</li></ol>
${code('java', `
@ExtendWith(MockitoExtension.class)
class OrderServiceTest {
    @Mock OrderRepository repo;
    @Mock Publisher events;
    @InjectMocks OrderService service;

    @Test void createOnce_returnsExistingOrder_whenIdempotencyKeyRepeats() {
        Order existing = new Order("o-1", "c-1", new BigDecimal("42.50"));
        when(repo.findByIdempotencyKey("key-1")).thenReturn(Optional.of(existing));
        Order result = service.createOnce("key-1", new NewOrder("c-1", List.of()));
        assertThat(result).isEqualTo(existing);
        verify(repo, never()).save(any());          // no second order
        verifyNoInteractions(events);               // no duplicate event
    }
}`, 'A reviewed, generated test')}
<h3>Integration tests in Cloud Build</h3>
<p>All steps of a build share the <code>cloudbuild</code> Docker network, so a step can start an emulator container that later steps reach by name.</p>
${code('yaml', `
steps:
- id: start-pubsub-emulator
  name: gcr.io/cloud-builders/docker
  args: ['run', '-d', '--network=cloudbuild', '--name=pubsub',
         'gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators',
         'gcloud', 'beta', 'emulators', 'pubsub', 'start', '--host-port=0.0.0.0:8085', '--project=test-proj']
- id: integration-tests
  name: maven:3.9-eclipse-temurin-21
  entrypoint: mvn
  args: ['-B', 'verify', '-Pintegration']
  env: ['PUBSUB_EMULATOR_HOST=pubsub:8085']
- id: build                      # only reached if the tests passed (a failing step stops the build)
  name: gcr.io/cloud-builders/docker
  args: ['build', '-t', '\${_IMAGE}', '.']`, 'cloudbuild.yaml with an emulator')}
<ul class="tick"><li>A non-zero exit code fails the step and the build: nothing is pushed or deployed.</li><li>For end-to-end checks against real services: deploy a Cloud Run revision with <code>--no-traffic --tag=test</code>, run tests against the tag URL, then promote.</li><li>Publish test reports as build artifacts (e.g. to Cloud Storage) for review.</li></ul>
${diagram({ w: 760, h: 160, nodes: [['u', 20, 50, 130, 56, 'Unit tests', 'ext', 'fast, mocks'], ['i', 190, 50, 160, 56, 'Integration tests', 'svc', 'emulators in Cloud Build'], ['e', 390, 50, 170, 56, 'E2E on tagged revision', 'svc', '--no-traffic --tag=test'], ['p', 600, 50, 140, 56, 'Promote', 'ext', 'canary → 100%']],

T({ id: 'runevents', sub: '3.1', obj: ['3.1.2', '3.1.3'], title: 'Invoking Cloud Run with triggers and writing event receivers', mins: 50,
 lead: 'A Cloud Run service can be called by people, by schedules, by queues and by events. Each caller authenticates differently and sends a different request body.',
 goals: ['Wire Eventarc triggers and Pub/Sub push subscriptions to Cloud Run with the right IAM', 'Parse a Pub/Sub push envelope and a CloudEvent in Spring Boot', 'Return the right status codes so retries work for you'],
 body: () => `
${compareHTML('triggers')}
${code('json', `
// Pub/Sub push request body (HTTP POST to your endpoint)
{
  "message": {
    "data": "eyJvcmRlcklkIjoibzEyMyJ9",            // base64 of {"orderId":"o123"}
    "attributes": { "type": "order.created" },
    "messageId": "1234567890",
    "publishTime": "2026-11-13T10:00:00Z",
    "orderingKey": "c-42"
  },
  "subscription": "projects/my-proj/subscriptions/billing"
}`, 'Pub/Sub push envelope')}
${code('java', `
@RestController
public class PushReceiver {
    record PubSubMessage(String data, Map<String, String> attributes, String messageId) {}
    record Envelope(PubSubMessage message, String subscription) {}

    @PostMapping("/pubsub")
    public ResponseEntity<Void> receive(@RequestBody Envelope env) {
        if (env == null || env.message() == null) return ResponseEntity.badRequest().build();   // 4xx: still retried until DLQ
        if (dedupe.seen(env.message().messageId())) return ResponseEntity.noContent().build();
        String json = new String(Base64.getDecoder().decode(env.message().data()), StandardCharsets.UTF_8);
        billing.handle(json);
        return ResponseEntity.noContent().build();     // any 2xx (102, 200, 201, 202, 204) = ack
    }
}`, 'Push receiver in Spring Boot')}
${code('bash', `
# Eventarc: Pub/Sub topic → Cloud Run (Eventarc creates the subscription for you)
gcloud eventarc triggers create orders-to-billing --location=europe-west1 \\
  --destination-run-service=billing --destination-run-path=/events \\
  --event-filters="type=google.cloud.pubsub.topic.v1.messagePublished" \\
  --transport-topic=projects/my-proj/topics/orders \\
  --service-account=eventarc-sa@my-proj.iam.gserviceaccount.com
gcloud projects add-iam-policy-binding my-proj --member=serviceAccount:eventarc-sa@my-proj.iam.gserviceaccount.com --role=roles/eventarc.eventReceiver
gcloud run services add-iam-policy-binding billing --region=europe-west1 \\
  --member=serviceAccount:eventarc-sa@my-proj.iam.gserviceaccount.com --role=roles/run.invoker
# Cloud Storage direct events also need the Cloud Storage service agent to publish to Pub/Sub:
gcloud projects add-iam-policy-binding my-proj --role=roles/pubsub.publisher \\
  --member=serviceAccount:$(gcloud storage service-agent --project=my-proj)`, 'Eventarc wiring and IAM')}
<ul class="tick"><li>Eventarc delivers <b>CloudEvents in binary mode</b>: attributes in <code>ce-*</code> headers (<code>ce-id</code>, <code>ce-type</code>, <code>ce-source</code>, <code>ce-subject</code>), payload in the body. For Pub/Sub sources the body is the push envelope above.</li><li><b>Audit Log</b> triggers need the relevant audit logs enabled (Data Access logs are off by default for most services).</li><li>Respond within the ack deadline / request timeout; for long work, ack quickly and hand off to Cloud Tasks or a job.</li></ul>`,
 traps: ['The receiving service should not allow unauthenticated calls: the push subscription or Eventarc trigger uses a service account with <code>roles/run.invoker</code>.', 'A 4xx response is still a failure for Pub/Sub push: the message is retried (until the dead-letter limit). Do not return 500 for bad input forever; route it to a DLQ.', '"Trigger when an object is uploaded" with no events arriving → check the Cloud Storage service agent\'s pubsub.publisher role and the event filter (bucket name, event type).', 'Eventarc and Pub/Sub are at-least-once: receivers must be idempotent.'],
 mistakes: ['Doing 10 minutes of work inside the push request with a 10-second ack deadline.', 'Decoding the CloudEvent body as if it were the message itself (forgetting the envelope).'],
 consider: { perf: 'Push delivery adapts its rate to your success rate (slow start, backs off on errors).', sec: 'OIDC tokens with audience checks; ingress internal where possible.', cost: 'Each delivery attempt is a Cloud Run request; failing receivers cost money too.' },
 docs: [['Pub/Sub push to Cloud Run', 'https://cloud.google.com/run/docs/triggering/pubsub-push'], ['Eventarc triggers', 'https://cloud.google.com/eventarc/docs/run/create-trigger-cloud-audit-logs'], ['Event receiver (CloudEvents)', 'https://cloud.google.com/eventarc/docs/cloudevents'], ['Push subscription responses', 'https://cloud.google.com/pubsub/docs/push']],
 books: [['bm', 'Ch. 4 Communication Styles']] });

T({ id: 'apigee', sub: '3.1', obj: ['3.1.4'], title: 'Versioning, exposing and securing APIs with Apigee', mins: 40,
 lead: 'Apigee sits between consumers and your Cloud Run services. You version APIs with proxies and base paths, expose them through products, and secure them with policies.',
 goals: ['Structure API versions as proxies/base paths and deploy proxy revisions to environments', 'Package APIs as API products with quotas for developer apps', 'Secure the backend call to Cloud Run with a Google ID token'],
 body: () => `
${diagram({ w: 760, h: 210, nodes: [['app', 20, 80, 120, 50, 'Partner app', 'client', 'API key / OAuth'], ['eg', 180, 70, 170, 70, 'Apigee environment group', 'svc', 'api.shop.com'], ['v1', 400, 20, 160, 50, 'proxy orders-v1', 'auth', '/v1/orders'], ['v2', 400, 120, 160, 50, 'proxy orders-v2', 'auth', '/v2/orders'], ['r1', 600, 20, 140, 50, 'Cloud Run rev v1', 'ext'], ['r2', 600, 120, 140, 50, 'Cloud Run v2', 'ext']],
 edges: [['app', 'eg', ''], ['eg', 'v1', ''], ['eg', 'v2', ''], ['v1', 'r1', 'ID token'], ['v2', 'r2', 'ID token']] }, 'Two versions live side by side; consumers move from /v1 to /v2 at their own pace.')}
<div class="tscroll"><table><thead><tr><th>Concept</th><th>Meaning</th></tr></thead><tbody>
<tr><td>API proxy</td><td>Façade with a base path (/v1/orders) and flows of policies, pointing to a target backend</td></tr>
<tr><td>Proxy revision</td><td>Immutable version of the proxy config; deploy revision N to an environment, roll back by deploying N-1</td></tr>
<tr><td>Environment / environment group</td><td>test, prod… attached to hostnames (api.shop.com)</td></tr>
<tr><td>API product</td><td>Bundle of proxies/paths with quotas and scopes that developers subscribe to</td></tr>
<tr><td>Developer app</td><td>Gets credentials (consumer key/secret) for one or more products</td></tr></tbody></table></div>
${code('xml', `
<!-- Request flow: verify the key, smooth bursts, enforce the product quota -->
<VerifyAPIKey name="verify-key"><APIKey ref="request.header.x-api-key"/></VerifyAPIKey>
<SpikeArrest name="spike"><Rate>50ps</Rate></SpikeArrest>
<Quota name="quota"><UseQuotaConfigInAPIProduct stepName="verify-key"/></Quota>

<!-- Target endpoint: call a private Cloud Run service as the Apigee service account -->
<HTTPTargetConnection>
  <Authentication>
    <GoogleIDToken><Audience>https://orders-v2-abc-ew.a.run.app</Audience></GoogleIDToken>
  </Authentication>
  <URL>https://orders-v2-abc-ew.a.run.app</URL>
</HTTPTargetConnection>`, 'Apigee policies')}
<ul class="tick"><li>Versioning strategies: URI (<code>/v2</code>, most common), header or query parameter. Keep v1 until consumers migrate; announce deprecation (e.g. <code>Deprecation</code>/<code>Sunset</code> headers).</li><li>Other security policies: OAuthV2 (Apigee as authorization server), VerifyJWT, JSON/XML threat protection, CORS; Cloud Armor in front for WAF.</li></ul>`,
 traps: ['"Roll back an API change in Apigee" → deploy the previous proxy revision.', '"Different partners get different rate limits" → API products with quotas, assigned through developer apps.', 'The backend Cloud Run service should require IAM; Apigee authenticates with a Google ID token (GoogleIDToken) for the Apigee runtime service account.'],
 mistakes: ['Breaking changes in place on /v1.', 'Public Cloud Run backends that can be called around Apigee.'],
 consider: { perf: 'Response caching policy in Apigee for read-heavy endpoints.', sec: 'Keys identify apps; OAuth/JWT identify users; mTLS for partners.', cost: 'Apigee pricing is per environment and API calls; heavy for simple use cases (consider API Gateway).' },
 docs: [['Apigee API proxies', 'https://cloud.google.com/apigee/docs/api-platform/fundamentals/understanding-apis-and-api-proxies'], ['API products', 'https://cloud.google.com/apigee/docs/api-platform/publish/what-api-product'], ['Google authentication to backends', 'https://cloud.google.com/apigee/docs/api-platform/security/google-auth/overview'], ['Deploying proxy revisions', 'https://cloud.google.com/apigee/docs/api-platform/deploy/ui-deploy-overview']],
 books: [['bm', 'Ch. 5 (handling change between microservices, versioning)'], ['rit', 'Ch. 14 Handling Versions']] });

T({ id: 'gkedeploy', sub: '3.2', obj: ['3.2.1'], title: 'Deploying containerized applications to GKE', mins: 50,
 lead: 'A GKE deployment is a set of Kubernetes objects: the Deployment runs Pods, the Service gives them a stable address, and the Gateway or Ingress exposes them. Identity and configuration come from Workload Identity, ConfigMaps and Secrets.',
 goals: ['Write Deployment, Service, ConfigMap and Gateway/HTTPRoute manifests', 'Use Workload Identity Federation for GKE to call Google APIs without keys', 'Roll out, watch and roll back'],
 body: () => `
${diagram({ w: 760, h: 220, nodes: [['gw', 20, 85, 140, 56, 'Gateway', 'svc', 'external ALB'], ['svc', 200, 85, 140, 56, 'Service', 'svc', 'ClusterIP :80'], ['p1', 390, 20, 150, 46, 'Pod orders', 'ext'], ['p2', 390, 90, 150, 46, 'Pod orders', 'ext'], ['p3', 390, 160, 150, 46, 'Pod orders', 'ext'], ['ksa', 590, 60, 150, 56, 'KSA → IAM', 'auth', 'Workload Identity'], ['cm', 590, 140, 150, 50, 'ConfigMap / Secret', 'data']],
 edges: [['gw', 'svc', 'HTTPRoute'], ['svc', 'p1', ''], ['svc', 'p2', ''], ['svc', 'p3', ''], ['p2', 'ksa', '', 'dash'], ['p3', 'cm', '', 'dash']] }, 'Deployment → ReplicaSet → Pods; Service selects Pods by label; Gateway exposes the Service.')}
${code('yaml', `
apiVersion: apps/v1
kind: Deployment
metadata: { name: orders, namespace: shop }
spec:
  replicas: 3
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app: orders } }
  template:
    metadata: { labels: { app: orders } }
    spec:
      serviceAccountName: orders-ksa
      containers:
      - name: orders
        image: europe-west1-docker.pkg.dev/my-proj/shop/orders@sha256:4f1c…
        ports: [{ containerPort: 8080 }]
        envFrom: [{ configMapRef: { name: orders-config } }]
        resources: { requests: { cpu: 500m, memory: 512Mi }, limits: { memory: 512Mi } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: orders-config, namespace: shop }
data: { SPRING_PROFILES_ACTIVE: prod, PAYMENTS_URL: "http://payments.shop.svc.cluster.local" }
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: external-http, namespace: shop }
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners: [{ name: http, protocol: HTTP, port: 80 }]`, 'Deployment, ConfigMap, Gateway')}
${code('bash', `
# Workload Identity Federation for GKE: give the Kubernetes service account an IAM role directly
gcloud projects add-iam-policy-binding my-proj --role=roles/pubsub.publisher \\
  --member="principal://iam.googleapis.com/projects/123456789/locations/global/workloadIdentityPools/my-proj.svc.id.goog/subject/ns/shop/sa/orders-ksa"
kubectl apply -f k8s/
kubectl rollout status deployment/orders -n shop
kubectl rollout undo deployment/orders -n shop          # back to the previous ReplicaSet
kubectl get pods -n shop -o wide; kubectl describe pod <pod> -n shop; kubectl logs <pod> -n shop`, 'Identity, rollout, rollback')}
<div class="tscroll"><table><thead><tr><th>Service type</th><th>Reachable from</th></tr></thead><tbody><tr><td>ClusterIP</td><td>Inside the cluster (default)</td></tr><tr><td>NodePort</td><td>Each node's IP on a port (rarely used directly)</td></tr><tr><td>LoadBalancer</td><td>External (or internal with annotation) passthrough Network LB</td></tr><tr><td>Gateway / Ingress</td><td>HTTP(S) via an Application Load Balancer with routing rules</td></tr></tbody></table></div>`,
 traps: ['Pods calling Google APIs → Workload Identity Federation for GKE, not node service account scopes or key files mounted as Secrets.', 'Kubernetes Secrets are base64, not encrypted by default: enable application-layer secrets encryption with KMS or use Secret Manager (CSI driver / add-on).', '<code>maxUnavailable: 0</code> + readiness probes = zero-downtime rolling updates.', 'Rollback of a Deployment: <code>kubectl rollout undo</code>.'],
 mistakes: ['Using <code>:latest</code> with imagePullPolicy defaults and never knowing which version runs.', 'No resource requests: bad scheduling and unpredictable Autopilot defaults.'],
 consider: { perf: 'Spread replicas across zones (regional cluster, topology spread constraints); PodDisruptionBudgets during upgrades.', sec: 'Workload Identity, least-privilege KSA mappings, Network Policies, Binary Authorization.', cost: 'Autopilot: pay per Pod requests, so set realistic requests.' },
 docs: [['Deploy a stateless app', 'https://cloud.google.com/kubernetes-engine/docs/how-to/stateless-apps'], ['Workload Identity Federation for GKE', 'https://cloud.google.com/kubernetes-engine/docs/concepts/workload-identity'], ['Gateway API on GKE', 'https://cloud.google.com/kubernetes-engine/docs/concepts/gateway-api'], ['Secrets encryption', 'https://cloud.google.com/kubernetes-engine/docs/how-to/encrypting-secrets']],
 books: [['k8p', 'Ch. 3 Declarative Deployment · Ch. 19–20 Configuration'], ['bm', 'Ch. 8 Deployment']] });

T({ id: 'probes', sub: '3.2', obj: ['3.2.2'], title: 'Kubernetes health checks: startup, readiness and liveness probes', mins: 40,
 lead: 'Three probes, three different reactions: startup holds the others back, readiness removes a Pod from traffic, liveness restarts the container. Most outages from probes come from mixing them up.',
 goals: ['Configure startup, readiness and liveness probes with sensible thresholds', 'Map Spring Boot Actuator health groups to probes', 'Diagnose CrashLoopBackOff and traffic to unready Pods'],
 body: () => `
${compareHTML('probesc')}
<h3>Try it: probe simulator</h3>
<div data-sim="probes"></div>
${code('yaml', `
containers:
- name: orders
  image: …/orders@sha256:…
  ports: [{ containerPort: 8080 }]
  startupProbe:                     # JVM start can take ~40 s: allow up to 30 × 5 s = 150 s
    httpGet: { path: /actuator/health/liveness, port: 8080 }
    periodSeconds: 5
    failureThreshold: 30
  readinessProbe:                   # ready = dependencies OK, can take traffic
    httpGet: { path: /actuator/health/readiness, port: 8080 }
    periodSeconds: 5
    failureThreshold: 3
  livenessProbe:                    # alive = process not stuck; do NOT check the database here
    httpGet: { path: /actuator/health/liveness, port: 8080 }
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3`, 'Probes for a Spring Boot service')}
${code('yaml', `
# application.yaml: enable liveness/readiness groups (on by default when running in Kubernetes)
management:
  endpoint.health.probes.enabled: true
  health.readinessstate.enabled: true
  health.livenessstate.enabled: true`, 'Spring Boot Actuator')}
<ul class="tick"><li>Probe types: <code>httpGet</code>, <code>tcpSocket</code>, <code>grpc</code>, <code>exec</code>.</li><li>Settings: <code>initialDelaySeconds</code>, <code>periodSeconds</code>, <code>timeoutSeconds</code>, <code>failureThreshold</code>, <code>successThreshold</code>.</li><li>Load balancers created by GKE Ingress/Gateway also run their own health checks; by default they derive them from the readiness probe or use the backend's health check configuration.</li></ul>`,
 traps: ['"Pods restart in a loop while the app is still starting" → add a startupProbe (or raise its failureThreshold), not a bigger liveness initialDelaySeconds guess.', '"Traffic reaches Pods before caches are warm" → readiness probe.', 'Liveness probes that check the database make every Pod restart when the database blips: cascading failure. Put dependencies in readiness only.', 'A failing readiness probe never restarts a container; a failing liveness probe does.'],
 mistakes: ['Same endpoint and thresholds for all three probes by habit.', 'Timeouts shorter than a GC pause.'],
 consider: { perf: 'Probes are requests too: keep health endpoints cheap.', sec: 'Expose actuator endpoints on a management port or restrict them.', cost: 'Restart loops waste capacity and delay rollouts.' },
 docs: [['Configure probes (Kubernetes)', 'https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/'], ['GKE Ingress health checks', 'https://cloud.google.com/kubernetes-engine/docs/concepts/ingress#health_checks'], ['Spring Boot Kubernetes probes', 'https://docs.spring.io/spring-boot/reference/actuator/endpoints.html#actuator.endpoints.kubernetes-probes']],
 books: [['k8p', 'Ch. 4 Health Probe · Ch. 5 Managed Lifecycle'], ['rit', 'Ch. 5 Stability Patterns (Fail Fast)']] });

T({ id: 'hpa', sub: '3.2', obj: ['3.2.3'], title: 'Horizontal Pod Autoscaler: scaling, metrics and behavior', mins: 45,
 lead: 'HPA changes the number of replicas so that a metric stays near a target. Know the formula, which metrics it can use, and how to stop it from flapping.',
 goals: ['Compute desired replicas from the HPA formula', 'Scale on CPU/memory, custom Pod metrics and external metrics (e.g. Pub/Sub backlog)', 'Tune behavior: stabilization windows and scale-up/down policies'],
 body: () => `
<p class="formula">desiredReplicas = ceil( currentReplicas × currentMetricValue ÷ targetValue )</p>
<h3>Try it: HPA calculator</h3>
<div data-sim="hpa"></div>
${code('yaml', `
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: orders, namespace: shop }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: orders }
  minReplicas: 3
  maxReplicas: 30
  metrics:
  - type: Resource
    resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }   # % of the CPU *request*
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300          # default for scale down: avoid flapping
      policies: [{ type: Percent, value: 50, periodSeconds: 60 }]
    scaleUp:
      policies: [{ type: Pods, value: 4, periodSeconds: 15 }]`, 'HPA on CPU')}
${code('yaml', `
# Workers scale on Pub/Sub backlog (external metric from Cloud Monitoring via the metrics adapter)
metrics:
- type: External
  external:
    metric:
      name: pubsub.googleapis.com|subscription|num_undelivered_messages
      selector: { matchLabels: { resource.labels.subscription_id: shipping } }
    target: { type: AverageValue, averageValue: "100" }      # ~100 queued messages per Pod`, 'HPA on an external metric')}
<ul class="tick"><li><b>Utilization</b> targets are relative to <b>resource requests</b>: Pods without requests cannot be scaled on CPU utilization.</li><li>Metric types: <code>Resource</code> (CPU, memory), <code>Pods</code> (custom per-Pod metric, e.g. requests/s), <code>Object</code> (a metric of another object), <code>External</code> (outside the cluster, e.g. queue depth).</li><li>HPA adds Pods; the <b>cluster autoscaler</b> (Standard) or Autopilot adds nodes for them.</li><li>Do not run VPA in auto mode and HPA on the same CPU/memory metric; use VPA for recommendations or with HPA on custom metrics.</li></ul>`,

T({ id: 'dataconn', sub: '4.1', obj: ['4.1.1', '4.1.2'], title: 'Connecting to and reading/writing Cloud SQL, Firestore, Spanner and Cloud Storage', mins: 55,

 goals: ['Connect to Cloud SQL from Cloud Run and GKE (connector, Auth Proxy, private IP) with a sized pool', 'Read and write Firestore with transactions and batched writes', 'Stream large objects to and from Cloud Storage with preconditions'],
 body: () => `
${compareHTML('sqlconn')}
${code('yaml', `
spring:
  datasource:
    url: jdbc:postgresql:///orders?cloudSqlInstance=my-proj:europe-west1:orders-db&socketFactory=com.google.cloud.sql.postgres.SocketFactory
    username: app
    password: \${DB_PASSWORD}            # from Secret Manager via --set-secrets
    hikari:
      maximum-pool-size: 10              # × max instances must stay under the DB connection limit
      minimum-idle: 2
      connection-timeout: 10000
      max-lifetime: 1800000`, 'Cloud SQL from Spring Boot (Java connector + HikariCP)')}
${code('java', `
Firestore db = FirestoreOptions.getDefaultInstance().getService();     // create once, reuse

// Transaction: read and write atomically (retried automatically on contention)
db.runTransaction(tx -> {
    DocumentReference ref = db.collection("products").document("p1");
    long stock = tx.get(ref).get().getLong("stock");
    if (stock < 1) throw new IllegalStateException("out of stock");
    tx.update(ref, "stock", stock - 1);
    return null;
}).get();

// Batched write: up to 500 operations, all or nothing, no reads
WriteBatch batch = db.batch();
batch.set(db.collection("orders").document("o-1"), Map.of("total", 42.5, "status", "NEW"));
batch.update(db.collection("users").document("u-42"), "lastOrder", "o-1");
batch.commit().get();

// Query (needs a composite index for status + createdAt)
List<QueryDocumentSnapshot> recent = db.collection("orders").whereEqualTo("status", "NEW")
    .orderBy("createdAt", Query.Direction.DESCENDING).limit(20).get().get().getDocuments();`, 'Firestore')}
${code('java', `
Storage storage = StorageOptions.getDefaultInstance().getService();
// Stream an upload (resumable under the hood) instead of loading the file in memory
try (WriteChannel w = storage.writer(BlobInfo.newBuilder("shop-uploads", "exports/orders.csv").setContentType("text/csv").build());
     OutputStream out = Channels.newOutputStream(w)) {
    exporter.writeCsv(out);
}
// Optimistic concurrency: only overwrite if nobody changed the object since we read generation g
Blob current = storage.get(BlobId.of("shop-config", "prices.json"));
storage.create(BlobInfo.newBuilder(current.getBlobId()).build(), newJson,
    Storage.BlobTargetOption.generationMatch());                       // 412 if it changed`, 'Cloud Storage')}
${code('java', `
DatabaseClient spanner = SpannerOptions.getDefaultInstance().getService()
    .getDatabaseClient(DatabaseId.of("my-proj", "shop-instance", "shop"));   // session pool inside
spanner.readWriteTransaction().run(tx -> {
    tx.buffer(Mutation.newInsertBuilder("Orders").set("CustomerId").to("c-1").set("OrderId").to("o-9")
        .set("CreatedAt").to(Value.COMMIT_TIMESTAMP).set("Total").to(new BigDecimal("42.50")).build());
    return null;
});`, 'Spanner')}`,
 traps: ['"Too many connections" from Cloud Run → pool per instance × max instances; reduce either, or use a connection pooler (e.g. managed connection pooling).', 'Create client objects (Firestore, Storage, Spanner, Pub/Sub) once per process: they hold connection pools and token caches.', 'Large uploads: resumable uploads or signed URLs; for many concurrent writers to the same object use generation preconditions.', 'Firestore batched writes: no reads, max 500 operations; transactions: reads before writes, automatic retries.'],

 docs: [['Connect from Cloud Run to Cloud SQL', 'https://cloud.google.com/sql/docs/postgres/connect-run'], ['Managing database connections', 'https://cloud.google.com/sql/docs/postgres/manage-connections'], ['Firestore transactions and batched writes', 'https://cloud.google.com/firestore/docs/manage-data/transactions'], ['Cloud Storage request preconditions', 'https://cloud.google.com/storage/docs/request-preconditions'], ['Spanner Java client', 'https://cloud.google.com/spanner/docs/reference/libraries']],
