T({ id: 'messagingcode', sub: '4.1', obj: ['4.1.3'], title: 'Publishing and consuming messages in application code', mins: 40,
 lead: 'Objective 1.1 covered Pub/Sub design. Here the focus is the code: batching, flow control, error handling and the Spring abstractions.',
 goals: ['Tune publisher batching and handle publish futures', 'Configure subscriber flow control and concurrency', 'Use Spring Cloud GCP PubSubTemplate and test against the emulator'],
 body: () => `
${code('java', `
Publisher publisher = Publisher.newBuilder(TopicName.of("my-proj", "orders"))
    .setBatchingSettings(BatchingSettings.newBuilder()
        .setElementCountThreshold(100L)                    // send when 100 messages…
        .setRequestByteThreshold(1_000_000L)               // …or 1 MB…
        .setDelayThreshold(Duration.ofMillis(50)).build()) // …or 50 ms, whichever first
    .build();
ApiFuture<String> f = publisher.publish(PubsubMessage.newBuilder().setData(ByteString.copyFromUtf8(json)).build());
ApiFutures.addCallback(f, new ApiFutureCallback<>() {
    public void onSuccess(String id) { log.info("published {}", id); }
    public void onFailure(Throwable t) { log.error("publish failed, will retry/outbox", t); }
}, MoreExecutors.directExecutor());
// on shutdown: publisher.shutdown(); publisher.awaitTermination(30, TimeUnit.SECONDS);`, 'Publisher: batching and callbacks')}
${code('java', `
Subscriber subscriber = Subscriber.newBuilder(ProjectSubscriptionName.of("my-proj", "shipping"), receiver)
    .setFlowControlSettings(FlowControlSettings.newBuilder()
        .setMaxOutstandingElementCount(200L)               // at most 200 unacked messages in memory
        .setMaxOutstandingRequestBytes(50L * 1024 * 1024).build())
    .setParallelPullCount(2)
    .build();
subscriber.startAsync().awaitRunning();`, 'Subscriber: flow control')}
${code('java', `
@Service
class OrderEvents {
    private final PubSubTemplate pubSub;
    OrderEvents(PubSubTemplate pubSub) { this.pubSub = pubSub; }

    void orderCreated(Order o) { pubSub.publish("orders", o.toJson(), Map.of("type", "order.created")); }

    @PostConstruct
    void listen() {
        pubSub.subscribe("shipping", msg -> {
            shipping.handle(msg.getPubsubMessage().getData().toStringUtf8());
            msg.ack();
        });
    }
}`, 'Spring Cloud GCP PubSubTemplate')}
<ul class="tick"><li><b>Transactional outbox</b>: write the event to an outbox table in the same database transaction as the business change, then publish it; avoids "saved but never published".</li><li>Pub/Sub messages up to 10 MB; put large payloads in Cloud Storage and publish a reference.</li><li>Alternatives: Managed Service for Apache Kafka when you need the Kafka API and ecosystem.</li></ul>`,
 traps: ['High publish throughput → batching settings; low latency for single messages → small delay threshold.', 'Subscriber running out of memory under backlog → flow control.', 'Ack only after processing succeeds; nack (or let the deadline pass) to retry.'],
 mistakes: ['Creating a new Publisher per message.', 'Ignoring the publish future, so failures disappear silently.'],
 consider: { perf: 'Batching raises throughput; flow control protects the consumer; parallel pull for very high rates.', sec: 'Separate publisher and subscriber service accounts.', cost: 'Batching reduces request overhead; Pub/Sub bills by bytes (minimum per request).' },
 docs: [['Publisher batching', 'https://cloud.google.com/pubsub/docs/batch-messaging'], ['Flow control', 'https://cloud.google.com/pubsub/docs/flow-control-messages'], ['Spring Cloud GCP Pub/Sub', 'https://googlecloudplatform.github.io/spring-cloud-gcp/reference/html/index.html#cloud-pubsub']],

T({ id: 'apiconsume', sub: '4.2', obj: ['4.2.1', '4.2.2', '4.2.3'], title: 'Consuming Google Cloud APIs: enabling, calling, paging, batching, retrying', mins: 55,
 lead: 'Every Google Cloud product is an API. The exam checks that you call them efficiently (fewer requests, smaller responses) and robustly (retries with backoff, idempotency), as a service account.',
 goals: ['Enable APIs and diagnose "API not enabled" errors', 'Choose Cloud Client Libraries, REST, gRPC or API Explorer', 'Apply batching, partial responses (fields / field masks), pagination and caching', 'Retry with truncated exponential backoff and jitter, as a service account'],
 body: () => `
${code('bash', `
gcloud services enable run.googleapis.com pubsub.googleapis.com secretmanager.googleapis.com
gcloud services list --enabled
# Error you will see if you forget:  403 PERMISSION_DENIED … SERVICE_DISABLED: Cloud Pub/Sub API has not been used in project … or it is disabled`, 'Enable services')}
${compareHTML('apiopts')}
<h3>Efficient calls</h3>
${code('bash', `
TOKEN=$(gcloud auth print-access-token)
# Partial response: only the fields you need
curl -H "Authorization: Bearer $TOKEN" \\
  "https://compute.googleapis.com/compute/v1/projects/my-proj/zones/europe-west1-b/instances?fields=items(name,status),nextPageToken&maxResults=50"
# Next page
curl -H "Authorization: Bearer $TOKEN" "…/instances?pageToken=NEXT_PAGE_TOKEN&maxResults=50"`, 'REST: fields + pagination')}
${code('java', `
// Client libraries page for you: iterateAll() follows nextPageToken transparently
Storage storage = StorageOptions.getDefaultInstance().getService();
for (Blob b : storage.list("shop-uploads", Storage.BlobListOption.prefix("2026/"),
        Storage.BlobListOption.pageSize(500),
        Storage.BlobListOption.fields(Storage.BlobField.NAME, Storage.BlobField.SIZE)).iterateAll()) {
    total += b.getSize();
}`, 'Java: paging + restricted fields')}
<ul class="tick"><li><b>Batching</b>: send many operations per request where the API supports it (Pub/Sub publish batching, Cloud Storage JSON batch requests, Firestore batched writes, BigQuery Storage Write API appends).</li><li><b>Restrict data</b>: <code>fields=</code> on REST (partial response) and <b>field masks</b> (<code>read_mask</code>, <code>update_mask</code>) on gRPC/newer APIs.</li><li><b>Paginate</b>: <code>pageSize</code>/<code>maxResults</code> + <code>pageToken</code>; never assume one call returns everything.</li><li><b>Cache</b>: results that change rarely (TTL in memory or Memorystore); conditional requests with <b>ETags</b> (<code>If-None-Match</code> → 304) where supported.</li></ul>
<h3>Errors and retries</h3>
<div data-sim="backoff"></div>
<div class="tscroll"><table><thead><tr><th>Response</th><th>Retry?</th></tr></thead><tbody><tr><td>429 Too Many Requests / RESOURCE_EXHAUSTED</td><td>Yes, with backoff (quota or rate limit)</td></tr><tr><td>500, 502, 503, 504 / UNAVAILABLE, DEADLINE_EXCEEDED</td><td>Yes, with backoff, if the operation is idempotent</td></tr><tr><td>400, 401, 403, 404 / INVALID_ARGUMENT, PERMISSION_DENIED</td><td>No: fix the request, credentials or permissions</td></tr><tr><td>408 Request Timeout</td><td>Yes</td></tr><tr><td>409 / ABORTED (e.g. transaction contention)</td><td>Retry the whole transaction</td></tr></tbody></table></div>
${code('java', `
// Client libraries already retry; tune with RetrySettings (truncated exponential backoff)
RetrySettings retry = RetrySettings.newBuilder()
    .setInitialRetryDelay(Duration.ofMillis(200)).setRetryDelayMultiplier(2.0).setMaxRetryDelay(Duration.ofSeconds(32))
    .setTotalTimeout(Duration.ofSeconds(120)).build();
SecretManagerServiceSettings.Builder s = SecretManagerServiceSettings.newBuilder();
s.accessSecretVersionSettings().setRetrySettings(retry);`, 'RetrySettings')}
<h3>As a service account</h3>
<p>Attach the service account to the runtime (Cloud Run, GKE via Workload Identity, Compute Engine) and let ADC find it. Grant only the roles the calls need. Locally, impersonate it instead of downloading a key. OAuth scopes for Google APIs: use <code>https://www.googleapis.com/auth/cloud-platform</code> and control access with IAM.</p>`,
 traps: ['"SERVICE_DISABLED" / "API has not been used in project" → enable the API in that project (and wait a few minutes).', '"Response payloads are huge; we only need names" → fields parameter / field mask.', '"Listing returns only 1,000 items" → follow nextPageToken.', 'Retrying with fixed short intervals during an outage overloads the service: exponential backoff + jitter + a maximum.', 'Retrying non-idempotent operations can duplicate side effects: use request IDs/idempotency keys where the API offers them.'],
 mistakes: ['Retrying 403 errors forever.', 'One API call per item when a batch or list call exists.'],
 consider: { perf: 'gRPC client libraries are the fastest path; fewer, smaller requests reduce latency.', sec: 'Service accounts with least privilege; no API keys for Google Cloud APIs that need authorisation.', cost: 'Many APIs bill per operation; partial responses and caching save calls and egress.' },
 docs: [['Enable and disable services', 'https://cloud.google.com/service-usage/docs/enable-disable'], ['Client libraries explained', 'https://cloud.google.com/apis/docs/client-libraries-explained'], ['Partial responses (performance tips)', 'https://cloud.google.com/storage/docs/json_api#partial-response'], ['Retry strategy (Cloud Storage)', 'https://cloud.google.com/storage/docs/retry-strategy'], ['API Explorer', 'https://developers.google.com/apis-explorer']],
 books: [['rit', 'Ch. 5 Stability Patterns (Timeouts, Circuit Breaker)'], ['sre', 'Ch. 22 Addressing Cascading Failures (retries, backoff)']] });

T({ id: 'instrument', sub: '4.3', obj: ['4.3.1', '4.3.4'], title: 'Instrumenting code: structured logs, metrics, traces and trace IDs', mins: 55,
 lead: 'Observability is designed in: logs that machines can parse, metrics you can alert on, and traces that follow a request across services, all joined by the same trace ID.',
 goals: ['Write structured JSON logs that Cloud Logging parses (severity, trace, labels)', 'Emit custom metrics and traces with OpenTelemetry', 'Propagate trace context across HTTP and Pub/Sub and correlate logs with traces'],
 body: () => `
${diagram({ w: 760, h: 200, nodes: [['fe', 20, 75, 140, 56, 'frontend', 'ext', 'span A'], ['or', 220, 75, 140, 56, 'orders', 'ext', 'span B'], ['ps', 420, 20, 130, 46, 'Pub/Sub', 'svc', 'attr: traceparent'], ['bi', 420, 120, 130, 56, 'billing', 'ext', 'span C'], ['ob', 600, 70, 140, 66, 'Cloud Observability', 'svc', 'Trace + Logging']],
 edges: [['fe', 'or', 'traceparent'], ['or', 'ps', ''], ['ps', 'bi', ''], ['fe', 'ob', '', 'dash'], ['or', 'ob', '', 'dash'], ['bi', 'ob', '', 'dash']] }, 'Every hop forwards the same trace ID; every log line records it. One click from a log entry opens the whole request.')}
<h3>Try it: one request, three services</h3>
<div data-sim="trace"></div>
${code('json', `
{"severity":"ERROR",
 "message":"payment declined for order o-123",
 "logging.googleapis.com/trace":"projects/my-proj/traces/4bf92f3577b34da6a3ce929d0e0e4736",
 "logging.googleapis.com/spanId":"00f067aa0ba902b7",
 "logging.googleapis.com/labels":{"orderId":"o-123"},
 "httpRequest":{"requestMethod":"POST","requestUrl":"/v1/orders","status":402,"latency":"0.231s"}}`, 'One structured log line (stdout)')}
<ul class="tick"><li>On Cloud Run and GKE, anything written to stdout/stderr as single-line JSON becomes a structured log entry with these special fields. Spring Boot 3.4+ can log JSON natively (<code>logging.structured.format.console</code>); Spring Cloud GCP adds trace correlation.</li><li>Incoming trace context: W3C <code>traceparent: 00-&lt;trace-id&gt;-&lt;span-id&gt;-01</code> (and the legacy <code>X-Cloud-Trace-Context: TRACE_ID/SPAN_ID;o=1</code>). Forward it on every outgoing call; for Pub/Sub, put it in a message attribute.</li><li><b>Metrics</b>: built-in platform metrics (request count, latency, instance count), <b>log-based metrics</b> (count matching log entries), and <b>custom metrics</b> via OpenTelemetry or Prometheus (Managed Service for Prometheus).</li></ul>
${code('bash', `
# OpenTelemetry Java agent: automatic spans for Spring MVC, JDBC, HTTP clients, gRPC
java -javaagent:/otel/opentelemetry-javaagent.jar \\
  -Dotel.service.name=orders -Dotel.traces.exporter=otlp -Dotel.metrics.exporter=otlp \\
  -jar app.jar
# Export to Google Cloud via an OpenTelemetry Collector (or the Google Cloud exporters / OTLP endpoint)`, 'Auto-instrumentation')}
${code('java', `
Tracer tracer = GlobalOpenTelemetry.getTracer("orders");
Span span = tracer.spanBuilder("reserve-stock").setAttribute("order.id", orderId).startSpan();
try (Scope s = span.makeCurrent()) {
    inventory.reserve(orderId);                       // child spans join this trace
} catch (Exception e) { span.recordException(e); span.setStatus(StatusCode.ERROR); throw e; }
finally { span.end(); }

LongCounter declined = GlobalOpenTelemetry.getMeter("orders").counterBuilder("payments.declined").build();
declined.add(1, Attributes.of(AttributeKey.stringKey("reason"), "insufficient_funds"));`, 'Manual span and custom metric')}
${code('bash', `
# Log-based metric: count payment declines, then alert on it
gcloud logging metrics create payment_declines \\
  --description="Declined payments" --log-filter='resource.type="cloud_run_revision" AND jsonPayload.message:"payment declined"'`, 'Log-based metric')}`,

T({ id: 'troubleshoot', sub: '4.3', obj: ['4.3.2', '4.3.3', '4.3.5'], title: 'Troubleshooting with Google Cloud Observability, Error Reporting and AI assistance', mins: 55,
 lead: 'Troubleshooting questions describe a symptom and ask for the tool or the first step. Know which signal answers which question, and how SLOs turn signals into alerts.',
 goals: ['Use Logs Explorer, Metrics Explorer, Trace, Profiler and Error Reporting for the right symptom', 'Define SLIs/SLOs, error budgets and burn-rate alerts', 'Use Error Reporting and AI-assisted observability (Gemini Cloud Assist) in an investigation'],
 body: () => `
${compareHTML('obs')}
<h3>Symptom → first step</h3>
<div class="tscroll"><table><thead><tr><th>Symptom</th><th>Look at</th></tr></thead><tbody>
<tr><td>p99 latency doubled, averages fine</td><td>Cloud Trace: slow traces' waterfall → which span grew (DB query, external API)</td></tr>
<tr><td>New exception type after a deploy</td><td>Error Reporting: new error group, first seen = deploy time → roll back traffic, fix</td></tr>
<tr><td>CPU high, no traffic increase</td><td>Cloud Profiler CPU flame graph (hot method, regex, serialization)</td></tr>
<tr><td>Memory grows until restart / OOMKilled</td><td>Profiler heap; GKE events (<code>OOMKilled</code>), container memory metrics</td></tr>
<tr><td>Cloud Run 429/503 under load</td><td>Instance count vs max instances, concurrency, request latency metrics</td></tr>
<tr><td>Pods in CrashLoopBackOff</td><td><code>kubectl describe pod</code> events, previous container logs (<code>kubectl logs --previous</code>), probes</td></tr>
<tr><td>Permission denied calling an API</td><td>Logs (audit logs, error details) + Policy Troubleshooter</td></tr></tbody></table></div>
<h3>SLOs and alerting</h3>
<div data-sim="slo"></div>
<ul class="tick"><li><b>SLI</b>: good events ÷ valid events (e.g. requests &lt; 300 ms and not 5xx). <b>SLO</b>: target over a window (99.9% / 30 days). <b>Error budget</b>: 1 − SLO.</li><li>Alert on <b>burn rate</b> (how fast you spend the budget), not on every error. Cloud Monitoring supports service monitoring with SLOs and burn-rate alert policies.</li><li>Uptime checks probe public or private endpoints and feed alerting.</li></ul>
${code('bash', `
# Logs Explorer query language (also usable with gcloud)
gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="orders" AND severity>=ERROR AND timestamp>="2026-11-13T09:00:00Z"' --limit=50 --format=json
# All log lines of one request
gcloud logging read 'trace="projects/my-proj/traces/4bf92f3577b34da6a3ce929d0e0e4736"'`, 'Querying logs')}
<h3>Error Reporting</h3>
<ul class="tick"><li>Groups errors automatically from logs that contain stack traces (or entries formatted as error events), across Cloud Run, GKE, Compute Engine and functions.</li><li>Shows first/last seen, occurrences, affected versions; set status (open, acknowledged, resolved, muted) and notifications for new errors.</li><li>An error that comes back after being marked resolved reopens.</li></ul>
<h3>AI-assisted observability</h3>
<ul class="tick"><li><b>Gemini Cloud Assist</b> in the console can explain a log entry or error, summarise what changed, and run <b>investigations</b> that combine logs, metrics, configuration and recent changes to propose likely root causes and next steps.</li><li>Natural-language help writes Logging queries and PromQL; treat suggestions as hypotheses and confirm them with the data.</li></ul>
<h3>Incident walk-through</h3>
<ol class="steps"><li>Alert: SLO burn rate high on <i>checkout</i>.</li><li>Dashboard: errors started 10:42; deployment of revision 00021 at 10:40.</li><li>Error Reporting: new group <code>NullPointerException in PriceService.apply</code>, first seen 10:41.</li><li>Mitigate: move traffic back to 00020 (Cloud Run update-traffic). Errors drop.</li><li>Trace + logs for a failing request (same trace ID) show a missing field from the pricing API.</li><li>Fix, add a test, redeploy with a canary; write the postmortem.</li></ol>`,
 traps: ['"Find which line of code uses the most CPU in production" → Cloud Profiler (low overhead, continuous).', '"Be notified when a new kind of exception appears" → Error Reporting notifications.', '"Which downstream call causes latency" → Cloud Trace.', 'Mitigate first (roll back), then find the root cause.', 'Alerting on raw error counts creates noise; alert on SLO burn rate.'],
 mistakes: ['Debugging production by adding print statements and redeploying under pressure.', 'Ignoring the deploy timeline when errors start.'],
 consider: { perf: 'Profiler and tracing are designed for always-on production use with sampling.', sec: 'Restrict who can read logs that may contain personal data; use log views.', cost: 'Log retention beyond defaults and high-volume custom metrics cost money; route old logs to Cloud Storage/BigQuery.' },
 docs: [['Logs Explorer', 'https://cloud.google.com/logging/docs/view/logs-explorer-interface'], ['Error Reporting', 'https://cloud.google.com/error-reporting/docs'], ['Cloud Trace', 'https://cloud.google.com/trace/docs/overview'], ['Cloud Profiler', 'https://cloud.google.com/profiler/docs/about-profiler'], ['SLO monitoring', 'https://cloud.google.com/stackdriver/docs/solutions/slo-monitoring'], ['Gemini Cloud Assist investigations', 'https://cloud.google.com/gemini/docs/cloud-assist/investigations']],

const SIMS = {};
// ---- platform chooser
SIMS.chooser = el => {
  const Q = [['k8s', 'Must use the Kubernetes API (Helm charts, operators, DaemonSets)'], ['node', 'Needs node-level control (privileged pods, custom node images, kernel modules)'], ['os', 'Needs OS access, Windows, or licensed software tied to a VM'], ['proto', 'Uses UDP or non-HTTP TCP protocols'], ['state', 'Stateful server with local persistent disk'], ['long', 'Single requests longer than 60 minutes or continuous background processing'], ['zero', 'Traffic is spiky; should cost nothing when idle'], ['ops', 'Team wants minimal operations'], ['batch', 'Finite batch job (runs to completion)'], ['event', 'Small handler for a cloud event (file uploaded, message published)']];
  el.innerHTML = `<div class="sim"><div class="simhead"><b>Platform chooser</b><span class="muted">Tick the requirements in the scenario</span></div><div class="chk">${Q.map(q => `<label><input type="checkbox" id="ch-${q[0]}" value="${q[0]}"> ${q[1]}</label>`).join('')}</div><div class="simout" aria-live="polite"></div></div>`;
  const out = $('.simout', el);
  const run = () => {
    const on = new Set($$('input:checked', el).map(i => i.value)); const why = [];
    let pick;
    if (on.has('os')) { pick = 'Compute Engine'; why.push('OS-level access or VM-bound licensing rules out containers-as-a-service.'); }
    else if (on.has('node')) { pick = 'GKE Standard'; why.push('Node-level customisation needs node pools you control; Autopilot restricts privileged workloads.'); }
    else if (on.has('k8s') || on.has('proto') || on.has('state')) { pick = 'GKE Autopilot'; if (on.has('k8s')) why.push('Kubernetes API required.'); if (on.has('proto')) why.push('Cloud Run serves HTTP(S)/gRPC/WebSockets only; GKE exposes any TCP/UDP port via Services and Network Load Balancers.'); if (on.has('state')) why.push('StatefulSets with PersistentVolumes; Cloud Run has no persistent local disk.'); why.push('Autopilot is the default unless you need node control.'); }
    else if (on.has('batch') && !on.has('event')) { pick = 'Cloud Run jobs'; why.push('Run-to-completion tasks with parallelism and retries, no endpoint.'); }
    else if (on.has('event') && !on.has('long')) { pick = 'Cloud Run functions'; why.push('Small event handler deployed from source, triggered through Eventarc.'); }
    else if (on.has('long')) { pick = 'GKE Autopilot (or Cloud Run with instance-based billing + min instances)'; why.push('Request timeout tops out at 60 minutes on Cloud Run services; continuous workers need always-allocated CPU or a cluster.'); }
    else { pick = 'Cloud Run service'; if (on.has('zero')) why.push('Scales to zero; pay only while serving.'); if (on.has('ops')) why.push('No cluster or VM to operate.'); if (!on.size) why.push('With no special constraint, the most managed option wins.'); }
    if (on.has('zero') && /GKE|Compute/.test(pick)) why.push('Note: scale-to-zero conflicts with this choice; check which requirement the scenario ranks higher.');
    out.innerHTML = `<p class="pick">→ <b>${pick}</b></p><ul>${why.map(w => `<li>${w}</li>`).join('')}</ul>`;
  };
  $$('input', el).forEach(i => i.onchange = run); $('#ch-zero', el).checked = true; $('#ch-ops', el).checked = true; run();
};
// ---- capacity calculator
SIMS.capacity = el => {
  el.innerHTML = `<div class="sim"><div class="simhead"><b>Cloud Run capacity calculator</b><span class="muted">Instances ≈ RPS × latency ÷ concurrency</span></div>
  <div class="form4"><label>Peak requests / second<input type="number" id="cap-rps" value="400" min="1"></label><label>Avg latency (ms)<input type="number" id="cap-lat" value="250" min="1"></label><label>Concurrency per instance<input type="number" id="cap-conc" value="80" min="1" max="1000"></label><label>Target utilisation %<input type="number" id="cap-util" value="70" min="10" max="100"></label>
  <label>Min instances<input type="number" id="cap-min" value="1" min="0"></label><label>Max instances<input type="number" id="cap-max" value="20" min="1"></label><label>DB pool size per instance<input type="number" id="cap-pool" value="10" min="1"></label><label>DB max connections<input type="number" id="cap-db" value="100" min="1"></label></div><div class="simout" aria-live="polite"></div></div>`;
  const v = id => +$('#cap-' + id, el).value || 0;
  const run = () => {
    const inflight = v('rps') * v('lat') / 1000; const need = Math.max(v('min'), Math.ceil(inflight / (v('conc') * v('util') / 100)));
    const got = Math.min(need, v('max')); const capped = need > v('max'); const conns = got * v('pool'); const dbBad = conns > v('db');
    const safeMax = Math.floor(v('db') / v('pool'));
    out.innerHTML = `<div class="kpis"><div><span>${inflight.toFixed(0)}</span>requests in flight</div><div><span>${need}</span>instances needed</div><div class="${capped ? 'bad' : ''}"><span>${got}</span>instances allowed</div><div class="${dbBad ? 'bad' : ''}"><span>${conns}</span>DB connections</div></div>
     <ul>${capped ? `<li class="bad">Max instances (${v('max')}) is below the need: requests will queue, then fail with 429/503. Raise max instances or concurrency, or reduce latency.</li>` : '<li>Max instances leaves headroom.</li>'}
     ${dbBad ? `<li class="bad">${got} × ${v('pool')} connections exceeds the database limit (${v('db')}). Set max instances ≤ ${safeMax}, shrink the pool, or add a connection proxy/pooler.</li>` : `<li>Database connections stay under the limit (safe max instances for this pool size: ${safeMax}).</li>`}
     <li>Min instances ${v('min')}: ${v('min') ? 'avoids most cold starts; you pay for these while idle.' : 'scale to zero: first request after idle pays a cold start.'}</li></ul>`;
  };
  const out = $('.simout', el); $$('input', el).forEach(i => i.oninput = run); run();
};

    draw();
  });

};
// ---- Pub/Sub delivery
SIMS.pubsub = el => {
  el.innerHTML = `<div class="sim"><div class="simhead"><b>Pub/Sub delivery</b><span class="muted">10 messages, two ordering keys, a flaky subscriber</span></div>
  <div class="form4"><label>Ack deadline (s)<input type="number" id="ps-ack" value="10" min="10" max="600"></label><label>Processing time (s)<input type="number" id="ps-proc" value="6" min="1" max="900"></label><label>Failure rate %<input type="number" id="ps-fail" value="30" min="0" max="100"></label><label>Max delivery attempts<input type="number" id="ps-max" value="5" min="5" max="100"></label></div>
  <div class="chk"><label><input type="checkbox" id="ps-dlq" checked> Dead-letter topic</label><label><input type="checkbox" id="ps-ord"> Message ordering (keys A, B)</label><label><input type="checkbox" id="ps-poison" checked> Message 4 is a poison message (always fails)</label><label><input type="checkbox" id="ps-idem" checked> Idempotent consumer</label></div>
  <div class="row"><button class="btn primary sm" type="button" id="ps-run">Run simulation</button></div><div class="pslog" aria-live="polite"></div></div>`;
  const run = () => {
    const ack = +$('#ps-ack', el).value, proc = +$('#ps-proc', el).value, fail = +$('#ps-fail', el).value / 100, max = +$('#ps-max', el).value;
    const dlq = $('#ps-dlq', el).checked, ord = $('#ps-ord', el).checked, poison = $('#ps-poison', el).checked, idem = $('#ps-idem', el).checked;
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const rows = []; let effects = 0, dups = 0, dead = 0, stuck = 0;
    const blocked = { A: false, B: false };
    for (let m = 1; m <= 10; m++) {
      const key = m % 2 ? 'A' : 'B'; const tl = []; let done = false, sideDone = false;
      if (ord && blocked[key]) { tl.push(['blk', 'blocked: earlier message with key ' + key + ' not acked']); stuck++; rows.push([m, key, tl]); continue; }
      for (let a = 1; a <= (dlq ? max : 12); a++) {
        const willFail = (poison && m === 4) || rnd() < fail;
        if (proc > ack && !willFail) { // work finishes after the deadline → redelivered while processing
          if (!sideDone || !idem) { effects++; if (sideDone) dups++; } sideDone = true; tl.push(['late', 'late ack → redelivered']); continue; }
        if (willFail) { tl.push(['nack', 'nack']); continue; }
        if (!sideDone || !idem) { effects++; if (sideDone) dups++; } sideDone = true; tl.push(['ack', 'ack']); done = true; break;
      }
      if (!done) { if (dlq) { tl.push(['dlq', '→ dead-letter topic']); dead++; } else { tl.push(['loop', 'keeps retrying… (no DLQ)']); if (ord) blocked[key] = true; } }
      rows.push([m, key, tl]);
    }
    $('.pslog', el).innerHTML = `<div class="kpis"><div><span>${effects}</span>side effects executed</div><div class="${dups ? 'bad' : ''}"><span>${dups}</span>duplicate effects</div><div><span>${dead}</span>in dead-letter topic</div><div class="${stuck ? 'bad' : ''}"><span>${stuck}</span>blocked by ordering</div></div>
    <div class="tscroll"><table class="pst"><thead><tr><th>Msg</th>${ord ? '<th>Key</th>' : ''}<th>Delivery attempts</th></tr></thead><tbody>${rows.map(r => `<tr><td>#${r[0]}</td>${ord ? `<td>${r[1]}</td>` : ''}<td>${r[2].map((t, i) => `<span class="att ${t[0]}" title="${t[1]}">${t[0] === 'blk' || t[0] === 'dlq' || t[0] === 'loop' ? t[1] : (i + 1) + ' ' + t[1]}</span>`).join('')}</td></tr>`).join('')}</tbody></table></div>
    <ul class="lessons">${proc > ack ? '<li>Processing time exceeds the ack deadline: messages are redelivered while still being processed. Raise the deadline or let the client library extend leases.</li>' : ''}${dups ? '<li>Duplicates reached your side effects: make the consumer idempotent (dedupe on message ID or a business key).</li>' : ''}${!dlq && poison ? '<li>Without a dead-letter topic the poison message is retried forever.</li>' : ''}${stuck ? '<li>With ordering, an unacked message blocks every later message with the same key.</li>' : ''}${dlq && dead ? '<li>The dead-letter topic isolates messages that keep failing, so the rest keep flowing. Monitor and replay it.</li>' : ''}</ul>`;
  };
  $('#ps-run', el).onclick = run; run();
};

  el.innerHTML = `<div class="sim"><div class="simhead"><b>SLO and error budget</b></div><div class="form4"><label>SLO %<input type="number" id="s-slo" value="99.9" step="0.01" min="90" max="99.999"></label><label>Window (days)<input type="number" id="s-win" value="30" min="1"></label><label>Requests per day<input type="number" id="s-rpd" value="2000000" min="1"></label><label>Bad requests so far<input type="number" id="s-bad" value="25000" min="0"></label><label>Days elapsed<input type="number" id="s-el" value="10" min="1"></label></div><div class="simout"></div></div>`;
  const run = () => { const v = id => +$('#s-' + id, el).value; const total = v('rpd') * v('win'); const budget = total * (1 - v('slo') / 100); const used = v('bad') / budget * 100; const ideal = v('el') / v('win') * 100; const burn = used / ideal;
    const mins = v('win') * 24 * 60 * (1 - v('slo') / 100);
    $('.simout', el).innerHTML = `<div class="kpis"><div><span>${Math.round(budget).toLocaleString('en')}</span>bad requests allowed per window</div><div><span>${mins.toFixed(0)} min</span>equivalent full downtime</div><div class="${used > 100 ? 'bad' : ''}"><span>${used.toFixed(0)}%</span>budget used</div><div class="${burn > 1 ? 'bad' : ''}"><span>${burn.toFixed(2)}×</span>burn rate</div></div><p>${used > 100 ? 'Budget exhausted: freeze risky releases, focus on reliability.' : burn > 2 ? 'Burning fast: at this rate the budget runs out early. A burn-rate alert should page.' : burn > 1 ? 'Slightly faster than sustainable; watch it.' : 'Within budget: room for releases and experiments.'}</p>`; };
  $$('input', el).forEach(i => i.oninput = run); run();
};

q('rt1', '1.2.1', 'scenario', 'A bank must keep transaction PDFs in Cloud Storage for 7 years. Nobody, including project owners, may delete or overwrite them early, and the rule itself must not be weakened later. What do you configure?', ['A 7-year retention policy on the bucket, then lock it with Bucket Lock', 'A lifecycle rule that deletes objects after 7 years', 'Object Versioning', 'IAM deny policy for storage.objects.delete'], 0, 'A locked retention policy is WORM: deletes and overwrites fail until objects are 7 years old, and the policy cannot be reduced or removed.', { 1: 'Deletes after 7 years but does not prevent early deletion.', 2: 'Keeps old versions but anyone can delete them.', 3: 'Admins can change IAM; it is not irreversible.' }, D + 'storage/docs/bucket-lock');
q('rt2', '1.2.1', 'scenario', 'Log exports in a bucket are read often for 30 days, rarely for a year, then never. How do you minimise cost automatically?', ['Lifecycle rules: SetStorageClass to Nearline at 30 days, Coldline at 90 days, Delete at 365 days', 'A retention policy of 365 days', 'A Cloud Scheduler job that copies objects to another bucket', 'Bucket Lock'], 0, 'Lifecycle Management changes storage class and deletes by age without code.', { 1: 'Prevents deletion; does not move or delete data.', 2: 'Custom code for a built-in feature.', 3: 'Locks retention, unrelated to cost.' }, D + 'storage/docs/lifecycle');

// ---------- metrics ----------
function metrics() {
  const st = P.obj(); let cov = 0; Object.values(OBJ).forEach(o => cov += (st[o.id] === 2 ? 1 : st[o.id] === 1 ? .5 : 0) * o.w);
  const ex = P.exams().slice(-3); const prac = ex.length ? ex.reduce((a, e) => a + e.score, 0) / ex.length : 0;
  const ans = P.answers(); const n = Object.keys(ans).length; const ok = Object.values(ans).filter(a => a.last).length;
  const readiness = Math.round(cov * .5 + prac * .5);
  return { cov: Math.round(cov), prac: Math.round(prac), readiness, n, ok, topics: Object.values(P.topics()).filter(Boolean).length, exams: P.exams().length };
}
function secCoverage(sec) { const st = P.obj(); const items = Object.values(OBJ).filter(o => o.sec === sec.id); return Math.round(items.reduce((a, o) => a + (st[o.id] === 2 ? 1 : st[o.id] === 1 ? .5 : 0), 0) / items.length * 100); }
function readinessLabel(r) { return r >= 80 ? ['Ready', 'good'] : r >= 60 ? ['Nearly there', 'warn'] : r >= 30 ? ['Building', 'info'] : ['Getting started', 'muted']; }

V.flashcards = () => `<header class="pagehead"><h1>Flashcards</h1><p class="lead">${FC.length} cards. Cards you get wrong come back more often.</p></header><div class="panel" id="fcbox"></div>`;
function mountCards() {
  const box = store.get('fc', {}); const el = $('#fcbox'); if (!el) return;
  const pick = () => { const w = FC.map((c, i) => ({ i, w: [0, 6, 3, 1][box[i] || 1] })); const tot = w.reduce((a, x) => a + x.w, 0); let r = Math.random() * tot; for (const x of w) { r -= x.w; if (r <= 0) return x.i; } return 0; };
  let i = pick();
  const draw = (flip) => { const c = FC[i]; const counts = [1, 2, 3].map(b => FC.filter((_, k) => (box[k] || 1) === b).length);
    el.innerHTML = `<div class="fc ${flip ? 'flip' : ''}"><span class="chip ghost">${c[2]}</span><p class="front">${c[0]}</p>${flip ? `<p class="back">${c[1]}</p>` : ''}</div>
    <div class="row center">${flip ? `<button type="button" class="btn" data-fc="1">Again</button><button type="button" class="btn primary" data-fc="3">Got it</button>` : `<button type="button" class="btn primary" data-fc="show">Show answer</button>`}</div>
    <p class="muted small center">Box 1 (learning): ${counts[0]} · Box 2: ${counts[1]} · Box 3 (known): ${counts[2]}</p>`;
    $$('[data-fc]', el).forEach(b => b.onclick = () => { const a = b.dataset.fc; if (a === 'show') return draw(true); box[i] = a === '1' ? 1 : Math.min(3, (box[i] || 1) + 1); store.set('fc', box); i = pick(); draw(false); }); };
  draw(false);
}

function mountExamSetup() {
  const s = $('#ex-start'); if (!s) return;
  s.onclick = () => {
    const n = +$('#ex-n').value, mode = $('#ex-mode').value, pool = $('#ex-pool').value, timed = $('#ex-time').value === '1'; const ans = P.answers();
    let list = Q.filter(x => pool === 'all' || (pool === 'wrong' ? ans[x.id] && !ans[x.id].last : !ans[x.id]));
    if (!list.length) { $('#exrun').innerHTML = '<p class="panel">No questions in that pool yet.</p>'; return; }
    list = list.sort(() => Math.random() - .5).slice(0, n);
    EX = { list, i: 0, chosen: {}, flags: {}, mode, end: timed ? Date.now() + Math.round(list.length * 120 / 55 * 60000) : 0 };
    $('#exsetup').hidden = true; drawExam();
  };
}

  const el = $('#exrun'); if (!el || !EX) return; const x = EX.list[EX.i];
  el.innerHTML = `<section class="panel exam"><div class="exbar"><span>Question ${EX.i + 1} of ${EX.list.length}</span><span class="timer" id="ex-timer"></span><button type="button" class="btn sm" data-flag>${EX.flags[x.id] ? '⚑ Flagged' : '⚐ Flag for review'}</button></div>
   <div class="exmap">${EX.list.map((q, k) => `<button type="button" data-go="${k}" class="${k === EX.i ? 'cur' : ''} ${EX.chosen[q.id] ? 'ans' : ''} ${EX.flags[q.id] ? 'fl' : ''}" aria-label="question ${k + 1}">${k + 1}</button>`).join('')}</div>
   ${qHTML(x, { ns: 'ex', check: EX.mode === 'practice' })}
   <div class="row"><button type="button" class="btn" data-prev ${EX.i ? '' : 'disabled'}>← Previous</button><button type="button" class="btn" data-next ${EX.i < EX.list.length - 1 ? '' : 'disabled'}>Next →</button><span class="grow"></span><button type="button" class="btn primary" data-submit>Submit exam</button></div><p class="muted small" data-subw></p></section>`;
  const qel = $('.q', el); (EX.chosen[x.id] || []).forEach(v => { const inp = $(`input[value="${v}"]`, qel); if (inp) inp.checked = true; });
  if (EX.mode === 'practice' && EX.chosen[x.id] && EX.done && EX.done[x.id]) { qFeedback(x, qel, EX.chosen[x.id]); const b = $('[data-check]', qel); if (b) b.remove(); }
  $$('input', qel).forEach(inp => inp.onchange = () => { EX.chosen[x.id] = qChosen(qel); $$('.exmap button')[EX.i].classList.add('ans'); });
  const ck = $('[data-check]', qel); if (ck) ck.addEventListener('click', () => { EX.chosen[x.id] = qChosen(qel); EX.done = EX.done || {}; EX.done[x.id] = 1; }, true);
  $('[data-flag]', el).onclick = () => { EX.flags[x.id] = !EX.flags[x.id]; drawExam(); };
  $$('[data-go]', el).forEach(b => b.onclick = () => { EX.i = +b.dataset.go; drawExam(); });
  $('[data-prev]', el).onclick = () => { EX.i--; drawExam(); }; $('[data-next]', el).onclick = () => { EX.i++; drawExam(); };
  $('[data-submit]', el).onclick = () => { const un = EX.list.filter(q => !EX.chosen[q.id] || !EX.chosen[q.id].length).length; const w = $('[data-subw]', el);
    if (un && !w.dataset.ok) { w.dataset.ok = 1; w.innerHTML = `<b>${un} unanswered.</b> Press Submit again to finish anyway.`; return; } finishExam(); };
  clearInterval(exTimer); const tick = () => { const t = $('#ex-timer'); if (!t) return clearInterval(exTimer); if (!EX.end) { t.textContent = ''; return; } const left = Math.max(0, EX.end - Date.now()); t.textContent = `${Math.floor(left / 60000)}:${String(Math.floor(left / 1000) % 60).padStart(2, '0')} left`; t.classList.toggle('bad', left < 120000); if (!left) finishExam(); }; tick(); exTimer = setInterval(tick, 1000);
}
function finishExam() {
  clearInterval(exTimer); const by = {}; let ok = 0;
  EX.list.forEach(x => { const c = EX.chosen[x.id] || []; const g = qGrade(x, c); if (g) ok++; if (!(EX.done && EX.done[x.id])) P.record(x.id, g); const k = x.obj.split('.').slice(0, 2).join('.'); by[k] = by[k] || [0, 0]; by[k][1]++; if (g) by[k][0]++; });
  const score = Math.round(ok / EX.list.length * 100); const weak = Object.entries(by).sort((a, b) => a[1][0] / a[1][1] - b[1][0] / b[1][1])[0];
  const h = P.exams(); h.push({ d: Date.now(), n: EX.list.length, score, weak: weak ? weak[0] : '' }); store.set('exams', h.slice(-30));
  const el = $('#exrun');
  el.innerHTML = `<section class="panel"><h2>Result: ${score}% <small class="muted">(${ok}/${EX.list.length})</small></h2><p class="muted">Google does not publish a passing score. Treat 80% or more on unseen practice questions as a good sign.</p>
   <h3>By objective</h3>${Object.entries(by).sort().map(([k, v]) => `<div class="secbar"><span class="chip s${k[0]}">${k}</span><span class="st">${SUBMAP[k].title}</span><span class="w">${v[0]}/${v[1]}</span><div class="bar"><i class="s${k[0]}" style="width:${v[0] / v[1] * 100}%"></i></div></div>`).join('')}
   <h3>Review</h3><div class="row"><label><input type="checkbox" id="rv-wrong" checked> Show only wrong answers</label></div><div id="review"></div><div class="row"><a class="btn primary" href="#mock-exam" data-again>New exam</a></div></section>`;
  const rv = () => { const only = $('#rv-wrong').checked; $('#review').innerHTML = EX.list.filter(x => !only || !qGrade(x, EX.chosen[x.id] || [])).map(x => qHTML(x, { ns: 'rv', check: false })).join('') || '<p>All correct.</p>';
    $$('#review .q').forEach(qe => { const x = QMAP[qe.dataset.q]; const c = EX.chosen[x.id] || []; c.forEach(v => { const i = $(`input[value="${v}"]`, qe); if (i) i.checked = true; }); qFeedback(x, qe, c); if (!c.length) $('.qfb', qe).insertAdjacentHTML('afterbegin', '<p class="hint">Not answered.</p>'); }); };
  $('#rv-wrong').onchange = rv; rv(); $('[data-again]', el).onclick = e => { e.preventDefault(); EX = null; render(); };
}

// ---------- search ----------
let SQ = '';
const IDX = [];
TOPICS.forEach(t => IDX.push({ k: 'Topic', title: t.title, href: '#topic-' + t.id, text: (t.title + ' ' + t.lead + ' ' + strip(t.body()) + ' ' + t.traps.join(' ')).toLowerCase() }));
GLOSS.forEach(g => IDX.push({ k: 'Glossary', title: g[0], href: '#glossary', text: (g[0] + ' ' + g[1] + ' ' + strip(g[2])).toLowerCase() }));
Object.values(OBJ).forEach(o => IDX.push({ k: 'Objective ' + o.id, title: o.text, href: '#obj-' + o.sub.replace('.', '-'), text: o.text.toLowerCase() }));
Q.forEach(x => IDX.push({ k: 'Question ' + x.obj, title: strip(x.q).slice(0, 110) + '…', href: '#topic-' + (TOPICS.find(t => t.obj.includes(x.obj)) || TOPICS[0]).id, text: strip(x.q + ' ' + x.o.join(' ') + ' ' + x.why).toLowerCase() }));
V.search = () => { const terms = SQ.toLowerCase().split(/\s+/).filter(Boolean); const res = IDX.map(r => ({ r, s: terms.reduce((a, t) => a + (r.title.toLowerCase().includes(t) ? 3 : 0) + (r.text.includes(t) ? 1 : 0), 0) })).filter(x => terms.every(t => x.r.text.includes(t) || x.r.title.toLowerCase().includes(t))).sort((a, b) => b.s - a.s).slice(0, 40);
  return `<header class="pagehead"><h1>Search: “${esc(SQ)}”</h1><p class="lead">${res.length} results</p></header><ul class="results">${res.map(x => `<li><a href="${x.r.href}"><span class="chip ghost">${x.r.k}</span> ${x.r.title}</a></li>`).join('') || '<li class="muted">No results. Try a service name, e.g. "Eventarc" or "affinity".</li>'}</ul>`; };

// ---------- router ----------
function render() {
  let v = (location.hash || '').slice(1) || store.get('last', 'dashboard') || 'dashboard'; let html;
  if (v === 'search' && !SQ) v = 'dashboard';
  if (v.startsWith('topic-')) html = V.topic(v.slice(6)); else if (v.startsWith('obj-')) html = V.obj(v.slice(4).replace('-', '.')); else html = (V[v] || V.dashboard)();
  if (!V[v] && !v.startsWith('topic-') && !v.startsWith('obj-')) v = 'dashboard';
  const main = $('#main'); main.innerHTML = html; mountAll(main); markNav(v); P.visit(v);
  if (v === 'flashcards') mountCards(); if (v === 'mock-exam') { mountExamSetup(); if (EX) { $('#exsetup').hidden = true; drawExam(); } }
  document.title = 'PCD Exam Lab';
  window.scrollTo(0, 0); document.body.classList.remove('navopen');
}
addEventListener('hashchange', render);
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-obj]')) { const b = t.closest('[data-obj]'); P.setObj(b.dataset.obj, +b.dataset.st); $$(`[data-obj="${b.dataset.obj}"]`).forEach(x => x.className = x === b ? 'on s' + b.dataset.st : ''); }
  if (t.closest('[data-done]')) { const id = t.closest('[data-done]').dataset.done; const now = !P.topics()[id]; P.setTopic(id, now); if (now) TMAP[id].obj.forEach(o => { if (!P.obj()[o]) P.setObj(o, 1); }); buildNav(); render(); }
  if (t.closest('[data-mark]')) { const b = t.closest('[data-mark]'); b.textContent = P.toggleMark(b.dataset.mark) ? '★ Bookmarked' : '☆ Bookmark'; }
  if (t.closest('[data-reset1]')) $('[data-reset2]').hidden = false;
  if (t.closest('[data-reset4]')) $('[data-reset2]').hidden = true;
  if (t.closest('[data-reset3]')) { ['obj', 'topics', 'marks', 'notes', 'answers', 'exams', 'recent', 'last', 'fc', 'time'].forEach(store.del); buildNav(); location.hash = '#dashboard'; render(); }
  if (t.closest('#navbtn')) document.body.classList.toggle('navopen');
});
document.addEventListener('input', e => {
  if (e.target.classList.contains('note')) { const id = 'topic-' + e.target.id.slice(5); P.setNote(id, e.target.value); const s = $('[data-saved]'); if (s) s.textContent = 'Saved in this browser.'; }
  if (e.target.id === 'gq') { const v = e.target.value.toLowerCase(); $$('.gloss > div').forEach(d => d.hidden = !d.dataset.g.includes(v)); }
});
$('#searchform').addEventListener('submit', e => { e.preventDefault(); SQ = $('#q').value.trim(); if (!SQ) return; if (location.hash === '#search') render(); else location.hash = '#search'; });
document.addEventListener('keydown', e => { if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $('#q').focus(); } });
$('#theme').onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; store.set('theme', r.dataset.theme); };
(() => { const th = store.get('theme', null); if (th) document.documentElement.dataset.theme = th; })();
buildNav(); render();

</script>
